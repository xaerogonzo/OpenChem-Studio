# Regenerates the Ketcher third-party notices on a Dependabot bump of the Ketcher lockfile.
#
# WHY. `src/openchem/resources/ketcher/THIRD-PARTY-NOTICES.txt` records the hash of
# `tools/ketcher-host/package-lock.json`, and `tests/test_sources_are_current.py::
# test_the_ketcher_third_party_notices_are_current` fails when they disagree -- on purpose, since a
# notices file listing what the dependencies USED to be reads as attribution while attributing the wrong
# thing. Every Dependabot bump of that lockfile therefore failed suite 2/2 until someone ran
# `tools/build_ketcher_notices.py` by hand (#167, #211).
#
# WHAT IT NEEDS THAT THE SUITE DOES NOT. A push made with the built-in GITHUB_TOKEN does not start new
# workflow runs, so a fix pushed that way would leave the PR showing the OLD red result on the OLD commit
# and nothing would ever re-test it. The push is therefore made with the repository secret
# NOTICES_PUSH_TOKEN, a fine-grained token with Contents: read and write on this repository only. Without
# the secret this workflow does nothing and says so; it never fails a PR.
#
# SAFETY, since this is `pull_request_target` (it has a write token and runs the BASE branch's workflow):
#   * it never executes anything from the PR. The generator is the base branch's; only the PR's
#     package.json and package-lock.json are copied in as DATA, and `npm ci --ignore-scripts` means no
#     dependency can run a lifecycle script during the install;
#   * it runs only for Dependabot's own PRs, only for a branch in this repository, and only when the
#     Ketcher lockfile changed;
#   * branch names reach the shell through the environment, never by expression substitution;
#   * it commits one file, and a second run on its own commit finds nothing to change and stops, so it
#     cannot loop.
name: ketcher-notices

on:
  pull_request_target:
    paths:
      - tools/ketcher-host/package-lock.json

permissions:
  contents: read

concurrency:
  group: ketcher-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: regenerate the Ketcher notices
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSH_TOKEN: ${{ secrets.NOTICES_PUSH_TOKEN }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Is the push token configured?
        id: token
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::notice title=Ketcher notices not regenerated::The NOTICES_PUSH_TOKEN secret is not set, so this workflow did nothing. Run tools/build_ketcher_notices.py by hand."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The BASE branch: the generator we trust.
      - name: Check out the base branch
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          path: base
          persist-credentials: false

      # The PR's branch: only its lockfile is read, and only this checkout is pushed from.
      - name: Check out the PR branch
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
          token: ${{ secrets.NOTICES_PUSH_TOKEN }}

      - name: Regenerate
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          # The PR's two manifests as DATA, into the trusted tree; nothing from the PR is run.
          cp pr/tools/ketcher-host/package.json pr/tools/ketcher-host/package-lock.json base/tools/ketcher-host/
          (cd base/tools/ketcher-host && npm ci --ignore-scripts --no-audit --no-fund)
          python3 base/tools/build_ketcher_notices.py
          cp base/src/openchem/resources/ketcher/THIRD-PARTY-NOTICES.txt \
             pr/src/openchem/resources/ketcher/THIRD-PARTY-NOTICES.txt

      - name: Commit and push if it changed
        if: steps.token.outputs.present == 'true'
        working-directory: pr
        run: |
          set -euo pipefail
          if git diff --quiet -- src/openchem/resources/ketcher/THIRD-PARTY-NOTICES.txt; then
            echo "The notices already match this lockfile; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/openchem/resources/ketcher/THIRD-PARTY-NOTICES.txt
          git commit -m "Regenerate the Ketcher third-party notices for this lockfile" \
                     -m "Automatic: tools/build_ketcher_notices.py, run by .github/workflows/ketcher-notices.yml. The notices record the lockfile's hash, which this bump changed."
          # No --force: if the branch moved meanwhile, this fails and Dependabot's own rebase wins.
          git push origin "HEAD:refs/heads/${HEAD_REF}"
