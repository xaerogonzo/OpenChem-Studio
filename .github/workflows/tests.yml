# The PR gate: the test suite plus every benchmark that can honestly run on
# a hosted runner.
#
# WINDOWS ONLY, DELIBERATELY. This application ships Windows-only -- the
# README badge says so, packaging is PyInstaller/Windows, and macOS/Linux are
# documented as untested. The suite is also webview-heavy (three QWebEngine
# backends), which works on a Windows runner without the xvfb and sandbox
# flags Linux would need. A green tick here therefore means green on the
# platform users actually run.
#
# LINUX IS NOW WIRED, AS A NON-BLOCKING SECOND RUNNER. This header used to
# say "deferred, not rejected ... worth doing eventually as a NON-BLOCKING
# job", and the `linux` job below is that. It does NOT gate a PR: this
# application ships Windows-only, and blocking a merge on a platform nobody
# ships would be noise. It exists to surface hidden environment assumptions,
# which hard experience says arrive ONE AT A TIME, each unblocking the next.
#
# NON-BLOCKING IS NOT INVISIBLE, and the difference is the whole design of
# that job. `continue-on-error` with no reporting produces a green run page
# hiding thirty Linux failures, which is the same decorative control this
# repository already documents in "A RED SUITE SILENTLY DISABLES EVERY GATE
# BEHIND IT". So the Linux job writes a full fingerprint to the run summary
# under `if: always()`, reports the suite's REAL exit status, and
# distinguishes "tests failed" from "the suite could not start" -- a parser
# that turns empty output into "0 failed" would be the same failure one
# level down.
#
# THE SAME JOBS RUN ON PUSH AND ON PULL_REQUEST, on purpose. A workflow whose
# job set differs between the two triggers produces the trap where a green
# push run sits beside a red PR, because the two were never running the same
# thing.

name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite + gating benchmarks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # OPSIN is a Java library and py2opsin shells out to a bare `java`.
      # Without it the naming round-trip tests SKIP rather than fail, which
      # would make this gate quietly weaker than it looks -- and the naming
      # benchmark below could not run at all.
      - name: Install Java (for OPSIN)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # NOT `--all-extras`. That pulls in `docking`, whose `vina` wheel builds
      # from source and needs Boost; the reference environment does not have
      # it either. These three are what the suite needs -- without them about
      # 40 tests fail on missing imports and it reads as a broken checkout.
      - name: Sync dependencies
        run: uv sync --extra ai --extra network --extra openbabel

      - name: Run the test suite
        run: uv run --no-sync python -u -m pytest -q -ra

      # Scored from a DIFFERENT WORKING DIRECTORY. py2opsin writes a fixed
      # temp filename into the current directory, so two OPSIN callers in one
      # directory crash each other -- and the suite above has just used it.
      - name: Naming benchmark (must stay 181/181)
        run: uv run --no-sync python .github/scripts/naming_gate.py

      # Pure RDKit and OPSIN, no external tools, so it genuinely runs here.
      # Reports per-rule TP/FP/TN/FN. The known 0.50 precision on
      # `cwc-1-a-6` is documented rather than gated, so this checks that the
      # benchmark RUNS and produces its table -- not that every rule is
      # perfect. A gate there would push someone to delete the honest edge
      # case rather than fix the rule.
      - name: Regulatory benchmark
        run: uv run --no-sync python benchmarks/regulatory/score.py

      # Validates every shipped ruleset without writing: unknown predicate
      # ops, and the quote gate that caps a rule's confidence when the
      # regulation's verbatim text is missing. A typo'd op at screening time
      # means a regulation that silently matches nothing, which looks exactly
      # like a structure being unregulated.
      - name: Validate regulatory rulesets
        run: uv run --no-sync python tools/build_regulatory_rulesets.py --check

      # NOT RUN HERE, stated so nobody reads a green tick as full coverage:
      #
      #   benchmarks/ir/      needs ORCA (registration-gated, no public
      #                       direct download)
      #   benchmarks/esp/     needs ORCA plus orca_plot
      #   benchmarks/nmr/     needs ORCA and the 152 MB nmrshiftdb2 index
      #   benchmarks/docking/ needs AutoDock Vina and RCSB receptor downloads
      #   benchmarks/admet/   needs the ~1 GB ADMET-AI sidecar environment
      #   benchmarks/pka/     needs the pkasolver sidecar environment
      #
      # These are run by hand against the real installed tools. Their numbers
      # live in docs/VALIDATION.md with the method and sample size behind
      # each one.
      - name: Note the benchmarks this gate cannot run
        if: always()
        run: |
          echo "Not covered by this gate: ir, esp, nmr, docking, admet, pka."
          echo "Each needs an external tool that cannot be installed on a"
          echo "hosted runner. See docs/VALIDATION.md for their measured"
          echo "results and benchmarks/*/README.md to reproduce them."

  # NON-BLOCKING. Nothing here can fail a PR -- see the header for why, and
  # for why it still has to be loud.
  linux:
    name: linux (NON-BLOCKING, informational only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Java (for OPSIN)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Qt needs an X server and a pile of system libraries that the Windows
      # runner provides implicitly. This is the first place hidden platform
      # assumptions will show up, which is the point of the job.
      - name: Install Qt's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libasound2t64 libxdamage1 libxrandr2 libxcomposite1

      - name: Sync dependencies
        run: uv sync --extra ai --extra network --extra openbabel

      # `--no-sandbox` because QtWebEngine's sandbox does not work inside a
      # container without extra privileges. `|| true` keeps the STEP green so
      # the summary below always runs; the real exit status is captured into
      # the file and reported there rather than thrown away.
      - name: Run the test suite
        id: suite
        run: |
          set -o pipefail
          export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox"
          xvfb-run -a uv run --no-sync python -u -m pytest -q -ra \
            > suite.log 2>&1 || true
          echo "exit_code=${PIPESTATUS[0]:-0}" >> "$GITHUB_OUTPUT"
          tail -30 suite.log

      # THE FINGERPRINT, not just "passed". A raw pass count means very little
      # in a suite this size -- collected/skipped/deselected are what say
      # whether the run measured what you think. `if: always()` is
      # load-bearing: a red suite skips later steps, which is exactly when
      # this is most needed.
      - name: Report the Linux fingerprint
        if: always()
        run: |
          {
            echo "## Linux suite (non-blocking)"
            echo
            if [ ! -s suite.log ]; then
              echo "**INFRASTRUCTURE FAILURE** -- the suite produced no output at all."
              echo "This is not 'zero failures'; nothing ran. Check the step above."
              exit 0
            fi
            summary="$(grep -E '^[0-9]+ (passed|failed)|=+ .*(passed|failed|error)' suite.log | tail -1)"
            if [ -z "$summary" ]; then
              echo "**INFRASTRUCTURE FAILURE** -- output exists but carries no pytest"
              echo "summary line, so the suite did not reach the end of collection."
              echo
              echo '```'
              tail -20 suite.log
              echo '```'
              exit 0
            fi
            echo "| field | count |"
            echo "|---|---|"
            for field in passed failed error skipped deselected xfailed xpassed; do
              n="$(echo "$summary" | grep -oE "[0-9]+ $field" | grep -oE '^[0-9]+' || true)"
              echo "| $field | ${n:-0} |"
            done
            echo
            echo "Raw summary: \`$summary\`"
            echo
            failing="$(grep -E '^FAILED ' suite.log | head -20 || true)"
            if [ -n "$failing" ]; then
              echo "### First failing tests"
              echo '```'
              echo "$failing"
              echo '```'
              echo "These do NOT block the PR. They are environment findings on a"
              echo "platform this application does not ship."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
