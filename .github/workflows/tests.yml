# The PR gate: the test suite plus every benchmark that can honestly run on
# a hosted runner.
#
# WINDOWS ONLY, DELIBERATELY. This application ships Windows-only -- the
# README badge says so, packaging is PyInstaller/Windows, and macOS/Linux are
# documented as untested. The suite is also webview-heavy (three QWebEngine
# backends), which works on a Windows runner without the xvfb and sandbox
# flags Linux would need. A green tick here therefore means green on the
# platform users actually run.
#
# LINUX IS NOW WIRED, AS A NON-BLOCKING SECOND RUNNER. This header used to
# say "deferred, not rejected ... worth doing eventually as a NON-BLOCKING
# job", and the `linux` job below is that. It does NOT gate a PR: this
# application ships Windows-only, and blocking a merge on a platform nobody
# ships would be noise. It exists to surface hidden environment assumptions,
# which hard experience says arrive ONE AT A TIME, each unblocking the next.
#
# NON-BLOCKING IS NOT INVISIBLE, and the difference is the whole design of
# that job. `continue-on-error` with no reporting produces a green run page
# hiding thirty Linux failures, which is the same decorative control this
# repository already documents in "A RED SUITE SILENTLY DISABLES EVERY GATE
# BEHIND IT". So the Linux job writes a full fingerprint to the run summary
# under `if: always()`, reports the suite's REAL exit status, and
# distinguishes "tests failed" from "the suite could not start" -- a parser
# that turns empty output into "0 failed" would be the same failure one
# level down.
#
# AND THE SUMMARY WAS STILL NOT ENOUGH, WHICH TOOK A CRASH TO FIND. Three
# mechanisms deliberately turn a Linux failure green -- the suite step's
# `|| true`, this job's `continue-on-error`, and the workflow tolerating the
# job -- so no field the REST API returns can say the suite failed. That is
# by design; the verdict is supposed to live in $GITHUB_STEP_SUMMARY. But
# `gh run view --json` cannot read a step summary, so the only witness was a
# human opening the run page, and run 32949434045 on master duly segfaulted
# at 53% while every automated check reported success.
#
# The fingerprint step therefore also emits a WORKFLOW ANNOTATION, which is
# exposed at `repos/{owner}/{repo}/check-runs/{id}/annotations` and does not
# fail the job. It classifies three failures the old wording collapsed into
# one: nothing ran, crashed part-way (a fatal-error marker and no summary
# line), and ran without producing a summary. "Did not reach the end of
# COLLECTION" was the wrong diagnosis for a suite that reached 53% of the
# RUN.
#
# THE SAME JOBS RUN ON PUSH AND ON PULL_REQUEST, on purpose. A workflow whose
# job set differs between the two triggers produces the trap where a green
# push run sits beside a red PR, because the two were never running the same
# thing.

name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# THE ONE TEST THAT HITS A THIRD PARTY, named once so the two jobs below
# cannot drift apart. It round-trips a name through PubChem, so it fails on
# NCBI's availability rather than on this repository's code -- observed as
# `HTTP 400` locally and as `HTTP 503 PUGREST.ServerBusy` on CI, where a
# shared runner IP makes rate-limiting likelier.
#
# WHY IT IS DESELECTED RATHER THAN LEFT TO FAIL. The gating job runs the
# naming benchmark, the regulatory benchmark and the ruleset validation
# AFTER the suite in the same job, and GitHub skips later steps once one
# fails -- so a PubChem outage did not merely redden a run, it silently
# disabled all three gates and reported them as `skipped`. That happened on
# master at 8438ef9. An upstream service must not be able to switch this
# repository's gates off.
#
# IT IS STILL RUN, just where it cannot do that -- see the non-blocking step
# after the gates. Deselecting without re-running it somewhere would delete
# the only coverage of the PubChem provider.
#
# A TYPO HERE FAILS OPEN AND SILENTLY: measured, `--deselect` with an
# unknown node id collects everything and exits 0, so a renamed test would
# quietly come back into the gating run. `tests/test_ci_deselections.py`
# fails if this id stops naming a real test.
env:
  NETWORK_TEST: tests/test_naming_providers.py::test_pubchem_name_round_trips_back_through_opsin

jobs:
  suite:
    name: suite + gating benchmarks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # OPSIN is a Java library and py2opsin shells out to a bare `java`.
      # Without it the naming round-trip tests SKIP rather than fail, which
      # would make this gate quietly weaker than it looks -- and the naming
      # benchmark below could not run at all.
      - name: Install Java (for OPSIN)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # NOT `--all-extras`. That pulls in `docking`, whose `vina` wheel builds
      # from source and needs Boost; the reference environment does not have
      # it either. These three are what the suite needs -- without them about
      # 40 tests fail on missing imports and it reads as a broken checkout.
      - name: Sync dependencies
        run: uv sync --extra ai --extra network --extra openbabel

      # `--deselect` for the network test, so NCBI cannot switch off the
      # three gates below. See the `env:` block for the whole reasoning.
      - name: Run the test suite
        run: uv run --no-sync python -u -m pytest -q -ra --deselect "${{ env.NETWORK_TEST }}"

      # Scored from a DIFFERENT WORKING DIRECTORY. py2opsin writes a fixed
      # temp filename into the current directory, so two OPSIN callers in one
      # directory crash each other -- and the suite above has just used it.
      - name: Naming benchmark (must stay 181/181)
        run: uv run --no-sync python .github/scripts/naming_gate.py

      # Pure RDKit and OPSIN, no external tools, so it genuinely runs here.
      # Reports per-rule TP/FP/TN/FN. The known 0.50 precision on
      # `cwc-1-a-6` is documented rather than gated, so this checks that the
      # benchmark RUNS and produces its table -- not that every rule is
      # perfect. A gate there would push someone to delete the honest edge
      # case rather than fix the rule.
      - name: Regulatory benchmark
        run: uv run --no-sync python benchmarks/regulatory/score.py

      # Validates every shipped ruleset without writing: unknown predicate
      # ops, and the quote gate that caps a rule's confidence when the
      # regulation's verbatim text is missing. A typo'd op at screening time
      # means a regulation that silently matches nothing, which looks exactly
      # like a structure being unregulated.
      - name: Validate regulatory rulesets
        run: uv run --no-sync python tools/build_regulatory_rulesets.py --check

      # THE GALLERY GUARDS, WHICH THE RUN ABOVE SKIPS. `tests/conftest.py`
      # sets QT_QPA_PLATFORM=offscreen, where `$3Dmol.createViewerGrid`
      # throws for a grid of even one cell -- see the ladder in
      # `tests/test_mol3d_viewer_backend.py`, where every capability
      # underneath it works. So the only thing exercising the real
      # conformer gallery skips on every CI run, and a skip reports as
      # nothing at all. This step makes their status VISIBLE.
      #
      # **EXPECTED TO SKIP HERE, AND THAT IS THE POINT.** This runner has
      # no GPU, so the shared `grid_display` fixture's measured WebGL half
      # refuses them with a reason `-ra` prints -- rather than running them
      # and failing, which is what the platform half alone would have done.
      # If GitHub's Windows image ever gains a GPU they start running for
      # free.
      #
      # **`continue-on-error` MEANS ADVISORY, NOT PASSING.** A red step
      # here does not fail the job, so nobody may read the job's green
      # tick as these having succeeded -- read the step. That is what the
      # banner below says out loud, because "12 skipped" and "10 passed,
      # 2 failed" must not look alike six months from now, and only
      # pytest's own summary line tells them apart.
      - name: Conformer gallery guards (NON-BLOCKING -- needs a GPU)
        if: always()
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: windows
        run: |
          echo "NON-BLOCKING: a failure here does not fail the job, so read"
          echo "THIS STEP rather than the job's tick. pytest's own last line"
          echo "below carries the counts, and -ra carries the skip reasons."
          echo "Skips are EXPECTED on a GPU-less runner; failures are not,"
          echo "and mean a real conformer-gallery regression."
          uv run --no-sync python -u -m pytest -q -ra --tb=short tests/test_spatial_annotations.py tests/test_mol3d_viewer_backend.py

      # THE DESELECTED TEST, RUN WHERE IT CANNOT DISABLE ANYTHING. Last, so
      # nothing waits on it; `continue-on-error` so NCBI cannot fail the job;
      # `if: always()` so it still reports when the suite above went red.
      #
      # NON-BLOCKING IS NOT INVISIBLE -- the same rule the `linux` job below
      # is built around. A failure here shows on the run page as an ignored
      # red step, so "PubChem naming is broken" and "PubChem was busy" both
      # stay visible; what changes is only that neither can take the gates
      # with it. If this step is red for days rather than minutes, that is a
      # real provider regression and not a flake.
      - name: PubChem round trip (NON-BLOCKING -- third-party network)
        if: always()
        continue-on-error: true
        run: uv run --no-sync python -u -m pytest -q -ra "${{ env.NETWORK_TEST }}"

      # NOT RUN HERE, stated so nobody reads a green tick as full coverage:
      #
      #   benchmarks/ir/      needs ORCA (registration-gated, no public
      #                       direct download)
      #   benchmarks/esp/     needs ORCA plus orca_plot
      #   benchmarks/nmr/     needs ORCA and the 152 MB nmrshiftdb2 index
      #   benchmarks/docking/ needs AutoDock Vina and RCSB receptor downloads
      #   benchmarks/admet/   needs the ~1 GB ADMET-AI sidecar environment
      #   benchmarks/pka/     needs the pkasolver sidecar environment
      #
      # These are run by hand against the real installed tools. Their numbers
      # live in docs/VALIDATION.md with the method and sample size behind
      # each one.
      - name: Note the benchmarks this gate cannot run
        if: always()
        run: |
          echo "Not covered by this gate: ir, esp, nmr, docking, admet, pka."
          echo "Each needs an external tool that cannot be installed on a"
          echo "hosted runner. See docs/VALIDATION.md for their measured"
          echo "results and benchmarks/*/README.md to reproduce them."

  # NON-BLOCKING. Nothing here can fail a PR -- see the header for why, and
  # for why it still has to be loud.
  linux:
    name: linux (NON-BLOCKING, informational only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Java (for OPSIN)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Qt needs an X server and a pile of system libraries that the Windows
      # runner provides implicitly. This is the first place hidden platform
      # assumptions will show up, which is the point of the job.
      - name: Install Qt's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libasound2t64 libxdamage1 libxrandr2 libxcomposite1

      - name: Sync dependencies
        run: uv sync --extra ai --extra network --extra openbabel

      # `--no-sandbox` because QtWebEngine's sandbox does not work inside a
      # container without extra privileges. `|| true` keeps the STEP green so
      # the summary below always runs; the real exit status is captured into
      # the file and reported there rather than thrown away.
      #
      # The network test is deselected here too, for a reason specific to
      # this job rather than for the gating one: this job exists to surface
      # PLATFORM assumptions, and it reports its failures as "environment
      # findings on a platform this application does not ship". An NCBI
      # outage is not a Linux finding, and listing it as one is how a
      # fingerprint stops being read.
      - name: Run the test suite
        id: suite
        run: |
          set -o pipefail
          export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox"
          xvfb-run -a uv run --no-sync python -u -m pytest -q -ra \
            --deselect "${{ env.NETWORK_TEST }}" \
            > suite.log 2>&1 || true
          echo "exit_code=${PIPESTATUS[0]:-0}" >> "$GITHUB_OUTPUT"
          tail -30 suite.log

      # THE FINGERPRINT, not just "passed". A raw pass count means very little
      # in a suite this size -- collected/skipped/deselected are what say
      # whether the run measured what you think. `if: always()` is
      # load-bearing: a red suite skips later steps, which is exactly when
      # this is most needed.
      - name: Report the Linux fingerprint
        if: always()
        run: |
          summary=""; crash_markers=0; reached=""; victim=""
          if [ -s suite.log ]; then
            summary="$(grep -E '^[0-9]+ (passed|failed)|=+ .*(passed|failed|error)' suite.log | tail -1 || true)"
            crash_markers="$(grep -cE 'Fatal Python error|Windows fatal exception|^Extension modules:' suite.log || true)"
            # HOW FAR IT GOT. Anchored on the bracket rather than on the
            # progress characters: Chromium writes ERROR lines into the middle
            # of pytest's progress line, so a pattern matching leading
            # `[.sFEx]` counts `Failed to make current...` as progress.
            reached="$(grep -oE '\[ *[0-9]+%\]' suite.log | tail -1 | tr -d ' ' || true)"
            # The DEEPEST frame belonging to this repository's tests, printed
            # as `path:line in test_name`. `tail -1` because the traceback runs
            # most-recent-first and the test function is below the helper it
            # called -- the helper alone would name `_wait_until` and not the
            # test that crashed.
            victim="$(grep -oE 'tests/[A-Za-z0-9_/]+\.py", line [0-9]+ in [A-Za-z0-9_]+' suite.log               | tail -1 | sed -E 's/", line /:/' || true)"
          fi

          # THE ANNOTATION IS THE ONLY PART OF THIS A MACHINE CAN READ.
          #
          # Three mechanisms already turn a Linux failure green on purpose --
          # the step's `|| true`, the job's `continue-on-error`, and the
          # workflow tolerating the job -- so NO FIELD THE REST API RETURNS
          # can say the suite failed. The verdict below goes to
          # $GITHUB_STEP_SUMMARY, which `gh run view --json` cannot read, so
          # for one whole class of failure the only witness was a human
          # opening the run page. A workflow-command annotation IS exposed,
          # via `gh api repos/{owner}/{repo}/check-runs/{id}/annotations`, and
          # costs nothing: it does not fail the job, which stays advisory.
          #
          # MEASURED: run 32949434045 on master segfaulted at 53% and every
          # automated check reported success.
          if [ ! -s suite.log ]; then
            echo "::error title=Linux suite produced NO OUTPUT::Nothing ran. This is not 'zero failures' -- the suite could not start."
          elif [ -z "$summary" ] && [ "$crash_markers" != "0" ]; then
            echo "::error title=Linux suite CRASHED MID-RUN::Reached ${reached:-an unknown point} then died at ${victim:-an unidentified frame}. No pytest summary line: the counts below are absent, not zero."
          elif [ -z "$summary" ]; then
            echo "::error title=Linux suite produced NO SUMMARY LINE::Output exists and carries no crash marker either. The run did not reach the end."
          fi

          {
            echo "## Linux suite (non-blocking)"
            echo
            if [ ! -s suite.log ]; then
              echo "**INFRASTRUCTURE FAILURE** -- the suite produced no output at all."
              echo "This is not 'zero failures'; nothing ran. Check the step above."
              exit 0
            fi
            if [ -z "$summary" ] && [ "$crash_markers" != "0" ]; then
              # THE THIRD STATE, and the one this used to get wrong. It read
              # "did not reach the end of collection", which is the wrong
              # diagnosis for a suite that reached 53% of the RUN. A crash
              # marker with no summary line is a native-code death part-way
              # through, and the frames say where.
              echo "**INFRASTRUCTURE FAILURE** -- the suite CRASHED PART-WAY THROUGH."
              echo "It reached ${reached:-an unknown point} and produced no summary line,"
              echo "so every count below is ABSENT rather than zero."
              echo
              echo "Victim frame: \`${victim:-not identified}\`"
              echo
              echo '```'
              sed -n '/Fatal Python error\|Windows fatal exception/,/^Extension modules:/p' suite.log | head -40
              echo '```'
              echo
              echo "**The published artifact carries the WHOLE log**, which is what a"
              echo "\`tail\` cannot: the header and the frames naming the test are above"
              echo "any window the job log prints. Fetch it before forming a hypothesis."
              exit 0
            fi
            if [ -z "$summary" ]; then
              echo "**INFRASTRUCTURE FAILURE** -- output exists, carries no pytest summary"
              echo "line, and carries no crash marker either. The run did not reach the end."
              echo
              echo '```'
              tail -20 suite.log
              echo '```'
              exit 0
            fi
            echo "| field | count |"
            echo "|---|---|"
            for field in passed failed error skipped deselected xfailed xpassed; do
              n="$(echo "$summary" | grep -oE "[0-9]+ $field" | grep -oE '^[0-9]+' || true)"
              echo "| $field | ${n:-0} |"
            done
            echo
            echo "Raw summary: \`$summary\`"
            echo
            failing="$(grep -E '^FAILED ' suite.log | head -20 || true)"
            if [ -n "$failing" ]; then
              echo "### First failing tests"
              echo '```'
              echo "$failing"
              echo '```'
              echo "These do NOT block the PR. They are environment findings on a"
              echo "platform this application does not ship."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # THE LOG IS PUBLISHED BECAUSE THE JOB LOG TRUNCATES IT. The suite step
      # prints `tail -30`, and the first Linux run had 9 failures of which
      # only 2 fell inside that window -- so the job log said "9 failed" and
      # could not say which 9.
      #
      # IT IS ALSO WHAT DIAGNOSED THE SEGFAULT, and for a sharper reason: a
      # fatal traceback's header and the frames naming the test are ABOVE any
      # tail window, so `tail -30` starts mid-traceback and names a pluggy
      # frame. The artifact carries the whole file. Fetch it before forming a
      # hypothesis. The step summary carries the first 20, but
      # nothing outside the browser can read a step summary. An artifact is
      # the only form the failures survive in for anyone diagnosing them
      # later, which is the whole point of running this job at all.
      - name: Publish the Linux suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-suite-log-${{ github.run_number }}
          path: suite.log
          if-no-files-found: warn
          retention-days: 30
