[[source]]
key = "nubase2020"
kind = "dataset"
citation = "F. G. Kondev, M. Wang, W. J. Huang, S. Naimi & G. Audi, 'The NUBASE2020 evaluation of nuclear physics properties', Chinese Physics C 45, 030001 (2021)."
identifier_type = "doi"
