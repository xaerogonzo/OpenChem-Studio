# The provenance registry. Hand-edited and reviewed; docs/SOURCES.md is
# GENERATED from this file by tools/build_sources_doc.py.
#
# What each field means, and which are load-bearing, is in that tool's
# docstring and enforced by tests/test_sources_are_current.py. The short
# version:
#
#   status        shipped        this source backs something we ship
#                 assessed_not_shipped   read, and deliberately not used
#                 reference_only         cited for context, backs nothing
#   verification  unverified     nobody has checked this entry against the
#                                source itself
#                 citation       the reference is right
#                 citation_and_claim  the NUMBER this project uses was
#                                checked against the source
#   used_by       DESCRIPTIVE. Not the dependency oracle -- a stale entry
#                 here is tolerated by design. The operational paths
#                 (resource_path, package_manifest, license_files,
#                 third_party_globs, our_files) are the authoritative ones.
#   local         a filename in Alex's `Sci Downloads`, recorded so a later
#                 session can verify without hunting. NOT checked by any
#                 guard -- that folder is not in the repo.
#
# `verification` is three-valued because the two-valued version has already
# cost this project: a fixture labelled "verbatim from a real run" had its
# energies typed from memory. A right citation and a right number are two
# claims.

schema_version = 1


