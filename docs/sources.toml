kind = "literature"
citation = "R. S. Drago & B. B. Wayland, 'A Double-Scale Equation for Correlating Enthalpies of Lewis Acid-Base Interactions', J. Am. Chem. Soc. 1965, 87, 3571."
identifier_type = "doi"
