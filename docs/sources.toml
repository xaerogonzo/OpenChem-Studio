note = """
CONFIRMED FROM THE PAPER ITSELF, whose header reads "Inorg. Chem. 1993, 32,
2473-2479 ... Addition of New Donors to the E and C Model ... Russell S.
Drago, Department of Chemistry, University of Florida ... Andrew P. Dadmun
