note = """the file prints a PII (S0378-3812(01)00431-9), not a DOI. Tables 6-8 (pp. 194-202, first/
second/third-order groups) have NO text layer -- render at 220+ dpi and read the images, same trap as
vogel1996.pdf. Checked 2026-09-27: Table 6 (182 first-order groups) has group 176 'N (cyclic)' (example
N-methylpyrrolidine) and group 81 'NO2 except as above' (example nitrocyclohexane, a C-bound example but
the group is a generic NO2 substituent fragment by the paper's own group-assignment rules, not restricted
to a carbon attachment) -- together these plausibly decompose RDX/HMX's ring N-NO2 (nitramine) motif as
N(cyclic) + NO2(except as above) + CH2(cyclic), where Joback (1987) refuses outright for lack of a ring
tertiary amine group. Table 7 (122 second-order groups) has no nitramine-specific correction. Table 8
(third-order, polycyclic) is not expected to apply -- RDX and HMX are each a single ring.

The group tables (this table AND Table 2's universal constants) are now transcribed and CONFIRMED --
tests/test_marrero2001_table.py reproduces the paper's own Appendix B worked examples (Examples 1, 3, 4)
to 4 decimal places on the group summation and to 0.02 K on the final Tb/Tm, from
benchmarks/thermophysical/marrero2001_table.py.

**RDX/HMX/TNT/PETN comparison, run 2026-09-27, numbers corrected 2026-09-28 after the Agrawal
primary-source check** (benchmarks/thermophysical/compare_energetics.py,
tests/test_energetics_thermophysical_comparison.py): first-order Marrero-Gani Tm only. Against Joback's
real, shipped output (compute_joback, actual app code) and against Agrawal (2010) Table 3.6's measured
values (the `agrawal2010` entry above -- superseding the earlier, less-verified numbers this note
originally carried):

  RDX:  Joback refuses (UNCOVERED_ATOM).           Marrero-Gani Tm = 374.0 K vs measured 478.15 K (-104 K).
  HMX:  Joback refuses (UNCOVERED_ATOM).           Marrero-Gani Tm = 416.4 K vs measured 548.15 K (-132 K).
  TNT:  Joback runs, Tf = 663.46 K vs 354.15 K (+309 K).   Marrero-Gani Tm = 401.6 K vs 354.15 K (+48 K).
  PETN: Joback runs, Tf = 811.89 K vs 413.15 K (+399 K).   Marrero-Gani Tm = 359.1 K vs 413.15 K (-54 K).

So: on the two molecules Joback ALREADY claims to cover, its freezing-point estimate is wrong by
300-400 K (confirms the paper's own 'not accurate... only very approximate' caveat on Tf, and then
some) while first-order Marrero-Gani lands within 50-60 K on the same two -- a real control result,
not just 'it gives a number where Joback refuses'. On the two nitramines Joback refuses outright,
Marrero-Gani underestimates both by 100-130 K with no way (yet) to correct it: no second-order group
in Table 7 addresses a ring N bonded to NO2, so the error is a property of the first-order
decomposition itself, not a missing refinement step.

**A caveat that reframes what 'coverage' should mean here, found 2026-09-27**: most of what Joback and
this table both estimate -- Tb, Tc, Pc, Vc -- describes a state RDX and HMX never reach: both decompose
(detonate) well before any normal boiling point, so a numeric Tb for either is not a measurement of
anything physical, whichever method produces the number. The properties that stay meaningful for a
compound that decomposes on heating are the ones with a real measured value below the decomposition
point -- principally Tm. RDX (478.15 K) and HMX (548.15 K) both now have one, from Agrawal Table 3.6's
own separate melting-point column -- superseding the earlier read of Klapoetke's vaguer prose alone as
'HMX has no clean value' (klapotke2017's own statement, that RDX/HMX's melting and decomposition points
'lie close together', is directionally right about HMX specifically having the smallest gap to its own
ignition temperature of any compound in Agrawal's table, 4-6 C, but a small gap is not an absent
measurement). So the actual opportunity this survey should evaluate is narrower than 'replace
Joback's 11 outputs for energetics': it is Tm specifically, not the full property battery, and Thermophysical's
own reported scope note should say so if this is ever promoted.

**Track 1 -- a diagnostic extension corpus, run 2026-09-28** (benchmarks/thermophysical/
compare_energetics.py, reusing tests/fixtures/census_panel.toml's pre-existing, non-cherry-picked
nitramine/energetic rows; tests/test_energetics_thermophysical_comparison.py,
tests/test_energetics_groups.py). **Named honestly, not called a blind holdout**: RDX/HMX/TNT/PETN
(above) are the DEVELOPMENT set -- they shaped the hypotheses under test. Everything below is
DIAGNOSTIC: frozen before any calculator ran, but examined while planning this extension, so useful for
stress-testing the decomposition and characterizing behavior, never for a clean-holdout accuracy claim.
`tools/validation_rows.py` gained `transition_type` (melting/decomposition/melting_with_decomposition/
not_observed) and `value_source`/`primary_reference`/`secondary_reference` fields for exactly this
track, plus `admit_to_melting_point_set`, so a reported decomposition or an "estimated" melting point
can never silently enter a Tm accuracy table.

A new, independent SMARTS-based counter (benchmarks/thermophysical/energetics_groups.py, scoped to just
the ~11 groups this corpus needs) reproduces every hand decomposition above EXACTLY, and was checked for
representation invariance across 12 randomly-rewritten SMILES per molecule (RDX, TNT, tetryl, PETN --
different root atoms, traversal directions, and nitro-group kekulization forms, all giving identical
counts; tests/test_energetics_groups.py). Results on the diagnostic set:

  dinitrodiazetidine (4-ring nitramine): clean decomposition (2x CH2(cyclic)+N(cyclic)+NO2-except),
    Marrero-Gani Tm = 314.2 K. STILL no measured Tm found, after an expanded search (2026-09-28): this
    compound's own export-control abbreviation is DNAD, not DNAZ (CAS 78246-06-7, found via a general
    web search hit on the EU Common Military List) -- checked under that identity, NIST Chemistry
    WebBook has no entry for either the CAS number or its formula (C2H4N4O4 resolves to a different
    compound, FOX-7/DADNE, in that database), and ChemicalBook's own data page for CAS 78246-06-7 lists
    only a PREDICTED boiling point and density -- no melting point, measured or predicted, anywhere
    checked. Genuinely deferred, not merely unchecked.
  tetryl (aromatic nitramine, N-NO2 on an exocyclic N, not a ring N): clean decomposition
    (aC-N + CH3 + NO2-except + 3x aC-NO2 + 2x aCH), Marrero-Gani Tm = 439.7 K vs measured 402.15 K
    (Agrawal Table 3.6 AND Agrawal's own prose, Sec. 2.2.3 -- two independent passages agreeing):
    error +37.5 K.
  tatb (hexasubstituted aromatic, 3x NH2 + 3x NO2): clean decomposition, Marrero-Gani Tm = 474.8 K, but
    NOT scored -- Klapoetke (p. 303-304) states its melting point is an unreached ESTIMATE, not a
    measurement.
  nitroguanidine: REFUSES -- no group covers a C=N outside an aldazine/ketazine context (its own NH2
    alone IS covered by row 65, which is not enough to decompose the whole molecule).
  ammonium_nitrate: REFUSES -- ionic/inorganic, outside the method's organic-covalent scope entirely.
  nitroglycerin: clean decomposition (3x ONO2 + 2x CH2 + 1x CH, NOT the ether-context CH2O -- ONO2
    bundles its own oxygen as a complete terminal unit per row 83's own worked example), Marrero-Gani
    Tm = 305.2 K. **Found 2026-09-28** (the earlier session's deferral resolved): NIST Chemistry
    WebBook's Phase change data for CAS 55-63-0 gives DfusH = 21.87 kJ/mol at 285.5 K, citing Acree,
    W.E. (1991), Thermochimica Acta 189, 37-56 (not held) -- Agrawal's own NG section (Sec. 2.2.4, p.
    72-73) has density/VOD but no melting point, so this required going outside the two held handbooks.
    285.5 K = 12.35 C sits close to the commonly-cited ~13 C 'stable' NG polymorph, but NIST's own table
    does not say which of NG's two known polymorphs (a labile form near 2 C, a stable form near 13 C)
    this reading is -- recorded as found, not silently assigned to the stable form. Marrero-Gani error:
    +19.7 K (overestimate), a SMALLER error than PETN's, the corpus's other nitrate ester.

**A finding that complicates the RDX/HMX bias, not confirms it as 'nitramine' generally**: tetryl is
labelled 'nitramine' in census_panel.toml, but for a different reason (testing that an aromatic N-N
isn't mistaken for a ring N-N) than this stratification needs. Its error (+37.5 K) runs the OPPOSITE
sign from RDX/HMX/dinitrodiazetidine's consistent underestimate, and is close in sign and size to the
nitroaromatic stratum (TNT, +47.5 K) instead. Recorded descriptively, not explained: with this few
points, ring size and N-NO2 count are confounded with everything else about each molecule, so the honest
conclusion is 'no factorized per-nitramine correction was inferred from this sample', not a claim about
whether the underestimate is roughly constant per ring-nitrogen unit. The three RING nitramines alone
(RDX 3x N-NO2/6-ring: -104 K, HMX 4x N-NO2/8-ring: -132 K, dinitrodiazetidine 2x N-NO2/4-ring: not yet
scored) remain the more informative comparison for that question once a measured Tm is found for the
smallest ring.

**Track 2a -- TNT's (and TATB's) second-order aromatic correction, resolved 2026-09-28**: worked out
canonically rather than guessed. Per the paper's own numbering rule (marrero2001.txt p. 199: for
3,5-dimethylaniline, aniline's own parent substituent anchors position 1, and the OTHER substituents are
numbered by lowest locants from there), TNT's parent name is trinitroTOLUENE, so the methyl-bearing
carbon is position 1 by the compound's own nomenclature -- confirmed against RDKit's own atom-order
reading of the real structure, not assumed. That gives substituent set {1,2,4,6} (both numbering
directions agree, since TNT has a mirror plane through C1/C4). Checked against all 9 AROMRING second-order
patterns actually in Table 7 (AROMRINGs1s2, s1s3, s1s4, s1s2s3, s1s2s4, s1s3s5, s1s2s3s4, s1s2s3s5,
s1s2s4s5): none list a position 6, so **none apply to TNT's pattern** -- first-order-only was already the
paper's own complete answer, not an unchecked shortcut. TATB (fully hexasubstituted, positions 1-6 all
occupied) likewise matches none of the 9 patterns, which all presume at least one unsubstituted position
remains. Both conclusions rederived from the complete, already-transcribed Table 7 list
(marrero2001_table.py's SECOND_ORDER), not from a partial reading.

This also bears on Detonation's missing input, but less directly than it first appears: this table's
Hf1i/Gf1i columns are the compound's standard enthalpy/Gibbs energy of formation at 298 K, and the
worked examples are ordinary liquids and gases -- nothing here says whether that basis is gas-phase or
each compound's own standard state, and Kamlet-Jacobs needs the CONDENSED-phase value specifically
(Detonation's own support_reason and docs/research/SENSITIVITY.md). That is exactly why the survey
already tracks a SEPARATE enthalpy_solid line (mathieu2018_iecr, jafari2016, keshavarz2012/2021) rather
than assuming this table's Hf column would do -- do not substitute one for the other without checking
the phase basis in Marrero-Gani's own methodology text first."""

