[[source]]
id = "keshavarz_sadeghi2009"
file = "keshavarz_sadeghi2009.pdf"
sha256 = "355191e9fbb910dec8c517b7c90d2aa5b6449e042f09426c2c0fe10c46585a8a"
pages = 7
access = "held"
printed.doi = "10.1016/j.jhazmat.2009.05.118"
printed.title = "A new approach to predict the condensed phase heat of formation in acyclic and cyclic nitramines, nitrate esters and nitroaliphatic energetic compounds"
printed.venue = "J. Hazard. Mater. 171 (2009) 140-146"
assigned.property = "enthalpy_solid"
assigned.role = "candidate_method"
note = """Identified 2026-09-28 as `keshavarz2012`'s own ref [14] -- the actual source of EDPHT 2.0's
nitramine/nitrate-ester/nitroaliphatic condensed-Hf model, read one level up from `keshavarz2012`
itself. Alex downloaded this the same day (originally saved as keshavarz2009_III.pdf, download-order
numbering with no meaning; renamed to this file's own key once confirmed from its own first page,
matching keshavarz2012's printed citation exactly). NOT to be confused with 10.1016/j.jhazmat.2005.12.006
("Theoretical prediction of condensed phase heat of formation of nitramines, nitrate esters,
nitroaliphatics and related energetic compounds", J. Hazard. Mater. 136 (2006) 145-150) -- also a real,
Crossref-confirmed Keshavarz paper on the same topic, three years earlier, and NOT the one keshavarz2012
actually cites; not held.

**Read in full 2026-09-28.** The model IS text-extractable, unlike Marrero-Gani's tables: Eq. (1),
DfH(c) = DfH(c,core) + y1 + y2*n_C + ... with correction terms DE (decreasing, e.g. an -OH/-NO2 ratio
rule, a >C=O rule) and IE (increasing, e.g. a lone CN(NO2)C fragment, NO2-on-cubane), fit by MLR with
R2=0.97: y1=9.344, y2=-9.055, y3=23.12, y4=-15.79, y5=51.49, y6=-52.00 (kJ/mol). Three validation
tables, each against a different compound set, ALL beating the paper's own "previous work" [9] baseline
by a wide margin, but NOT uniformly clearing SENSITIVITY.md's ~21 kJ/mol bar:

    Table 1 (fitted set; includes PETN itself, dev -25.2 kJ/mol on -538.5 exp; also ONC, CL-20, NTO):
        rms 18.8 kJ/mol (new method) vs 48.7 (QM) vs 97.4 (previous work) -- CLEARS the bar.
    Table 2 (different acyclic/cyclic nitramine/nitrate-ester/nitroaliphatic structures):
        rms 29.1 kJ/mol vs 41.0 (previous work) -- OVER the bar.
    Table 3 ("well-known energetic compounds", incl. TNAZ dev 15.4 and "Keto RDX" dev 16.2 -- both
        numbers matching keshavarz2012's own later Table 2 exactly, confirming the lineage directly,
        not just by citation): rms 28.4 kJ/mol vs 142.7 (previous work) -- OVER the bar.

So `keshavarz2012`'s own headline number (17.1 kJ/mol rms on its selected new-explosive test) is a
SMALLER, more favorable subset than this source paper's own three broader tables show (18.8-29.1 kJ/mol
range) -- the method is consistently far better than the alternatives shown alongside it, but "clears
the ~21 kJ/mol bar" is not a claim this paper's own data supports uniformly.

**Reproduction attempted 2026-09-28 and FAILED -- recorded rather than hidden.** Eq. (1)'s coefficients
were verified THREE ways (text extraction, a full-page render, and a tight zoomed crop of just the
coefficient line) -- y1=9.344, y2=-9.055, y3=23.12, y4=-15.79, y5=51.49, y6=-52.00 are exactly as
printed, no transcription error. But applying DHcore = Sum yj*bj (bj = C,H,N,O atom counts) to Table 1's
own printed values does not reproduce them, by a margin the DE/IE correction terms cannot explain: Table
1 has a clean homologous series (nitromethane through three C4 nitroalkane isomers, N=1/O=2 fixed, no
OH/nitramine/cubane/H-free features to trigger any DE or IE term) whose printed "New method" values step
by EXACTLY -36.7 kJ/mol per added CH2 (-109.9, -146.6, -183.3, -220.0). That slope must equal
y_C*1 + y_H*2 under the paper's own equation, but the confirmed coefficients give only -8.77 -- off by
about 4x, and this check does not depend on any DE/IE rule interpretation, only on arithmetic differences
between compounds whose correction terms are constant (zero or otherwise) across the series. Table row
alignment was independently re-checked against a full-page render (compound structures vs. Experiment/
New method/Dev columns) and matches the text extraction exactly, ruling out a table-parsing shift as the
cause. No coefficient reassignment among (C,H,N,O) closes this gap either.

**Conclusion: this equation cannot currently be reproduced from what is visible in the paper**, for a
reason not yet identified (a `bj` definition detail not present in the extracted text, or a genuine
inconsistency in the source). Status: CANDIDATE -> read; SOURCE_VALIDATED (the paper's own reported
numbers are recorded and trusted at face value) but explicitly NOT REPRODUCED -- do not write a
calculator implementation of this equation from this reading. If this candidate is worth pursuing
further, the next step is external (contacting the authors, or finding an erratum/SI), not another
attempt to reverse-engineer the coefficients from table arithmetic alone.

**Track 4 closing pointer (2026-09-30)**: Gate A's search for an alternative direct-condensed-Hf source
(this equation's own lineage) found nothing usable -- `keshavarz2006` (the oldest paper in this
lineage) and `nazari2016` (the newest) both either fail reproduction or were never attempted from a
reliable table read, and `keshavarz2021`'s own review never cites or corrects this entry's coefficients
in-text (NO_CORRECTION_FOUND). See `keshavarz2006`'s and `nazari2016`'s own notes for the full findings,
including a genuine RDX/HMX experimental-value swap shared by both papers' tables. The survey's own
`orca_atom_equivalents` route (not this direct route) is where real progress happened this session --
see that module's docstring and `mathieu2018_apc`'s closing pointer above."""

