note = """Read and REPRODUCED 2026-09-28 (Track 3, chasing the gas-phase half of the RDX/HMX/PETN combined
route). All 68 APC parameters are printed in the paper's own MAIN TEXT (Tables 2, 3, 4) -- unlike its own
AE1/AE2 atom-equivalent DFT procedure, whose calibration constants live only in the Supporting Information
(not held) -- so, unlike `keshavarz_sadeghi2009`, missing SI was never the blocker here. Transcribed from
a 350 dpi render of the source PDF (the text layer drops the bond-order symbols ~,:,=,#) and confirmed
row-by-row against that render.

**One real interpretive finding, verified against three primary-source experimental values (Lange's
Handbook Table 6.1), not the paper's own claimed statistics** (its training/test sets are Supporting
Information, not held): the paper defines the nitro-group structural correction as "associated ... with
two NO bonds" without stating those bonds' order. The natural reading -- RDKit's own default charge-
separated Lewis structure, one N=O double and one N-O(-) single -- predicts nitromethane's gas DfH at
+250.1 kJ/mol against an experimental -74.3 (Lange's), an error of 300+ kJ/mol. Assigning BOTH N-O bonds
the N=O (double) category instead -- chemically a "pentavalent-drawn" nitrogen, but consistent with the
correction's own "two NO bonds" phrasing and the azide correction's parallel "two NN bonds" phrasing --
closes the gap to a normal-sized residual:

    nitromethane   (CH3-NO2):    computed -41.1,  experimental -74.3   kJ/mol (diff 33.2)
    methyl nitrate (CH3-O-NO2):  computed -111.0, experimental -124.4  kJ/mol (diff 13.4)
    benzene        (c1ccccc1):   computed  83.6,  experimental  82.6   kJ/mol (diff  1.0, no nitro group)

Benzene needed no nitro interpretation and matched to within 1 kJ/mol on the first attempt -- strong
evidence the bond/geminal/atomic-reference transcription itself is right, isolating the finding to this
one structural correction's bond-order convention. Atomic reference enthalpies DfH(A) (this paper's own
ref 50) are transcribed from Lange's Handbook Table 6.3 (NBS/JANAF-derived), not assumed from memory.
Implementation: `benchmarks/thermophysical/mathieu2018_apc.py`, `tests/test_mathieu2018_apc.py` (8 tests).

**The combined route, computed end-to-end for the first time this session** (this model's gas-phase
DfH, minus `keshavarz2010_sublimation`'s DsubH):

    RDX:  gas 180.5, Hsub 130.4 -> solid  50.1 kJ/mol  (measured: +66.6 kJ/mol, klapotke2017 p.232 prose
                                                          "+299.7 kJ/kg"; +85 kJ/mol, klapotke2017 Tab. 9.6,
                                                          p.249 -- diff  16.5 / 34.9)
    HMX:  gas 240.7, Hsub 174.7 -> solid  66.0 kJ/mol  (measured: +116.1 kJ/mol, klapotke2017 Tab. 9.16a,
                                                          p.270 -- diff 50.1)
    PETN: gas -344.0, Hsub 138.0 -> solid -482.0 kJ/mol (measured: -539 kJ/mol, klapotke2017 Tab. 9.16b,
                                                          p.270 -- diff 57.0)

**Corrects an earlier note in this file** (recorded before either Klapoetke table had actually been
re-read this session): RDX's two Klapoetke numbers (+299.7 kJ/kg prose, p.232; +85 kJ/mol Table 9.6,
p.249) were previously called a real disagreement after converting the table value the wrong direction
for the comparison (382.6 kJ/kg vs. the prose's -299.7 kJ/kg, a ~682 kJ/kg gap that does not exist once
both are read in the same unit) -- compared correctly, in kJ/mol, they are 66.6 vs. 85, only 18.4 kJ/mol
apart and consistent in sign and order of magnitude. Not a contradiction needing resolution; a units
mistake in an earlier pass. HMX's and PETN's Klapoetke values (Table 9.16a/9.16b, p.270) are newly found
this session, not previously logged anywhere in this file.

**Verdict: REJECTED for a fast/practical route at this accuracy, now confirmed empirically rather than
only predicted from the two components' own reported errors.** RDX lands within ~17-35 kJ/mol of its two
measured comparators (borderline against the ~21 kJ/mol/5 kcal/mol SENSITIVITY.md bar); HMX and PETN miss
by 50 and 57 kJ/mol -- both well over the bar, and both larger than either component model's own reported
RMSE alone, consistent with the two independent error sources roughly adding rather than canceling for
this compound class. This empirically confirms what `mathieu2018_iecr`'s and this file's own prior notes
already predicted from APC's HEDM-45 RMSE (30.8 kJ/mol) alone: the fast/practical combined route does not
clear the bar for classic nitramines/nitrate esters. Status: CANDIDATE -> read; REPRODUCED; the combined
route built from it is INDEPENDENTLY_VALIDATED-and-REJECTED (three real held comparators, not zero) --
strengthens rather than weakens the case for trying this app's own ORCA integration next, since the two
literature-only components have now actually been tried together and shown insufficient, not just
suspected of being insufficient.

**Follow-up, same session: the ORCA route was tried.** `benchmarks/thermophysical/orca_atom_equivalents.py`
runs real ORCA 6.1.1 B3LYP/def2-SVP geometry optimizations (this machine's own install) and fits a
from-scratch atom-equivalent scheme -- not this paper's AE1/AE2 (whose constants are SI, not held). A
6-compound non-nitramine calibration set (water excluded from the fit; methane/ammonia/benzene/methanol/
nitromethane/methyl nitrate) gave an excellent SELF-consistent fit (0.5-11 kJ/mol residuals) but missed
RDX/HMX/PETN's real measured condensed values by 71-141 kJ/mol when combined with `keshavarz2010`'s
sublimation model -- WORSE than this module's own literature route, and a clean illustration of why a
calibration set's chemical coverage matters more than its fit quality on itself. Adding ONE real nitramine
(dimethylnitramine, DfH(gas)=-5+/-1 kJ/mol, NIST WebBook citing Matyushin et al. 1971) and refitting all
four atom equivalents on the resulting 7-point set moved RDX's combined estimate from clearly failing to
CLEARING the ~21 kJ/mol bar against both of Klapoetke's own RDX values (80.4 vs. 66.6/85.0, diff 13.8/4.6),
roughly halved HMX's error (87.8 vs. 116.1, diff 28.3 -- still over the bar), and made PETN WORSE (-466.3
vs. -539.0, diff 72.7, up from 46.6) -- a nitrate ester, not a nitramine, paying for a calibration point
that helped the other two. Seven compounds fitting four free parameters is a fragile fit (PETN's own
regression is the direct evidence), so this is recorded as a genuine, promising signal for the
class-specific-calibration hypothesis, explicitly NOT a validated route -- the next step neither this nor
the literature route has had is a calibration set large enough per compound class to fit with real
degrees of freedom to spare. Status: CANDIDATE(ORCA atom-equivalent route) -> tried; RDX
INDEPENDENTLY_VALIDATED against two real comparators; HMX and PETN REJECTED at this calibration size;
DEFERRED for promotion pending a properly sized, class-stratified calibration set.

**Two follow-up checks, later the same session (2026-09-28), asked and answered in that order.**

*Was RDX/HMX's conformer choice hiding a real fixable error?* Every ORCA job so far used one ETKDGv3
embed (seed 0xC0FFEE, MMFF94 pre-optimized), no conformer search. An 80-conformer MMFF94-ranked search
found that starting conformer sat mediocre-to-poor for both: RDX's ranked 18th of 35 (7.25 kcal/mol =
30.3 kJ/mol above the search's own MMFF94 minimum), HMX's 30th of 50 (15.90 kcal/mol = 66.5 kJ/mol
above). Re-running ORCA's B3LYP/def2-SVP Opt from each molecule's MMFF94 global-minimum conformer
instead: RDX's converged Etot moved by -4.3 kJ/mol, HMX's by **+6.1 kJ/mol -- the "better" MMFF
conformer converged to a HIGHER DFT energy**, not lower. Conformer choice, within this search's range,
is RULED OUT as the source of RDX/HMX's remaining combined-route error -- a real, checked negative
result, not an assumption. The original single-seed Etot values were kept for the recorded result, for
consistency with the rest of the (never re-checked this way) calibration set.

*Does more calibration data of the two chemistry classes that mattered actually help?* Added a second
nitramine, 1-nitropiperidine (a 6-membered RING nitramine, structurally closer to RDX's own ring than
dimethylnitramine), DfH(gas) = -44 +/- 3 kJ/mol (NIST WebBook, Matyushin et al. 1971, same source series
as dimethylnitramine), and a second nitrate ester, ethyl nitrate, DfH(gas) = -155 +/- 3 kJ/mol (NIST
WebBook, Gray/Pratt/Larkin 1956). Refitting on the resulting 9-point set (five degrees of freedom, not
three):

    compound   6-fit    7-fit(+1 nitramine)   9-fit(+1 more nitramine, +1 more nitrate ester)   measured    best diff
    RDX         50.1        80.4                    82.9                                       66.6/85.0   2.1 kJ/mol
    HMX         66.0        87.8                    91.0                                       116.1       25.1 kJ/mol
    PETN       -482.0      -466.3                  -458.6                                      -539.0       80.4 kJ/mol

RDX improved again -- now within 2.1 kJ/mol of Klapoetke's Table 9.6 value, comfortably inside the
~21 kJ/mol bar against BOTH of its measured readings, and this is now real evidence (two independent
refits moving the same direction), not a single lucky point. HMX improved again but remains over the
bar. **PETN got WORSE a second time, in the same direction both times (46.6 -> 72.7 -> 80.4 kJ/mol),
despite ethyl nitrate being exactly the additional nitrate-ester data the earlier note called for.** A
one-point fluke does not repeat in the same direction twice. The more likely explanation, unresolved
this session: PETN's own structure (a quaternary carbon bearing FOUR -CH2-O-NO2 arms) is not represented
by methyl/ethyl nitrate's simple primary-alkyl-nitrate chemistry, and a purely elemental atom-equivalent
scheme has no way to encode that structural difference -- more data of the wrong SHAPE for PETN
specifically cannot fix this, and did not. Implementation and all nine calibration rows:
`benchmarks/thermophysical/orca_atom_equivalents.py`, `tests/test_orca_atom_equivalents.py` (8 tests).

**Consolidation, same session: `benchmarks/thermophysical/compare_enthalpies.py`.** Every enthalpy model
this session touched (keshavarz_nitroaromatic2009, keshavarz2010_sublimation, mathieu2018_apc,
orca_atom_equivalents) had been reported only from its own module or an interactive scratch calculation
-- this script runs all of them over one shared RDX/HMX/PETN/TNT/TATB corpus, stratified the same way
`compare_energetics.py` stratifies Tm. Building it surfaced a genuinely new result: TNT's own
mathieu2018_apc + keshavarz2010 combined route (-76.8 kJ/mol) had never actually been computed before --
only RDX/HMX/PETN's combined route had. It lands 9.7 kJ/mol from Klapoetke's measured TNT value (-67.1),
independently corroborating `keshavarz_nitroaromatic2009`'s own direct-model result (-68.8, diff 1.7) via
a completely unrelated computational path (atom-pair-contribution gas-phase model minus a separate
sublimation model, vs. a single fitted nitroaromatic-specific correlation) -- two routes that share no
parameters agreeing with each other and with measurement is stronger evidence for the nitroaromatic
stratum's accuracy than either route alone. `tests/test_compare_enthalpies.py` (7 tests) locks in both
this and the already-reported RDX/HMX/PETN numbers.

**Track 4 closing pointer (2026-09-30)**: this entry's own RDX/HMX/PETN numbers above are now stale --
`orca_atom_equivalents.py`'s module docstring is the current source of truth, not this note. Three
gates ran after this entry was written: Gate A found no usable direct-condensed-Hf alternative
(`keshavarz2006`, `nazari2016`, this survey's own `keshavarz_sadeghi2009` all failed reproduction; a
freely-available composite-ab-initio benchmark, `manaa2016_composite_qm`, is real but computationally
infeasible here) -- see that entry's own note. Gate B found a higher level of theory (PBE0/def2-TZVP)
does not help, and in fact worsens RDX/HMX slightly. Gate C found a SECOND ring nitramine
(1,4-dinitropiperazine) added to the calibration set clears the ~21 kJ/mol bar for RDX and HMX by
roughly an order of magnitude (2.2/2.9 kJ/mol), with PETN still failing (69.2 kJ/mol) -- explicitly
flagged there as promising but not yet validated on one new calibration point alone. Also note: an
RDKit-version drift silently invalidated every number recorded above BEFORE Gate B's own RETRACTED
note in `orca_atom_equivalents.py` -- re-run fresh, once, under `rdkit==2025.9.6` (now pinned exact)."""

