note = """read directly 2026-09-27 to verify RDX's melting point (the user asked for a primary-source
check, not another secondary recitation) for benchmarks/thermophysical/compare_energetics.py. Table 3.6
(p. 189, 'Thermal data of some explosives', itself citing the book's own Ref. [46] -- one level further
back than checked here) gives, as four SEPARATE columns (melting point / ignition temperature / exotherm
temperature / onset of decomposition):

    2,4,6-TNT: mp 81 C, ignition 295-300 C, exotherm 250 C
    RDX:       mp 205 C, ignition 229 C, exotherm 215 C
    beta-HMX:  mp 275 C, ignition 279-281 C, exotherm 260 C
    PETN:      mp 140 C, ignition 203 C, exotherm 160 C

This CORRECTS an over-hasty read of Klapoetke (klapotke2017, p. 303: 'the melting and decomposition
points of RDX and HMX lie close together') recorded earlier in this file as 'HMX has no clean measured
Tm'. Klapoetke's own statement is directionally right -- HMX's gap to ignition here is only ~4-6 C,
the smallest of the four, against RDX's ~24 C and TNT's ~215 C -- but Agrawal's table DOES give HMX a
specific, separately-measured melting point (275 C), not just a decomposition-adjacent estimate. Use
275 C / 548.15 K for HMX, not 'no value'.

**Ref. [46] chased 2026-09-27, at the user's request.** Table 3.6's footnote 'a) Based on Ref. [46]'
resolves, in this chapter's own reference list (p. 206-207), to:

    46. Yinon, J., and Zitrin, S. (1981) The analysis of explosives, in Pergamon Series in Analytical
        Chemistry, vol. 3 (eds R. Belcher, D. Betteridge and L. Meites), Ch. 9, Pergamon Press,
        Oxford, UK, p. 136.

NOT held (checked D:\\Xaero Stuff\\Documents\\Sci Downloads\\, no match) -- the chain stops here for
now. Yinon & Zitrin is ITSELF a secondary compilation (a 1981 forensic/analytical-chemistry text, not
an experimental measurement paper), so even reaching it would be one step closer to primary, not the
end of the chain; whatever it cites for these four numbers would be the next link. Use this entry's
values as 'read from a real, citable table, two citations removed from the original measurement',
which is materially better-supported than 'standard literature value' but is not itself a primary
source in the strictest sense."""

