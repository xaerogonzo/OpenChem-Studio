atom/group-equivalent constants and does not affect this survey's interest in reproducing them.** It
fixes a transcription error in Supporting Information Table 2S (molecular properties used in Byrd &
Rice's eqs 1, 3, 4 -- the ESP-based sublimation/vaporization model, not the gas-phase atom-equivalent
scheme): the hundreds place was truncated for every value in Table 2S's sigma^2_tot (kcal/mol) column
in the PUBLISHED table only. The correction states explicitly: "The transcription error was only in the
published version of the table and was not present for any of the calculations performed in the paper.
... None of the calculations or findings presented in the paper were affected by this transcription
error."

**A prior review of this survey's plan made two specific, checked, and WRONG claims about this
correction**: (1) it gave the correction's DOI as `10.1021/jp806520b` -- that DOI does not resolve to
this or any identifiable Byrd/Rice correction in a web search, and is simply wrong (the real DOI,
confirmed via PubMed PMID 35258312 and the ACS abstract page, is `10.1021/acs.jpca.2c01458`); (2) it
claimed the correction fixed "mislabeled group-equivalent names in Table 3" -- the actual correction is
to Table 2S (Supporting Information, not Table 3 of the main text), fixes a numeric truncation (not a
name mislabeling), and explicitly says it changed no calculation or finding. Recorded here as a concrete
instance of this project's own house rule (`feedback_answer_review_questions_with_measurements`,
`feedback_a_source_can_contradict_itself`): a review's specific factual claims about an unread source
are checked before being trusted, not carried forward."""

