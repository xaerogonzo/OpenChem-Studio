note = """the JOURNAL PRE-PROOF, not the version of record.

**Read in full 2026-09-29 (Track 4, Gate A3: does any later paper in this lineage supersede/correct
`keshavarz_sadeghi2009`'s coefficients?).** `keshavarz_sadeghi2009` is only ref [29] here, and appears
ONLY in the bibliography (line ~2764 of a full-text extraction) -- **never cited inline in this review's
main text**, checked by searching every `[29]` occurrence. This review does not address, defend, or
correct `keshavarz_sadeghi2009`'s specific coefficients at all; A2's NO_CORRECTION_FOUND /
CORRECTION_FOUND_AND_REPRODUCED / ALTERNATIVE_INTERPRETATION_FOUND question is NOT answered by this
source.

**What this review presents instead, for the exact functional-group set `keshavarz_sadeghi2009` targets**
(Sec. 2.2, "-O-O-, N3, ON=O, NO2, ONO2 and NNO2" -- nitro/nitrate-ester/nitramine among others): its own
Eq. (5), attributed to ref [42] = Nazari, Keshavarz, Hamadanian, Mosavi, Ghaedsharafi, Pouretedal,
"Reliable prediction of the condensed (solid or liquid) phase enthalpy of formation of organic energetic
materials at 298 K through their molecular structures", Fluid Phase Equilibria 408 (2016) 248-258, DOI
10.1016/j.fluid.2015.09.014 -- a DIFFERENT, later (2016), Keshavarz-coauthored paper, not held, not yet
in this registry. The review states Eq. (5)'s own reported accuracy: **rms 35.9 kJ/mol on 77 energetic
compounds** (vs. 42.1 kJ/mol for Rice et al.'s QM method and 170.6 kJ/mol for a group-additivity
comparison on smaller, differently-sized subsets of the same set) -- OVER SENSITIVITY.md's ~21 kJ/mol
bar, and notably WORSE than `keshavarz_sadeghi2009`'s own three reported table rms values (18.8-29.1
kJ/mol). **A 2021 review choosing to present a 2016 model over the 2009 one is not itself evidence the
2009 model was wrong or corrected** -- it may simply reflect broader scope (more functional groups) at
the cost of accuracy on this survey's specific classes. Eq. (5)'s own coefficients extracted as a
column of numbers (111.4, 33.11, 28.84, 86.80, 62.03, 79.25, 153.3) from what is clearly a multi-line
rendered equation/image in the source PDF -- same "multi-column tables need positional extraction" trap
this project already knows from Ionescu 2013 Table S2; the printed structure of Eq. (5) has NOT been
reliably transcribed from this text extraction and would need a high-dpi render before any reproduction
attempt, the same way marrero2001's Tables 6-8 needed.

**Two new, real, not-yet-held candidates identified by this reading, both worth requesting** (see this
survey's own request to Alex): Nazari et al. 2016 (above, DOI 10.1016/j.fluid.2015.09.014) and Keshavarz
2006 (10.1016/j.jhazmat.2005.12.006, identified independently via `keshavarz_sadeghi2009`'s own note).
Neither is a substitute for the other -- 2006 is the oldest paper in this lineage and may be the actual
source `keshavarz_sadeghi2009` itself built on; 2016 is the newest and is what a 2021 review of the same
author's own body of work chose to present."""

