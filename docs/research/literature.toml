note = """**Read in full 2026-09-28 (Track 3), as the sublimation half of a gas+sublimation combined
route for RDX/HMX/PETN's class** (the direct condensed-Hf equation, `keshavarz_sadeghi2009`, is a
confirmed reproduction failure -- see that entry). This paper explicitly covers the right compound
classes and NAMES its own test compounds: "PETN, TNT, RDX, HMX, TEX, TATB, DATB, tetryl and CL-20" --
this survey's corpus almost verbatim. Eq. (3): Hsub = 53.74 + 0.2666*MW' + 13.99*CIn - 15.58*CDe, with
CIn/CDe rules per compound class (Sec. 3.1 nitroaromatics: amino groups CIn=n_NH2 -- TATB named as the
motivating example; Sec. 3.2 nitramines: C=1.75*n(N-NO2)-4, sign selects CIn vs CDe; Sec. 3.3
nitroaliphatics: flat CDe=3.0). Reported accuracy: rms 9.9 kJ/mol vs. a QM comparison's 13.8 kJ/mol (15
compounds); rms 6.9 (Table 1) and 10.4 kJ/mol (Table 3); the full 107-compound set is within
+/-21.0 kJ/mol -- coincidentally close to SENSITIVITY.md's condensed-Hf bar, though sublimation
enthalpy and condensed-phase Hf are different quantities and this is not itself evidence about a
combined route's final accuracy.

**Reproduction: one strong check, not yet exhaustive.** `benchmarks/thermophysical/
keshavarz2010_sublimation.py`, `tests/test_keshavarz2010_sublimation.py` (8/8 passing). Table 1's first
"cyclic and acyclic nitramines" row (printed Hsub_exp=175.3, Hsub_cal=174.6) is almost certainly HMX by
magnitude; computing HMX directly (4 N-NO2 groups, C=1.75*4-4=3, CIn=3) gives 174.67 kJ/mol, matching
the paper's own calculated value almost exactly. Compound names in this paper's tables are structure
images, not extractable text, so this identification rests on magnitude/class plausibility rather than
a printed name -- a real, useful check, but not the same confidence as `keshavarz_nitroaromatic2009`'s
multi-row named reproduction. RDX (130.4), PETN (138.0), TNT (114.3), TATB (164.5) are computed from
the same equation but NOT YET independently checked against a measured or paper-printed value each.

Status: CANDIDATE -> read; REPRODUCED (one strong check, HMX). The gas-phase half of the combined route,
`mathieu2018_apc` (68 atom-pair parameters), has now been reproduced and run end-to-end against this
sublimation model -- see that entry's note for the result: REJECTED for RDX/HMX/PETN specifically (HMX
and PETN miss their measured Klapoetke values by 50 and 57 kJ/mol; RDX borderline at 16.5-35 kJ/mol),
confirming rather than just predicting the concern recorded here. This app's own ORCA integration is the
remaining unexplored option for a gas-phase source accurate enough to pair with this sublimation model."""

