note = """the 45-molecule set Cawkwell benchmarks against; file name says 2005 (received 2005), volume year is
2006.

**Read in full 2026-09-29 (Track 4, Gate A: is there a usable non-atom-equivalent-route-of-our-own
condensed-Hf source before patching `orca_atom_equivalents`?).** route = `gas_Hf_plus_sublimation` --
the same SHAPE as this survey's own `orca_atom_equivalents` + `keshavarz2010_sublimation` combined
route (QM gas-phase atom/group equivalents, refit here rather than the paper's own numbers, plus a
separately-fitted sublimation/vaporization term), not a `direct_condensed_Hf` model like
`keshavarz_sadeghi2009`/Keshavarz 2006.

**Numbers verified against the actual PDF, not carried over from a review's summary**: abstract states
rms/max, gas 3.2/6.5 kcal/mol, liquid 3.2/7.4, solid 5.6/12.2 kcal/mol (test set, i.e. genuinely
predicted, not fitted) -- confirmed present verbatim in both the abstract and Section 5 (Summary). A
prior review of this survey's plan had quoted these same two solid-phase numbers; they check out.

**publication_equation_status = printed.** Unlike `mathieu2018_apc`'s AE1/AE2 procedure (Supporting
Information only, not held) or `keshavarz_sadeghi2009`'s Eq (1) (printed but does not reproduce), Table 3
of this paper's OWN main text prints the actual fitted atom/group-equivalent constants in hartree
(B3LYP/6-311++G(2df,2p)//B3LYP/6-31G* level): C -38.123748, H -0.597580, N -54.785466, O -75.187087,
C' -38.129456, N' -54.788487, O' -75.186033, C-NO2 -205.160396, C'-NO2 -205.163484, N-NO2 -205.166631,
O-NO2 -164.364907, C-N3 -129.976691 (their Eq 1: DfH(g) = E - sum(n_j * eps_j), note the MINUS sign,
opposite convention from this survey's own `orca_atom_equivalents.compute_gas_hf`'s E + sum(n*AE)).
**reproduction_status = not yet attempted** -- applying these constants correctly requires classifying
each atom into the paper's seven types (C/H/N/O for single-Lewis-structure atoms vs. C'/N'/O' for
atoms in "multiple-bonded environments", plus the four listed group equivalents), and the main text does
not fully specify that classification rule (analogous to `mathieu2018_apc`'s own nitro-bond-order
ambiguity, which took a three-value cross-check to resolve) -- Table 1S (Supporting Information, NOT
held) would remove the ambiguity by giving per-molecule assigned values directly, so this is not yet a
finished reproduction, only a real, well-specified candidate.

**Reproduction ATTEMPTED 2026-09-29 (Track 4, Gate A follow-up) and FAILED -- the third confirmed
reproduction failure in this survey's literature review** (after `keshavarz_sadeghi2009` and
`keshavarz2006`). Real ORCA jobs were run at Byrd & Rice's own exact recipe (B3LYP/6-31G(d) geometry
optimization, single-point at B3LYP/6-311++G(2df,2p) on that geometry) for four validation compounds
with known real experimental gas DfH already in this survey's own `orca_atom_equivalents.py`
CALIBRATION_SET (methane, nitromethane, methyl_nitrate, dimethylnitramine -- covering plain atoms and
all three "X-NO2" group types) before spending compute on RDX/HMX/PETN. Methane alone (no nitro group)
reproduced with a normal-sized 108.6 kJ/mol residual. Every nitro/nitrate/nitramine compound was off by
300-500 kJ/mol under EVERY classification scheme tried:

- Sum of plain atom equivalents only (no group term at all): nitromethane off by 306.7 kJ/mol.
- Group term (C-NO2/O-NO2/N-NO2) REPLACING the attachment atom + N + 2 O as one lump: off by
  99,785-304,126 kJ/mol -- an absurd, atom-scale error (roughly one whole extra atom's worth of energy
  unaccounted for), ruled out immediately.
- Group term used as a SEPARATE fragment (N+2O only) with the attachment atom ALSO counted separately
  (plain C/O added on top): nitromethane 308.7, dimethylnitramine 475.1 kJ/mol off -- barely different
  from the no-group case, because the fitted group constants turn out to be numerically almost identical
  to summing the corresponding plain atom equivalents (C-NO2's -205.160396 Eh vs plain N+2*O's
  -205.159640 Eh differ by only 0.0008 Eh, ~2 kJ/mol) -- so no interpretation of what the group
  "includes" changes this outcome; the group correction is essentially inert for this specific check.
- methyl_nitrate's residual (106,723-304,126 kJ/mol depending on scheme) never dropped to a sane range
  under any combination tried.

**Conclusion: whatever atom-type classification Byrd & Rice's own paper actually used for nitro-group
atoms cannot be pinned down from Table 3 and the main text alone** -- the printed atom/group equivalents
are real and confirmed as printed, but applying them (under every reading of "what a group equivalent
covers" this session could construct) does not reproduce even the simplest nitro-containing validation
compound, let alone RDX/HMX/PETN. This is the same missing-Table-1S gap flagged above, now confirmed by
actual computation rather than left as a hypothetical risk. RDX/HMX/PETN's own computed values from this
attempt (gas Hf: RDX -430,167, HMX -573,585, PETN -1,216,867 kJ/mol) are physically absurd on their face
(orders of magnitude off any plausible DfH) and are not being carried forward or compared against
Klapoetke's measured values -- there is nothing left to compare once the validation step itself fails
this badly. Status update: reproduction_status = failed (was: not yet attempted).

**RDX/HMX/PETN's own role in this paper's own corpus** (Tables 1-2, this survey's corpus overlaps
substantially): RDX is in the TRAINING set with measured g/s/sub data (i.e. RDX's own experimental
values were used to fit eqs 1/3/4 here -- this paper does not "predict" RDX blind). PETN is in the
TRAINING set with measured s/sub data only (no gas value listed). beta-HMX is in the TEST set with
measured s only, i.e. its solid-phase Hf is a genuinely predicted value in this paper's own accounting
-- but the actual per-molecule number is in Table 1S (SI, not held), so it cannot be read off this main
text; Table 5's aggregate 49-molecule solid-phase test-set rms/max is the only HMX-relevant number
available without the SI (6.0/16.7 kcal/mol using atom equivalents; 5.6/12.2 kcal/mol using group
equivalents -- both include HMX among the 49, not isolated to it).

**A real correction to this paper exists and is NOT yet held or read**: "Correction to 'Improved
Prediction of Heats of Formation of Energetic Materials Using Quantum Mechanical Calculations'",
J. Phys. Chem. A 2022, 126(10), 1787, DOI 10.1021/acs.jpca.2c01458, PMID 35258312 (confirmed real via
web search 2026-09-29, both PubMed and the ACS abstract page resolve). **A prior review of this survey's
plan claimed this correction's DOI is 10.1021/jp806520b and that it fixes mislabeled group-equivalent
names in Table 3 -- neither claim checks out**: 10.1021/jp806520b does not resolve to any identifiable
Byrd/Rice correction in a web search, and the actual correction's own content has not been read (ACS's
page returns a bot-check wall to automated fetching; the correction is not in Sci Downloads). Do not
assume the "Table 3 mislabeled" claim is true until the real correction (DOI acs.jpca.2c01458) is
actually obtained and read -- ask Alex for it directly (paywalled), separately from Keshavarz 2006.

Status: CANDIDATE -> read (main paper only). Its own atom/group equivalents are a genuine,
independently-specified alternative to this survey's from-scratch `orca_atom_equivalents` fit, worth
actually running once the atom-classification ambiguity above is resolved -- but not yet attempted, and
its real 2022 correction is still unread."""

