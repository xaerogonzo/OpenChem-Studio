id = "keshavarz2006"
file = "keshavarz2006.pdf"
sha256 = "b2303db670e0c900eaf2f8e744390446bdab508cdf4675ee29e2e4ccf299778e"
pages = 6
access = "held"
printed.doi = "10.1016/j.jhazmat.2005.12.006"
printed.title = "Theoretical prediction of condensed phase heat of formation of nitramines, nitrate esters, nitroaliphatics and related energetic compounds"
printed.venue = "J. Hazard. Mater. A136 (2006) 145-150"
assigned.property = "enthalpy_solid"
assigned.role = "candidate_method"
note = """Requested from Alex 2026-09-29 (Track 4, Gate A1) as the oldest paper in `keshavarz_sadeghi2009`'s
own lineage, and read in full the same day. route = `direct_condensed_Hf` (unlike this survey's own
`orca_atom_equivalents` route, no QM or sublimation term needed at all -- a,b,c,d elemental counts plus a
handful of structural-factor counts).

**Eq. (3)**: DHf(c) = 29.68a - 31.85b + 144.2c - 88.84d - 88.84*nOH - 39.14*nN-NO2 - 45.62*n(C=O) +
256.3*n(0/1) - 380.5*n(=C<N-N) + 30.20*nO-NO2, where a/b/c/d are C/H/N/O counts, nOH/nN-NO2/n(C=O)/
nO-NO2 are functional-group counts, n(0/1) = 1 for a hydrogen-free compound else 0, and n(=C<N-N) counts
a specific =C(-N)(-N) structural moiety (absent from RDX/HMX/PETN). Coefficients confirmed TWICE
independently -- text extraction and a 250 dpi page render of Eq. (3) itself -- with no discrepancy
between them, ruling out an OCR/transcription error on this survey's part.

**RDX, HMX, PETN are all THREE in the paper's own Table 1** (fitted/training data, not a holdout),
directly giving condensed-phase predictions with no combined-route needed:
Hexahydro-1,3,5-trinitrotriazine (RDX) exp=79.1, New method=101.7, dev=22.6 kJ/mol (borderline over
SENSITIVITY.md's ~21 kJ/mol bar); Octahydro-1,3,5,7-tetranitro-1,3,5,7-tetrazocine (HMX) exp=75.3, New
method=135.6, dev=60.3 kJ/mol (well over); Tetranitrate pentaerythritol (PETN) exp=-538.5, New
method=-497.5, dev=41.0 kJ/mol (well over) -- all worse than this paper's own comparator, Rice/Byrd's
quantum-mechanical method (dev 28.0/11.7/27.6 kJ/mol for the same three, respectively).

**Reproduction attempted 2026-09-29 and FAILED -- a second, independent case in this exact citation
lineage** (after `keshavarz_sadeghi2009`'s own confirmed failure): applying Eq. (3) to RDX/HMX/PETN
using the confirmed coefficients gives 112.7/150.2/-474.9 kJ/mol -- none matching the printed
101.7/135.6/-497.5 values. This is NOT explained by a missing structural-factor term for these three
specific compounds (RDX/HMX/PETN have zero OH, zero C=O, zero =C<N-N groups, and the sole applicable
terms -- nN-NO2=3/4 for RDX/HMX, nO-NO2=4 for PETN -- were included). The equation also fails to
reproduce the SIMPLEST possible test case in Table 2: row 1, CH3CH2CH(NO2)2 (C3H6N2O4, no special
functional groups at all, pure elemental terms), printed New method = -176.6 kJ/mol; Eq. (3) with these
counts gives -169.0 kJ/mol, a 7.6 kJ/mol gap with nothing left to attribute it to. **Whatever is wrong
is not visible in the printed paper** -- same conclusion as `keshavarz_sadeghi2009`'s own reproduction
failure, and the same recommendation: this is a real dead end from what is available here, not something
to keep re-attempting by guessing at term definitions.

**A genuine cross-paper data inconsistency, found while cross-checking against `nazari2016`**: this
paper's Table 1 gives RDX (row 18) exp=79.1 kJ/mol and HMX (row 17) exp=75.3 kJ/mol. `nazari2016`'s own
Table 1 (its test-set rows 46-47) gives the SAME two numbers to the SAME two compounds in the OPPOSITE
assignment: RDX exp=75.3, HMX exp=79.1. Neither 75.3 nor 79.1 is close to Klapoetke's real measured HMX
value used elsewhere in this survey (116.1 kJ/mol, klapotke2017 Tab. 9.16a) -- both papers appear to be
drawing from the same (or a related) NIST WebBook-sourced compilation that has these two compounds'
values transposed, confused, or otherwise wrong for HMX specifically. This does not change this survey's
own Klapoetke-sourced HMX target value, but it means neither Keshavarz-lineage paper's own RDX/HMX
comparison table should be read as independent corroboration of anything about HMX -- their own
"experimental" HMX number is itself suspect.

Status: CANDIDATE -> read; SOURCE_VALIDATED (the paper's own printed equation and tables are recorded
and trusted at face value) but NOT REPRODUCED. publication_equation_status = printed (confirmed by
independent render, not just text extraction). reproduction_status = failed."""

