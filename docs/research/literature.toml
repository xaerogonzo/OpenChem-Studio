note = """the ACCEPTED MANUSCRIPT, not the version of record.

Read 2026-09-28 (Track 3, Detonation's missing condensed-phase enthalpy input). This is the
gas-phase-plus-sublimation COMBINED route, not a direct empirical correlation: DfH(solid) =
DfH(gas) - DsubH, using GF0 (this paper's own geometric-fragment sublimation model, fit on 185
high-nitrogen compounds, SUB-185) for DsubH and one of three options for DfH(gas). Validated on
SOL-40 (40 high-nitrogen crystals, the same set Suntsova & Dorofeeva used for a G4/mGIPF combination).

    DfH(gas) source          AAD on SOL-40 (excl. 3 dubious experimental values)
    G4/G4MP2 ab initio       19.5 kJ/mol  -- clears SENSITIVITY.md's ~21 kJ/mol (5 kcal/mol) bar
    APC (mathieu2018_apc)    59 kJ/mol    -- ~3x over the bar
    PM3 (semi-empirical)     84 kJ/mol    -- ~4x over the bar

Only the EXPENSIVE ab initio route clears the bar; the two FAST routes this app could actually run
routinely both miss badly. SOL-40 is also a high-nitrogen-compound set (mostly tetrazines and
furazans, per the paper's own description) -- not tested against RDX/HMX-type classic nitramines
specifically, so this candidate's applicability to THIS survey's existing corpus is itself unverified,
separate from the accuracy question. Status: CANDIDATE -> read; REJECTED for a fast/practical route at
this accuracy; the ab initio route is SOURCE_VALIDATED but not evaluated further here as G4/G4MP2 is
not practical for routine use in this app."""

