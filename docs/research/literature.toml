425-431) -- also real, not the one keshavarz2012 cites; not held.

**Read in full 2026-09-28.** Eq. (2): DfH(c) = core term + z1..z7 adjustable parameters (MLR, R2=0.97),
DE terms from OH/NHx/C(=O) ratios to nitro-group count (paper's own Sec. 3.2), IE terms from alkyl/
alkoxy/hydrazine/azo attachment to the ring (Sec. 3.3). Three validation tables, same shape as
`keshavarz_sadeghi2009`'s, consistently better than the paper's own "previous work" [14] baseline but
running slightly ABOVE SENSITIVITY.md's ~21 kJ/mol bar rather than under it:

    Table 1: rms 25.7 kJ/mol (new) vs 39.1 (QM, Rice) vs 43.9 (previous work) -- average deviation 19.7.
    Table 2 (27 nitroaromatics, NIST WebBook values): average deviation 21.8 kJ/mol (no rms given).
    Table 3 ("well-known explosives", presumably including TNT among unlabeled structure rows --
        compound names are structure images in this table, not extractable as text): average error
        23.4 kJ/mol (new) vs 42.7 (previous work); rms 29.8 vs 62.5.

So the nitroaromatic model (TNT/tetryl/TATB's class) sits in roughly the same 20-30 kJ/mol band as the
nitramine model, consistently on the wrong side of the ~21 kJ/mol screening bar by these papers' own
broader tables (only `keshavarz_sadeghi2009`'s Table 1, a smaller and more favorable set, clears it
cleanly) -- both far better than the comparison baselines shown throughout, neither a clean pass.

**REPRODUCED 2026-09-28, unlike the sister paper.** Unlike `keshavarz_sadeghi2009`'s Eq. (1) (a plain
linear sum that does NOT reproduce that paper's own table -- see that entry), Eq. (2) here IS a ratio,
divided by `0.0001 * MW`, and DOES reproduce this paper's own printed values within rounding on every
row checked (`benchmarks/thermophysical/keshavarz_nitroaromatic2009.py`,
`tests/test_keshavarz_nitroaromatic2009.py`, 8/8 passing):

    1,3-dinitrobenzene (no correction terms):        computed -49.25, printed -49.3
    dinitrophenol (OH term):                          computed -239.83, printed -240.0
    2,4-/2,6-dinitrotoluene (alkyl/IFG term):         computed -37.55, printed -37.6

One real bug was FOUND AND FIXED while reproducing this: the DFG/"decreasing" column header literally
reads "(n_NO2/n_DFG/SP) x E", but the printed values across three independent rows (dinitrophenol,
an NHx-linked diphenylamine, dinitronaphthalene) show the term equals E alone (or, for naphthalene, the
paper's own fixed n_DFG/SP=2.0), never E multiplied by any n_NO2/n_DFG/SP ratio -- a first
implementation using the literal ratio reproduced TATB by coincidence (its own ratio happens to equal 1)
while missing dinitrophenol by 2x. Recorded in the module's own docstring so this isn't rediscovered the
hard way twice.

**TNT (this survey's own corpus) cross-checked against an INDEPENDENT primary source, not just this
paper's own table**: predicted -68.8 kJ/mol; Klapoetke (klapotke2017, p. 243, already cited in
docs/sources.toml) states TNT's DfH = -295.5 kJ/kg, which converts to -67.1 kJ/mol for TNT's own molar
mass -- agreement within 1.7 kJ/mol, far inside the ~21 kJ/mol bar. TATB predicted at -68.2 kJ/mol but
NOT yet checked against any measured value (none found/verified this session). Tetryl is NOT covered:
its exocyclic N(CH3)(NO2) nitramino substituent matches neither this paper's DFG rules (OH/NHx/carbonyl/
naphthalene) nor its IFG rules (alkyl/alkoxy/hydrazine/azo) -- an aC-N-type gap, the same shape as
Marrero-Gani's own aC-N gap for tetryl, and left unscored rather than forced into an ill-fitting rule.

Status: CANDIDATE -> read; REPRODUCED (own table, 3 independent rows); INDEPENDENTLY_VALIDATED for TNT
specifically (one compound, one external check -- not a held-out set); NOT YET run against a real
held-out set of this survey's own choosing, which is what a PROMOTABLE verdict would need."""

