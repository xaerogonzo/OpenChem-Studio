#
# Written by hand from each file's OWN first page (never from its filename), 2026-09-24; see README.md
# beside this file for the rules. Two kinds of field, kept apart on purpose:
#
#   printed.*   what the paper itself says -- DOI, title, venue. Checkable against the file.
#   assigned.*  OUR reading of what the paper is for. Not evidence about the paper.
#
# `file` is a LOCATOR in the maintainer's library and never identity; `sha256` says the file is
# still the one that was read. `access` is NOT a verdict on the science: a paper we cannot read
# is not a paper we rejected.


