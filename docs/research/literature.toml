points of RDX and HMX lie close together') recorded earlier in this file as 'HMX has no clean measured
Tm'. Klapoetke's own statement is directionally right -- HMX's gap to ignition here is only ~4-6 C,
the smallest of the four, against RDX's ~24 C and TNT's ~215 C -- but Agrawal's table DOES give HMX a
