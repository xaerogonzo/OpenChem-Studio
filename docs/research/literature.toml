note = """the file prints a PII (S0378-3812(01)00431-9), not a DOI. Tables 6-8 (pp. 194-202, first/
second/third-order groups) have NO text layer -- render at 220+ dpi and read the images, same trap as
vogel1996.pdf. Checked 2026-09-27: Table 6 (182 first-order groups) has group 176 'N (cyclic)' (example
N-methylpyrrolidine) and group 81 'NO2 except as above' (example nitrocyclohexane, a C-bound example but
the group is a generic NO2 substituent fragment by the paper's own group-assignment rules, not restricted
to a carbon attachment) -- together these plausibly decompose RDX/HMX's ring N-NO2 (nitramine) motif as
N(cyclic) + NO2(except as above) + CH2(cyclic), where Joback (1987) refuses outright for lack of a ring
tertiary amine group. Table 7 (122 second-order groups) has no nitramine-specific correction. Table 8
(third-order, polycyclic) is not expected to apply -- RDX and HMX are each a single ring.

The group tables (this table AND Table 2's universal constants) are now transcribed and CONFIRMED --
tests/test_marrero2001_table.py reproduces the paper's own Appendix B worked examples (Examples 1, 3, 4)
to 4 decimal places on the group summation and to 0.02 K on the final Tb/Tm, from
benchmarks/thermophysical/marrero2001_table.py.

**RDX/HMX/TNT/PETN comparison run 2026-09-27** (benchmarks/thermophysical/compare_energetics.py,
tests/test_energetics_thermophysical_comparison.py): first-order Marrero-Gani Tm only (no second-order
correction applied to any of the four -- Table 7 has none for the nitramine motif, and TNT's own
substitution pattern was not run through the paper's positional convention). Against Joback's real,
shipped output (compute_joback, actual app code):

  RDX:  Joback refuses (UNCOVERED_ATOM).           Marrero-Gani Tm = 374.0 K vs measured ~477 K (-103 K).
  HMX:  Joback refuses (UNCOVERED_ATOM).           Marrero-Gani Tm = 416.4 K (no measured value to score
                                                    against -- Klapoetke p. 303 says HMX's melting and
                                                    decomposition points lie close together).
  TNT:  Joback runs, Tf = 663.46 K vs 353.5 K (+310 K, from Klapoetke's own text, p. 303, already cited
        as klapotke2017).                          Marrero-Gani Tm = 401.6 K vs 353.5 K (+48 K).
  PETN: Joback runs, Tf = 811.89 K vs 414.45 K (+397 K, standard literature value, not read from a
        primary source this session).              Marrero-Gani Tm = 359.1 K vs 414.45 K (-55 K).

So: on the two molecules Joback ALREADY claims to cover, its freezing-point estimate is wrong by
300-400 K (confirms the paper's own 'not accurate... only very approximate' caveat on Tf, and then
some) while first-order Marrero-Gani lands within 50-60 K on the same two -- a real control result,
not just 'it gives a number where Joback refuses'. On the two nitramines Joback refuses outright,
Marrero-Gani underestimates RDX by about 100 K with no way (yet) to correct it: no second-order group
in Table 7 addresses a ring N bonded to NO2, so the error is a property of the first-order
decomposition itself, not a missing refinement step. Four molecules is not a held-out set --
docs/CALCULATOR_MATURITY.md's promotion checklist (a stratified accuracy result, a frozen fixture,
declared scope) still applies in full before this becomes a calculator, and RDX's ~100 K miss is
itself a reason it might not clear that bar for the nitramine slice even if TNT/PETN-like molecules
would.

**A caveat that reframes what 'coverage' should mean here, found 2026-09-27**: most of what Joback and
this table both estimate -- Tb, Tc, Pc, Vc -- describes a state RDX and HMX never reach: both decompose
(detonate) well before any normal boiling point, so a numeric Tb for either is not a measurement of
anything physical, whichever method produces the number. The properties that stay meaningful for a
compound that decomposes on heating are the ones with a real measured value below the decomposition
point -- principally Tm. RDX has one (~477 K, a standard literature value, itself not yet checked
against a primary source); HMX does not even get that far -- Klapoetke (klapotke2017, p. 303, read
directly this session) says its melting and decomposition points lie too close together to separate,
so no clean measured Tm exists to compare a method against. Possibly Cp too. So the actual opportunity
this survey should evaluate is narrower than 'replace
Joback's 11 outputs for energetics': it is Tm specifically, not the full property battery, and Thermophysical's
own reported scope note should say so if this is ever promoted.

This also bears on Detonation's missing input, but less directly than it first appears: this table's
Hf1i/Gf1i columns are the compound's standard enthalpy/Gibbs energy of formation at 298 K, and the
worked examples are ordinary liquids and gases -- nothing here says whether that basis is gas-phase or
each compound's own standard state, and Kamlet-Jacobs needs the CONDENSED-phase value specifically
(Detonation's own support_reason and docs/research/SENSITIVITY.md). That is exactly why the survey
already tracks a SEPARATE enthalpy_solid line (mathieu2018_iecr, jafari2016, keshavarz2012/2021) rather
than assuming this table's Hf column would do -- do not substitute one for the other without checking
the phase basis in Marrero-Gani's own methodology text first."""

