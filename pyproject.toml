[project]
name = "openchem"
version = "0.1.0"
description = "Open-source, plugin-based chemistry workstation (molecular editor + cheminformatics environment)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Alex", email = "pmpd@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "pyside6-addons>=6.7",
    "rdkit>=2024.3.1",
]

[project.scripts]
openchem = "openchem.main:main"

[project.optional-dependencies]
openbabel = [
    "openbabel-wheel>=3.1.1.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"
