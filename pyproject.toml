[project]
name = "openchem"
version = "0.1.0"
description = "Open-source, plugin-based chemistry workstation (molecular editor + cheminformatics environment)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Alex", email = "pmpd@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dimorphite-dl>=2.0.2",
    "keyring>=25.7.0",
    "msgpack>=1.2.1",
    "platformdirs>=4.11.0",
    # Name-to-structure. Bundles OPSIN's jar (13 MB) and shells out to a
    # JRE, so it is only useful with Java present -- which the app can now
    # install itself (services/java_setup.py). It stays import-guarded in
    # chem/naming_providers.py regardless, because the JRE is the real
    # requirement and declaring the package cannot guarantee one.
    "py2opsin>=1.2.0",
    "pyside6>=6.7",
    "pyside6-addons>=6.7",
    "rdkit>=2024.3.1",
]

[project.scripts]
openchem = "openchem.main:main"

[project.optional-dependencies]
openbabel = [
    "openbabel-wheel>=3.1.1.23",
]
ai = [
    "anthropic>=0.120.2",
    "openai>=2.50.0",
]
network = [
    "requests>=2.32",
]
docking = [
    "vina>=1.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Not in `dev`: freezing is a release activity, PyInstaller pulls in
# pefile/pywin32 that nothing else needs, and a test run should not have to
# install it. `uv sync --group build` before running build.ps1.
build = [
    "pyinstaller>=6.11",
]
# Only `benchmarks/nmr` needs this, and it is a dependency GROUP rather than
# an optional-dependency extra deliberately: an extra is something a user can
# install to gain a feature, and there is no such feature. The shift model it
# trains was measured against the HOSE lookup and lost, so nothing in `src/`
# imports scikit-learn. See benchmarks/nmr/README.md.
bench = [
    "scikit-learn>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The vendored nomenclature engine ships ~2,900 of its own tests. They are
# real and they pass, but they take 6.5 minutes against this suite's 2, and
# they cover that engine's internals rather than our integration with it.
# Excluded from the default run; see src/openchem/vendor/VENDORING.md for
# when to run them (`uv run pytest tests/vendor -q`).
norecursedirs = ["tests/vendor"]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"
