<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenChem Studio - Macromolecule Viewer</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
    <link rel="stylesheet" type="text/css" href="molstar.css" />
    <script src="molstar.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      qwebchannel.js is served from Qt's own qrc:// resource scheme and only
      resolves when this page is loaded inside a QWebEngineView that has
      QWebEnginePage.setWebChannel() called on it (see
      ui/widgets/molstar_viewer_backend.py) — same convention as
      resources/viewer3d/viewer.html.
    -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      var bridge = null;
      var viewer = null;
      // Viewer.create(...) resolves asynchronously (unlike 3Dmol.js, which
      // is ready synchronously) — same shape of problem Ketcher's own
      // async init has (see ketcher_editor_backend.py's docstring), so
      // calls made before the promise resolves are queued here rather
      // than assuming the viewer already exists.
      var pendingCalls = [];

      function whenReady(fn) {
        if (viewer) {
          fn();
        } else {
          pendingCalls.push(fn);
        }
      }

      window.openchemMolstarViewer = {
        loadStructure: function (structureText, format, label) {
          whenReady(function () {
            viewer.plugin.clear().then(function () {
              viewer.loadStructureFromData(structureText, format, { dataLabel: label });
            });
          });
        },
        // Adds a structure alongside whatever is already loaded, without
        // clearing first -- used to show a docked ligand pose together
        // with its receptor (see ui/widgets/molstar_viewer_backend.py's
        // load_additional_structure).
        loadAdditionalStructure: function (structureText, format, label) {
          whenReady(function () {
            viewer.loadStructureFromData(structureText, format, { dataLabel: label });
          });
        },
        clear: function () {
          whenReady(function () {
            viewer.plugin.clear();
          });
        },
        // Colours whole residues (see ui/visualization.py's
        // ResidueColorLayer). `residueColors` maps "TYR652" -> "#rrggbb".
        //
        // The selection is a mol-script expression with BARE symbols:
        // (= atom.auth_comp_id TYR), never (= atom.auth_comp_id "TYR").
        // Quoting silently matches ZERO atoms while the transform still
        // commits successfully, which is a genuinely nasty failure mode --
        // it cost a whole round of "the API must be broken" before an
        // interactive probe showed unquoted working and quoted not.
        // auth_* (not label_*) because these residue ids come from
        // pose_analysis reading a PDB, which is author numbering.
        applyResidueColors: function (residueColors) {
          whenReady(function () {
            var plugin = viewer.plugin;
            var ST = molstar.lib.plugin.StateTransforms;
            var hier = plugin.managers.structure.hierarchy.current;
            if (!hier.structures.length) { return; }

            // Group by colour so each distinct colour is one overpaint
            // layer, rather than one layer per residue.
            var byColor = {};
            Object.keys(residueColors || {}).forEach(function (residue) {
              var match = /^([A-Za-z]+)(-?\d+)$/.exec(residue);
              if (!match) { return; }
              var color = residueColors[residue];
              (byColor[color] = byColor[color] || []).push(
                '(and (= atom.auth_comp_id ' + match[1].toUpperCase() + ') (= atom.auth_seq_id ' + match[2] + '))'
              );
            });

            var layers = Object.keys(byColor).map(function (color) {
              var clauses = byColor[color];
              var expression = clauses.length === 1
                ? '(sel.atom.res ' + clauses[0] + ')'
                : '(sel.atom.res (or ' + clauses.join(' ') + '))';
              return {
                script: { language: 'mol-script', expression: expression },
                color: parseInt(color.replace('#', ''), 16),
                clear: false,
              };
            });

            hier.structures.forEach(function (structure) {
              structure.components.forEach(function (component) {
                component.representations.forEach(function (representation) {
                  plugin.build().to(representation.cell.transform.ref).apply(
                    ST.Representation.OverpaintStructureRepresentation3DFromScript,
                    { layers: layers }
                  ).commit();
                });
              });
            });
          });
        },
        clearResidueColors: function () {
          whenReady(function () {
            var plugin = viewer.plugin;
            var refs = [];
            plugin.state.data.cells.forEach(function (cell, ref) {
              if (cell.transform.transformer.id && /overpaint/i.test(cell.transform.transformer.id)) {
                refs.push(ref);
              }
            });
            if (!refs.length) { return; }
            var builder = plugin.build();
            refs.forEach(function (ref) { builder.delete(ref); });
            builder.commit();
          });
        },
      };

      molstar.Viewer.create('app', {
        layoutIsExpanded: false,
        layoutShowControls: true,
        layoutShowRemoteState: false,
        layoutShowSequence: true,
        layoutShowLog: false,
        layoutShowLeftPanel: true,

        viewportShowExpand: true,
        viewportShowSelectionMode: false,
        viewportShowAnimation: false,
      }).then(function (createdViewer) {
        viewer = createdViewer;
        pendingCalls.forEach(function (fn) { fn(); });
        pendingCalls = [];

        // Forwards click events to Python — event.current is a Loci
        // (mol-model/loci.d.ts); "empty-loci" means the user clicked on
        // empty space, not a structural element.
        viewer.subscribe(viewer.plugin.behaviors.interaction.click, function (event) {
          // The underlying RxJS BehaviorSubject emits its initial/default
          // value synchronously to a brand-new subscriber (before any real
          // click), so both "no current loci at all" and "empty-loci" must
          // be treated as "nothing was clicked."
          if (bridge && event && event.current && event.current.kind && event.current.kind !== 'empty-loci') {
            bridge.structureClicked(event.current.kind);
          }
        });

        if (bridge) {
          bridge.viewerReady();
        } else {
          // QWebChannel below hasn't finished connecting yet; tell it once
          // it does (see the channel callback further down).
          window.openchemMolstarViewerReadyPending = true;
        }
      });

      if (window.qt && window.qt.webChannelTransport) {
        // eslint-disable-next-line no-undef
        new QWebChannel(window.qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge;
          if (window.openchemMolstarViewerReadyPending) {
            bridge.viewerReady();
            window.openchemMolstarViewerReadyPending = false;
          }
        });
      }
    </script>
  </body>
</html>
