<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenChem Studio - Macromolecule Viewer</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
    <link rel="stylesheet" type="text/css" href="molstar.css" />
    <script src="molstar.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      qwebchannel.js is served from Qt's own qrc:// resource scheme and only
      resolves when this page is loaded inside a QWebEngineView that has
      QWebEnginePage.setWebChannel() called on it (see
      ui/widgets/molstar_viewer_backend.py) — same convention as
      resources/viewer3d/viewer.html.
    -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      var bridge = null;
      var viewer = null;
      // Viewer.create(...) resolves asynchronously (unlike 3Dmol.js, which
      // is ready synchronously) — same shape of problem Ketcher's own
      // async init has (see ketcher_editor_backend.py's docstring), so
      // calls made before the promise resolves are queued here rather
      // than assuming the viewer already exists.
      var pendingCalls = [];

      // LOADING IS A STATE MACHINE, NOT "SOME PROMISE".
      //
      // `loadStructure` does all its work inside `plugin.clear().then(...)`
      // and returns immediately, while `loadAdditionalStructure` used to run
      // synchronously. `_on_docking_result_ready` issues the two back to
      // back, so the pose interleaved into the middle of the receptor load.
      // Measured against the real bundle, that left the state tree as
      //
      //     receptor  type {name: 'assembly', params: {id: '1'}}
      //     pose      type {name: 'model'}
      //
      // -- the exact inversion of what is wanted, because
      // `showDepositedCoordinates` kept the LAST matching cell and that was
      // the pose. Retargeting a single-ligand structure is a NO-OP, so
      // nothing anywhere reported a problem while the receptor was drawn as
      // assembly 1: on 6WGT that is chain A, about 43 A from the chain-B
      // pocket the search box and the pose are both in. Precisely the
      // reported "docked way outside the receptor".
      //
      // Two pieces of state, and BOTH are load-bearing:
      //
      //   loadChain       serializes loads, so a pose can no longer land in
      //                   the middle of a receptor's promise chain
      //   loadGeneration  identifies WHICH receptor load a pose belongs to
      //
      // Serialization alone is not enough. Docking twice in quick
      // succession would queue pose 1 behind receptor 2 and attach it to the
      // wrong receptor -- a plausible-looking picture that is simply the
      // wrong answer, which is the failure mode this whole page exists to
      // remove. So an additional structure captures the generation current
      // when it was REQUESTED and is DROPPED if that receptor has since been
      // superseded, rather than being drawn against a receptor it was never
      // computed for.
      //
      // Latest-wins rather than queue-everything, the same shape
      // `searchBoxDesired` / `applySearchBox` already uses below.
      var loadGeneration = 0;
      var loadChain = Promise.resolve();

      // Runs `step` after whatever is already in flight, in order. A step
      // that throws must not wedge every later load, so both arms of the
      // `then` continue the chain -- a rejected chain here would leave the
      // viewer permanently unable to load anything, with no error anyone
      // could see.
      function queueLoad(step) {
        loadChain = loadChain.then(step, step);
        return loadChain;
      }

      // Every committed `structure-from-model` ref, in state-tree order.
      // ONE implementation, used by the ownership diff, by
      // `showDepositedCoordinates` and by the `structureTransforms` probe --
      // two implementations of "which cells are structures" is exactly the
      // drift the single discovery layer exists to prevent.
      function structureFromModelRefs() {
        var refs = [];
        if (viewer && viewer.plugin) {
          viewer.plugin.state.data.cells.forEach(function (cell, cellRef) {
            if ((cell.transform.transformer.id || '') === 'ms-plugin.structure-from-model') {
              refs.push(cellRef);
            }
          });
        }
        return refs;
      }

      function whenReady(fn) {
        if (viewer) {
          fn();
        } else {
          pendingCalls.push(fn);
        }
      }

      function residueClause(residue) {
        var match = /^(?:([A-Za-z][A-Za-z0-9]*)\/)?([A-Za-z]+)(-?\d+)$/.exec(residue);
        if (!match) { return null; }
        var terms = '(= atom.auth_comp_id ' + match[2].toUpperCase() +
                    ') (= atom.auth_seq_id ' + match[3] + ')';
        if (match[1]) {
          terms = '(= atom.auth_asym_id ' + match[1] + ') ' + terms;
        }
        return '(and ' + terms + ')';
      }

      window.openchemMolstarViewer = {
        loadStructure: function (structureText, format, label) {
          whenReady(function () {
            // Claim a generation BEFORE queueing, so a pose requested after
            // this call binds to THIS load even though neither has run yet.
            var generation = ++loadGeneration;
            queueLoad(function () {
              return viewer.plugin.clear().then(function () {
              // `plugin.clear()` empties the whole state tree, so any box
              // this page drew is GONE and its refs are dangling. Forget
              // them -- without this, `searchBoxState()` keeps describing a
              // shape that no longer exists, and the next replacement
              // deletes refs that resolve to nothing.
              //
              // `searchBoxDesired` deliberately SURVIVES: the caller still
              // wants that region shown, so the box is restored onto the
              // structure once it is in. That is what makes loading a
              // receptor redraw its search box without the window having to
              // sequence the two.
                searchBoxRefs = null;
                searchBoxGeometry = null;
                // A newer receptor arrived while this one was clearing, so
                // this load is stale. Return rather than loading a structure
                // the caller has already replaced.
                if (generation !== loadGeneration) { return; }
                // OWNERSHIP BY DIFF: snapshot the structure cells before the
                // load, and whatever is new afterwards is OURS.
                //
                // `loadStructureFromData`'s return shape is NOT relied on --
                // this project's standing rule is that a Mol* API is probed
                // against the vendored bundle rather than assumed, and that
                // rule was earned here: passing `structure: {name: 'model'}`
                // in this very call's options is accepted and SILENTLY
                // IGNORED. A diff over the state tree asks the state tree,
                // which is the thing that decides what is drawn.
                var before = structureFromModelRefs();
                return Promise.resolve(
                  viewer.loadStructureFromData(structureText, format, { dataLabel: label })
                ).then(function () {
                  if (generation !== loadGeneration) { return; }
                  var mine = structureFromModelRefs().filter(function (ref) {
                    return before.indexOf(ref) === -1;
                  });
                  showDepositedCoordinates(mine);
                  applySearchBox();
                });
              });
            });
          });
        },
        // Adds a structure alongside whatever is already loaded, without
        // clearing first -- used to show a docked ligand pose together
        // with its receptor (see ui/widgets/molstar_viewer_backend.py's
        // load_additional_structure).
        //
        // IT AWAITS THE RECEPTOR LOAD THAT OWNS IT. The generation is read
        // at REQUEST time, not at run time: a pose belongs to the receptor
        // that was current when the caller asked for it. If a newer receptor
        // has been requested by the time this runs, the pose is DROPPED
        // rather than drawn against a structure it was never docked into.
        loadAdditionalStructure: function (structureText, format, label) {
          whenReady(function () {
            var generation = loadGeneration;
            queueLoad(function () {
              if (generation !== loadGeneration) { return; }
              return Promise.resolve(
                viewer.loadStructureFromData(structureText, format, { dataLabel: label })
              );
            });
          });
        },
        clear: function () {
          whenReady(function () {
            // Supersede anything queued. A pose or a receptor still waiting
            // its turn belongs to a scene the caller has just thrown away,
            // so it must not be drawn onto the empty one a moment later.
            //
            // The BODY stays synchronous, deliberately: callers read
            // `searchBoxState()` straight after a clear, and deferring the
            // reset would leave the page briefly describing a box that no
            // longer exists -- the dangling-mirror failure this page has
            // already been caught in once.
            loadGeneration += 1;
            viewer.plugin.clear();
            // Same dangling-ref reset as `loadStructure`. Here the DESIRED
            // state is dropped too: there is no structure left to draw a
            // search region on.
            searchBoxRefs = null;
            searchBoxGeometry = null;
            searchBoxDesired = null;
          });
        },
        // Colours whole residues (see ui/visualization.py's
        // ResidueColorLayer). `residueColors` maps "TYR652" -> "#rrggbb".
        //
        // The selection is a mol-script expression with BARE symbols:
        // (= atom.auth_comp_id TYR), never (= atom.auth_comp_id "TYR").
        // Quoting silently matches ZERO atoms while the transform still
        // commits successfully, which is a genuinely nasty failure mode --
        // it cost a whole round of "the API must be broken" before an
        // interactive probe showed unquoted working and quoted not.
        // auth_* (not label_*) because these residue ids come from
        // pose_analysis reading a PDB, which is author numbering.
        // ONE BUILDER, used by the colouring and by the diagnostic below,
        // so what a test reads is what the viewer paints. Two
        // implementations of "the selection for this residue" is exactly
        // the drift the single discovery layer exists to prevent.
        //
        // A key may be chain-qualified -- "B/TYR652". WITHOUT THE CHAIN THE
        // SELECTION MATCHES EVERY COPY: measured on 6WGT, GLN72 resolves to
        // chains A, B and C, so a pose docked against B coloured all three.
        // The bare form is still accepted and is still right for a
        // single-chain receptor.
        //
        // Values go in UNQUOTED. Quoting matches zero atoms while the
        // overpaint commits successfully -- the silent failure that once
        // made Mol* colouring look unavailable.
        residueSelectionClauses: function (residueColors) {
          var out = {};
          Object.keys(residueColors || {}).forEach(function (residue) {
            var clause = residueClause(residue);
            if (clause) { out[residue] = clause; }
          });
          return out;
        },
        applyResidueColors: function (residueColors) {
          whenReady(function () {
            var plugin = viewer.plugin;
            var ST = molstar.lib.plugin.StateTransforms;
            var hier = plugin.managers.structure.hierarchy.current;
            if (!hier.structures.length) { return; }

            // Group by colour so each distinct colour is one overpaint
            // layer, rather than one layer per residue.
            var byColor = {};
            Object.keys(residueColors || {}).forEach(function (residue) {
              var clause = residueClause(residue);
              if (!clause) { return; }
              var color = residueColors[residue];
              (byColor[color] = byColor[color] || []).push(clause);
            });

            var layers = Object.keys(byColor).map(function (color) {
              var clauses = byColor[color];
              var expression = clauses.length === 1
                ? '(sel.atom.res ' + clauses[0] + ')'
                : '(sel.atom.res (or ' + clauses.join(' ') + '))';
              return {
                script: { language: 'mol-script', expression: expression },
                color: parseInt(color.replace('#', ''), 16),
                clear: false,
              };
            });

            hier.structures.forEach(function (structure) {
              structure.components.forEach(function (component) {
                component.representations.forEach(function (representation) {
                  plugin.build().to(representation.cell.transform.ref).apply(
                    ST.Representation.OverpaintStructureRepresentation3DFromScript,
                    { layers: layers }
                  ).commit();
                });
              });
            });
          });
        },
        clearResidueColors: function () {
          whenReady(function () {
            var plugin = viewer.plugin;
            var refs = [];
            plugin.state.data.cells.forEach(function (cell, ref) {
              if (cell.transform.transformer.id && /overpaint/i.test(cell.transform.transformer.id)) {
                refs.push(ref);
              }
            });
            if (!refs.length) { return; }
            var builder = plugin.build();
            refs.forEach(function (ref) { builder.delete(ref); });
            builder.commit();
          });
        },

        // --- the docking search box ------------------------------------
        //
        // Draws the region Vina will search, so a box in the wrong place is
        // VISIBLE rather than merely reported. The whole bug this exists for
        // was a box 55 A off site that nobody could see.
        //
        // `BoxShape3D` and `ShapeRepresentation3D` are Mol*'s own -- probed
        // against this vendored bundle rather than assumed, since
        // `MolStarViewerBackend` inherits `apply_shapes`' no-op default and
        // this page had never drawn a shape. Its defaults are
        // {bottomLeft:[0,0,0], topRight:[1,1,1], radius:0.15, color:16711680}.
        showSearchBox: function (center, size) {
          searchBoxDesired = { center: center.slice(), size: size.slice() };
          whenReady(applySearchBox);
        },
        clearSearchBox: function () {
          searchBoxDesired = null;
          whenReady(applySearchBox);
        },
        // Reports COMMITTED state, never the last requested value.
        //
        // A `searchBoxState` that echoed its arguments back would hand a
        // test its own input and pass while nothing had been committed --
        // this page's own "queued but never rendered" failure in a new
        // place. `present` is derived from the state tree; the geometry is
        // null when absent, so a cleared box cannot leave stale numbers for
        // a caller to keep reading.
        searchBoxState: function () {
          var present = false;
          if (viewer && searchBoxRefs) {
            var cell = viewer.plugin.state.data.cells.get(searchBoxRefs.representation);
            present = !!(cell && cell.status === 'ok');
          }
          return JSON.stringify(
            present
              ? { present: true, center: searchBoxGeometry.center, size: searchBoxGeometry.size }
              : { present: false, center: null, size: null }
          );
        },

        // Every committed `structure-from-model` transform, so a test can
        // see WHICH structure was retargeted to deposited coordinates and
        // which was left on a biological assembly.
        //
        // Reads the STATE TREE and echoes nothing it was handed -- the rule
        // `searchBoxState` above follows, for the same reason: a probe that
        // returns its own input passes while nothing is committed, which
        // this page has already been caught doing once.
        //
        // ONLY THE TRANSFORM IS REPORTED, DELIBERATELY. The chain set would
        // corroborate it and needs Mol*'s own atomic-hierarchy API, which
        // has NOT been probed against this vendored bundle. This project has
        // twice paid for assuming a viewer's API instead of measuring it --
        // Ketcher's `subscribe` turned out to be a switch accepting two
        // names, and Mol*'s own `structure` load option is accepted and
        // silently ignored. Everything used here is already exercised by
        // `showDepositedCoordinates` a few lines down.
        structureTransforms: function () {
          var out = structureFromModelRefs().map(function (ref) {
            var cell = viewer.plugin.state.data.cells.get(ref);
            return {
              ref: ref,
              type: (cell && cell.transform.params && cell.transform.params.type) || null,
            };
          });
          return JSON.stringify(out);
        },
      };

      // THE VIEWER MUST SHOW THE COORDINATES DOCKING USES.
      //
      // Mol*'s default preset builds BIOLOGICAL ASSEMBLY 1, and that is a
      // different set of atoms from the deposited file this application
      // hands to Vina. Measured on 6WGT (5-HT2A with LSD), which carries
      // three copies of 7LD and a REMARK 350 assembly per chain:
      //
      //     copy      centre                     shown by assembly 1?
      //     A/1201    (24.28,  41.05, 54.36)     yes
      //     B/1201    ( 6.71,   2.21, 54.62)     no   <- what docking boxes
      //     C/1201    (24.01, -37.77, 54.49)     no
      //
      // `binding_site._single_copy` picks B, by burial, for reasons measured
      // on other deposits (3HS4's catalytic zinc is 1.94 A from the right
      // copy and 16.6 A from the wrong one). So the search box was
      // geometrically correct and landed ~43 A from anything on screen --
      // and the interaction colouring, which matches residues by name and
      // number, was painting chain A's residues for a pose computed against
      // chain B's site.
      //
      // THIS IS SCOPED TO THAT INVARIANT and is not a claim that deposited
      // coordinates are the better representation in general: the structure
      // DISPLAYED, the structure the reference site is derived from, and the
      // structure docking runs against must be the same coordinates and the
      // same copy. It is also what this application already defaults to
      // elsewhere -- building an assembly for docking is an explicit opt-in
      // in the Contents dialog, defaulted off, which the viewer was silently
      // contradicting. That opt-in is untouched.
      //
      // IT RETARGETS THE STRUCTURES IT IS GIVEN, AND NOTHING ELSE. It used
      // to walk every `structure-from-model` cell and keep the LAST one,
      // which is a different claim and a wrong one: with a docked pose in
      // the scene the last cell is the POSE, so the ligand was retargeted --
      // a no-op, since a single ligand has no biological assembly -- and the
      // receptor was left on assembly 1. That is the reported defect, and
      // the permissive form could not detect it, because "some cell got
      // retargeted" is true either way.
      //
      // The caller passes the refs its OWN load created (see the diff in
      // `loadStructure`), so ownership is explicit rather than positional.
      // One builder and one commit for the whole set: a builder created
      // before the previous commit resolves operates on a state tree that
      // does not have the earlier change yet, which this page has already
      // measured going wrong for the search box.
      function showDepositedCoordinates(refs) {
        if (!refs || !refs.length) { return; }
        var builder = viewer.plugin.build();
        refs.forEach(function (ref) {
          builder.to(ref).update({ type: { name: 'model', params: {} } });
        });
        return builder.commit();
      }

      // Appearance is the VIEWER's, not the caller's: docking supplies
      // geometry and this page decides how a search region looks. Tuned
      // against a real receptor -- thin enough to read the structure
      // through, bright enough to find.
      var SEARCH_BOX_COLOR = 0x38BDF8;
      var SEARCH_BOX_RADIUS = 0.18;

      // The two cells this page owns. Deleted BY REF rather than by matching
      // transformer ids: `clearResidueColors` can match /overpaint/i safely
      // because overpaint is unambiguous, but a box's representation id is
      // the generic `ms-plugin.shape-representation-3d`, so a regex clear
      // would take any other shape the page ever draws with it.
      var searchBoxRefs = null;
      var searchBoxGeometry = null;

      // LATEST-STATE-WINS, AND IT HAS TO COLLAPSE RATHER THAN QUEUE.
      //
      // The first version issued one `plugin.build()` per call, each
      // deleting the previous refs. Measured against the real bundle, a
      // back-to-back burst of three left THREE boxes on screen while
      // `searchBoxState()` correctly reported one: a builder created before
      // the previous commit resolved is deleting a ref the state tree does
      // not have yet, so the delete silently no-ops and the orphan stays.
      // The mirror was right and the scene was wrong -- which is why the
      // guard for this asserts on the scene.
      //
      // So there is one desired state and one applier. Requests arriving
      // while a commit is in flight update `searchBoxDesired` and return;
      // the applier re-checks when the commit resolves and converges. A
      // burst of any length therefore costs at most two commits and always
      // ends on the newest request.
      var searchBoxDesired = null;   // {center, size} or null for "no box"
      var searchBoxApplying = false;

      function deleteSearchBoxRefs(builder) {
        if (!searchBoxRefs) { return; }
        builder.delete(searchBoxRefs.representation);
        builder.delete(searchBoxRefs.shape);
        searchBoxRefs = null;
        searchBoxGeometry = null;
      }

      function sameGeometry(a, b) {
        if (!a || !b) { return a === b; }
        for (var i = 0; i < 3; i++) {
          if (a.center[i] !== b.center[i] || a.size[i] !== b.size[i]) { return false; }
        }
        return true;
      }

      function applySearchBox() {
        if (searchBoxApplying || !viewer) { return; }
        var target = searchBoxDesired;
        if (sameGeometry(target, searchBoxGeometry)) { return; }

        searchBoxApplying = true;
        var builder = viewer.plugin.build();
        deleteSearchBoxRefs(builder);
        if (target) {
          var T = molstar.lib.plugin.StateTransforms;
          var c = target.center, s = target.size;
          var shape = builder.toRoot().apply(T.Shape.BoxShape3D, {
            bottomLeft: [c[0] - s[0] / 2, c[1] - s[1] / 2, c[2] - s[2] / 2],
            topRight: [c[0] + s[0] / 2, c[1] + s[1] / 2, c[2] + s[2] / 2],
            radius: SEARCH_BOX_RADIUS,
            color: SEARCH_BOX_COLOR,
          });
          var representation = shape.apply(T.Representation.ShapeRepresentation3D);
          searchBoxRefs = { shape: shape.ref, representation: representation.ref };
          searchBoxGeometry = { center: c.slice(), size: s.slice() };
        }
        Promise.resolve(builder.commit()).then(function () {
          searchBoxApplying = false;
          // The request may have moved on while this was committing.
          applySearchBox();
        }, function (error) {
          searchBoxApplying = false;
          console.error('search box commit failed', error);
        });
      }

      molstar.Viewer.create('app', {
        layoutIsExpanded: false,
        layoutShowControls: true,
        layoutShowRemoteState: false,
        layoutShowSequence: true,
        layoutShowLog: false,
        layoutShowLeftPanel: true,

        viewportShowExpand: true,
        viewportShowSelectionMode: false,
        viewportShowAnimation: false,
      }).then(function (createdViewer) {
        viewer = createdViewer;
        pendingCalls.forEach(function (fn) { fn(); });
        pendingCalls = [];

        // Forwards click events to Python — event.current is a Loci
        // (mol-model/loci.d.ts); "empty-loci" means the user clicked on
        // empty space, not a structural element.
        viewer.subscribe(viewer.plugin.behaviors.interaction.click, function (event) {
          // The underlying RxJS BehaviorSubject emits its initial/default
          // value synchronously to a brand-new subscriber (before any real
          // click), so both "no current loci at all" and "empty-loci" must
          // be treated as "nothing was clicked."
          if (bridge && event && event.current && event.current.kind && event.current.kind !== 'empty-loci') {
            bridge.structureClicked(event.current.kind);
          }
        });

        if (bridge) {
          bridge.viewerReady();
        } else {
          // QWebChannel below hasn't finished connecting yet; tell it once
          // it does (see the channel callback further down).
          window.openchemMolstarViewerReadyPending = true;
        }
      });

      if (window.qt && window.qt.webChannelTransport) {
        // eslint-disable-next-line no-undef
        new QWebChannel(window.qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge;
          if (window.openchemMolstarViewerReadyPending) {
            bridge.viewerReady();
            window.openchemMolstarViewerReadyPending = false;
          }
        });
      }
    </script>
  </body>
</html>
