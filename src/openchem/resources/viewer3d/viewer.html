<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenChem Studio - 3D Viewer</title>
    <style>
      html, body, #viewer-container, #grid-container {
        width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      }
      /* The gallery is a SECOND container rather than a reused one:
         createViewerGrid builds its own canvas and cell divs, and tearing
         those out of the single viewer's container each time is more
         fragile than showing one of two. */
      #grid-container { display: none; position: relative; }
      /* One overlay per cell, positioned over the grid's own layout.
         `pointer-events: none` on the box and `auto` on the controls, so
         a drag still reaches the viewer underneath -- otherwise the
         label would swallow the rotation the gallery exists for. */
      .cell-overlay {
        position: absolute; pointer-events: none;
        font: 12px system-ui, sans-serif; color: #222;
        padding: 4px 6px; box-sizing: border-box;
      }
      .cell-overlay label { pointer-events: auto; cursor: pointer;
                            background: rgba(255,255,255,0.82); padding: 1px 5px;
                            border-radius: 3px; }
      .cell-overlay input { pointer-events: auto; vertical-align: -1px; margin-right: 4px; }
      /* The selected cell is the one `<` `>` and "Use in 2D Editor" act
         on, so it has to be visible without hovering. */
      .cell-frame { position: absolute; pointer-events: none;
                    border: 2px solid transparent; box-sizing: border-box; }
      .cell-frame.selected { border-color: #1976d2; }
    </style>
    <script src="3Dmol-min.js"></script>
  </head>
  <body>
    <div id="viewer-container"></div>
    <div id="grid-container"></div>
    <!--
      qwebchannel.js is served from Qt's own qrc:// resource scheme and only
      resolves when this page is loaded inside a QWebEngineView that has
      QWebEnginePage.setWebChannel() called on it (see
      ui/widgets/mol3d_viewer_backend.py). It has no effect, and does not
      need to load successfully, in a plain browser.
    -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      // 3Dmol.js's UMD build exports a global literally named "3Dmol", which
      // is not a valid bare identifier (can't start with a digit) -- alias
      // it through window[] the way 3Dmol.js's own examples do.
      var $3Dmol = window['3Dmol'];
      var viewer = $3Dmol.createViewer(document.getElementById('viewer-container'), {
        backgroundColor: 'white',
      });
      var currentStyle = 'stick';
      var bridge = null;
      // atom index (string, since JS object keys are always strings) ->
      // hex color, or null when no visualization layer is active.
      var currentVisualization = null;
      // Spatial annotations (dipole arrow, steric cone, principal axes)
      // for the CURRENT molecule. Same lifecycle as currentVisualization:
      // a new molblock starts clean, because shape coordinates are in one
      // conformer's frame and mean nothing on another's.
      var currentShapes = null;
      // atom index (string) -> formatted value text, or null (Phase 18).
      var currentLabels = null;
      // The active GLModel, needed to look up each atom's 3D position
      // when placing labels -- not otherwise kept around before Phase 18.
      var currentModel = null;
      // Phase 25b: the active molecular surface, or null. Held as state
      // (like currentVisualization/currentLabels) rather than applied
      // once, because viewer.clear() in loadMolblock destroys surfaces --
      // so a surface has to be re-added after every structure load.
      // { representation: 'vdw'|'sas'|'ms'|'ses', opacity: number,
      //   atomColors: {atomIndex: '#rrggbb'} | null }
      var currentSurface = null;
      // Ensemble overlay (3D alignment): an array of hex colours, one per
      // loaded model, or null in the normal single-molecule mode. Held as
      // state for the same reason as the above -- a style change has to
      // re-apply per-model colouring, not flatten it.
      var currentEnsemble = null;
      // Whether a unit cell is currently on screen. Gates the
      // camera re-fit on resize; see the resize listener.
      var crystalShown = false;

      // Confirmed live against this exact vendored bundle:
      // $3Dmol.SurfaceType === {VDW:1, MS:2, SAS:3, SES:4}. SES is real
      // here even though Marvin doesn't offer it.
      function surfaceTypeFor(representation) {
        switch (String(representation).toLowerCase()) {
          case 'sas':
            return $3Dmol.SurfaceType.SAS;
          case 'ms':
            return $3Dmol.SurfaceType.MS;
          case 'ses':
            return $3Dmol.SurfaceType.SES;
          case 'vdw':
          default:
            return $3Dmol.SurfaceType.VDW;
        }
      }

      function applySurface() {
        // Always clear first. Confirmed live that this is safe even though
        // addSurface returns a PROMISE: viewer.surfaces is populated
        // synchronously, and removeAllSurfaces() called before an earlier
        // promise resolves still leaves a count of 0 afterwards -- so a
        // rapid re-apply cannot orphan a half-built surface.
        viewer.removeAllSurfaces();
        if (!currentSurface) {
          viewer.render();
          return;
        }
        var atomColors = currentSurface.atomColors;
        var style = { opacity: currentSurface.opacity };
        var field = currentSurface.scalarField;
        if (field) {
          // A volumetric field beats per-atom colours because it is a
          // genuinely different thing, not a refinement of them: it is
          // defined everywhere, so the surface varies BETWEEN atoms
          // rather than stepping from one nearest-atom colour to the
          // next. Verified live that the vertices really do follow it --
          // 94 distinct colours over 302 vertices on acetic acid, and
          // correlating each rendered vertex colour against the supplied
          // potential at its own position gives r = -0.95 (negative
          // because RWB puts red at the LOW end), with no vertex
          // coloured with the wrong sign.
          style.voldata = new $3Dmol.VolumeData(field.dx, 'dx');
          style.volscheme = new $3Dmol.Gradient.RWB(field.low, field.high);
        } else if (atomColors) {
          // colorfunc is invoked once per atom (confirmed: 9 calls for a
          // 9-atom ethanol), and surface vertices take the colour of the
          // nearest atom -- which is what maps a per-atom property like
          // partial charge onto the surface the way Marvin shows it.
          style.colorfunc = function (atom) {
            var color = atomColors[String(atom.index)];
            return color || '#cccccc';
          };
        }
        viewer.addSurface(surfaceTypeFor(currentSurface.representation), style);
        viewer.render();
      }

      function styleSpecFor(name) {
        switch (name) {
          case 'sphere':
            return { sphere: {} };
          case 'line':
            return { line: {} };
          case 'ballstick':
            return { stick: { radius: 0.15 }, sphere: { scale: 0.25 } };
          case 'stick':
          default:
            return { stick: {} };
        }
      }

      function styleSpecWithColor(name, color) {
        // Shallow-clone each shape key of the base spec and add a color
        // override -- structuredClone isn't available in every WebEngine
        // Chromium version this app might run against, and the base spec
        // is only ever one level deep (e.g. { stick: {...} }), so a
        // manual per-key copy is simpler than depending on it.
        var base = styleSpecFor(name);
        var colored = {};
        Object.keys(base).forEach(function (shapeKey) {
          colored[shapeKey] = Object.assign({}, base[shapeKey], { color: color });
        });
        return colored;
      }

      function applyStyle() {
        // Ensemble mode colours BY MODEL rather than by atom: an overlay
        // of several molecules is read by telling them apart, so each
        // model keeps its own colour through every style change. A single
        // global setStyle({}) would flatten them all to one colour the
        // moment the user switched from stick to ball-and-stick.
        if (currentEnsemble) {
          currentEnsemble.forEach(function (color, modelIndex) {
            viewer.setStyle({ model: modelIndex }, styleSpecWithColor(currentStyle, color));
          });
          viewer.render();
          return;
        }
        viewer.setStyle({}, styleSpecFor(currentStyle));
        if (currentVisualization) {
          Object.keys(currentVisualization).forEach(function (atomIndexStr) {
            var atomIndex = parseInt(atomIndexStr, 10);
            var color = currentVisualization[atomIndexStr];
            viewer.setStyle({ index: atomIndex }, styleSpecWithColor(currentStyle, color));
          });
        }
        viewer.render();
      }

      // Phase 18: numeric per-atom labels alongside the existing color
      // layer -- a separate step from applyStyle() since labels are
      // positioned overlays (viewer.addLabel), not a per-atom style
      // property like color is.
      function applyLabels() {
        viewer.removeAllLabels();
        if (!currentLabels || !currentModel) {
          return;
        }
        Object.keys(currentLabels).forEach(function (atomIndexStr) {
          var atomIndex = parseInt(atomIndexStr, 10);
          var atoms = currentModel.selectedAtoms({ index: atomIndex });
          if (atoms.length === 0) {
            return;
          }
          var atom = atoms[0];
          viewer.addLabel(currentLabels[atomIndexStr], {
            position: { x: atom.x, y: atom.y, z: atom.z },
            fontSize: 10,
            showBackground: false,
          });
        });
        viewer.render();
      }

      // ---- Spatial annotations: arrow, cone, axes -------------------
      //
      // DISPLAY SCALING ONLY. The arrow's vector is a physical quantity
      // in its own units (Debye for a dipole) -- its magnitude is NEVER
      // read as Angstrom. The drawn length is
      // ARROW_SPAN_FRACTION * (longest interatomic span), floored at
      // MIN_ARROW_LENGTH so a diatomic still shows a legible arrow, with
      // the arrow's midpoint on the annotation's anchor. Cone and axes
      // coordinates ARE Angstrom and draw at true scale.
      var ARROW_SPAN_FRACTION = 0.5;
      var MIN_ARROW_LENGTH = 1.0;
      // Fixed conventions so tests and screenshots cannot drift:
      // 16 generatrices, a closed 32-segment base circle, no filled
      // surface (lines do not occlude the molecule).
      var CONE_GENERATRICES = 16;
      var CONE_CIRCLE_SEGMENTS = 32;
      var AXIS_COLORS = ['#c62828', '#2e7d32', '#1565c0'];
      // The geometry actually handed to 3Dmol, mirrored for tests: the
      // direction oracle must read what was DRAWN, not what was declared
      // -- a producer sign bug and a renderer sign bug would cancel in
      // any annotation-level check. Reset on every drawShapes().
      var drawnShapes = [];

      function longestSpan() {
        if (!currentModel) return 0;
        var atoms = currentModel.selectedAtoms({});
        var best = 0;
        for (var i = 0; i < atoms.length; i++) {
          for (var j = i + 1; j < atoms.length; j++) {
            var dx = atoms[i].x - atoms[j].x;
            var dy = atoms[i].y - atoms[j].y;
            var dz = atoms[i].z - atoms[j].z;
            var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (d > best) best = d;
          }
        }
        return best;
      }

      function finiteVec(v) {
        return Array.isArray(v) && v.length === 3 && v.every(function (x) {
          return typeof x === 'number' && isFinite(x);
        });
      }

      function unitVec(v) {
        var n = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
        return n > 0 ? [v[0] / n, v[1] / n, v[2] / n] : null;
      }

      function shapeLabel(text, position) {
        viewer.addLabel(text, {
          position: { x: position[0], y: position[1], z: position[2] },
          fontSize: 12,
          backgroundOpacity: 0.55,
        });
      }

      function drawArrowShape(shape) {
        var direction = unitVec(shape.vector);
        if (!direction || !finiteVec(shape.anchor)) return;
        var length = Math.max(MIN_ARROW_LENGTH, ARROW_SPAN_FRACTION * longestSpan());
        var half = length / 2;
        var start = [shape.anchor[0] - direction[0] * half,
                     shape.anchor[1] - direction[1] * half,
                     shape.anchor[2] - direction[2] * half];
        var end = [shape.anchor[0] + direction[0] * half,
                   shape.anchor[1] + direction[1] * half,
                   shape.anchor[2] + direction[2] * half];
        viewer.addArrow({
          start: { x: start[0], y: start[1], z: start[2] },
          end: { x: end[0], y: end[1], z: end[2] },
          radius: 0.12,
          radiusRatio: 2.2,
          mid: 0.82,
          color: '#e6a817',
        });
        drawnShapes.push({ kind: 'arrow', start: start, end: end, label: shape.label });
        if (shape.label) shapeLabel(shape.label, end);
      }

      function perpendicularPair(axis) {
        var seed = Math.abs(axis[2]) < 0.9 ? [0, 0, 1] : [0, 1, 0];
        var first = unitVec([
          seed[1] * axis[2] - seed[2] * axis[1],
          seed[2] * axis[0] - seed[0] * axis[2],
          seed[0] * axis[1] - seed[1] * axis[0],
        ]);
        var second = [
          axis[1] * first[2] - axis[2] * first[1],
          axis[2] * first[0] - axis[0] * first[2],
          axis[0] * first[1] - axis[1] * first[0],
        ];
        return [first, second];
      }

      function drawConeShape(shape) {
        var axis = unitVec(shape.axis);
        if (!axis || !finiteVec(shape.apex) || !(shape.length > 0)) return;
        var half = shape.half_angle_deg * Math.PI / 180;
        // `length` is the SLANT reach the sweep measured (apex to the far
        // vdW edge), so generatrices have that length and the base circle
        // sits at length*cos(half) with radius length*sin(half) -- valid
        // for half-angles past 90 too, where cos goes negative and the
        // cone legitimately opens behind the apex plane (P(tBu)3 is 91).
        var perpendiculars = perpendicularPair(axis);
        var p1 = perpendiculars[0], p2 = perpendiculars[1];
        var apex = shape.apex;
        function rim(theta) {
          var s = Math.sin(half), c = Math.cos(half);
          var dir = [
            axis[0] * c + (p1[0] * Math.cos(theta) + p2[0] * Math.sin(theta)) * s,
            axis[1] * c + (p1[1] * Math.cos(theta) + p2[1] * Math.sin(theta)) * s,
            axis[2] * c + (p1[2] * Math.cos(theta) + p2[2] * Math.sin(theta)) * s,
          ];
          return [apex[0] + dir[0] * shape.length,
                  apex[1] + dir[1] * shape.length,
                  apex[2] + dir[2] * shape.length];
        }
        for (var g = 0; g < CONE_GENERATRICES; g++) {
          var point = rim(2 * Math.PI * g / CONE_GENERATRICES);
          viewer.addLine({
            start: { x: apex[0], y: apex[1], z: apex[2] },
            end: { x: point[0], y: point[1], z: point[2] },
            color: '#00838f',
          });
          drawnShapes.push({ kind: 'cone-generatrix', start: apex, end: point });
        }
        var previous = rim(0);
        for (var sgm = 1; sgm <= CONE_CIRCLE_SEGMENTS; sgm++) {
          var next = rim(2 * Math.PI * sgm / CONE_CIRCLE_SEGMENTS);
          viewer.addLine({
            start: { x: previous[0], y: previous[1], z: previous[2] },
            end: { x: next[0], y: next[1], z: next[2] },
            color: '#00838f',
          });
          drawnShapes.push({ kind: 'cone-circle', start: previous, end: next });
          previous = next;
        }
        if (shape.label) shapeLabel(shape.label, [apex[0], apex[1], apex[2]]);
      }

      function drawAxesShape(shape) {
        if (!finiteVec(shape.origin)) return;
        for (var i = 0; i < 3; i++) {
          var direction = unitVec(shape.axes[i]);
          if (!direction) continue;
          // Drawn THROUGH the molecule at the measured half-span, floored
          // so a planar molecule's flat axis is still visible.
          var extent = Math.max(shape.extents[i], 0.5);
          var start = [shape.origin[0] - direction[0] * extent,
                       shape.origin[1] - direction[1] * extent,
                       shape.origin[2] - direction[2] * extent];
          var end = [shape.origin[0] + direction[0] * extent,
                     shape.origin[1] + direction[1] * extent,
                     shape.origin[2] + direction[2] * extent];
          viewer.addArrow({
            start: { x: start[0], y: start[1], z: start[2] },
            end: { x: end[0], y: end[1], z: end[2] },
            radius: 0.07,
            radiusRatio: 2.5,
            mid: 0.9,
            color: AXIS_COLORS[i],
          });
          drawnShapes.push({ kind: 'axis', index: i, start: start, end: end });
          if (shape.labels && shape.labels[i]) shapeLabel(shape.labels[i], end);
        }
      }

      function drawShapes() {
        viewer.removeAllShapes();
        drawnShapes = [];
        if (!currentShapes) { viewer.render(); return; }
        currentShapes.forEach(function (shape) {
          // Defensive only -- Python validated before sending. A shape
          // that still arrives malformed is SKIPPED with a log line,
          // never repaired: a picture built from guessed geometry reads
          // as a result.
          try {
            if (shape.kind === 'arrow') drawArrowShape(shape);
            else if (shape.kind === 'cone') drawConeShape(shape);
            else if (shape.kind === 'axes') drawAxesShape(shape);
            else console.warn('unknown spatial annotation kind', shape.kind);
          } catch (error) {
            console.warn('skipped a spatial annotation', error);
          }
        });
        viewer.render();
      }

      // Run `fn` once the container has a plausible size, resizing the
      // viewer first. Every draw path needs this, and each learned it
      // separately -- the crystal path the hard way, over five cold
      // launches.
      //
      // This view lives in a tab. Qt makes a tab current asynchronously,
      // so a draw issued right after the switch runs against a container
      // that is still 0x0, and 3Dmol reads its canvas dimensions from the
      // container at draw time. Both failure modes were seen live:
      // without resize() a whole unit cell rendered into a 40px corner
      // (3Dmol kept a stale size), and WITH resize() it vanished, because
      // resize() faithfully committed the zero.
      //
      // **setTimeout, NOT requestAnimationFrame.** rAF is suspended for
      // content the browser considers not visible, so when the first
      // synchronous attempt finds a 0x0 container the callback can simply
      // never fire and nothing is ever drawn. Measured over five cold
      // launches of the crystal path: 3 drew, 2 drew nothing, and every
      // drawing run produced an IDENTICAL image -- deterministic
      // rendering, nondeterministic scheduling, which is the signature of
      // a suspended callback rather than a race in the drawing code.
      //
      // **Wait for a PLAUSIBLE size, not merely a non-zero one.** A 40px
      // container is non-zero and still wrong; one run in five drew the
      // whole cell at a 44-pixel scale because the old check accepted any
      // non-zero width. After a bounded wait it falls through and draws
      // anyway, so a genuinely small panel still gets a picture.
      //
      // **Threading the widget's expected width through and waiting for
      // the container to match it was tried and blanked the view** -- the
      // container's CSS width never equals the Qt widget's, so the wait
      // always timed out.
      function drawWhenSized(fn) {
        var attempts = 0;
        function attempt() {
          var host = document.getElementById('viewer-container');
          var big = host.clientWidth >= 200 && host.clientHeight >= 150;
          if (!big && attempts < 60) {
            attempts += 1;
            window.setTimeout(attempt, 25);
            return;
          }
          viewer.resize();
          fn();
        }
        attempt();
      }

      // Exposed for Python's fire-and-forget runJavaScript calls (see
      // ui/widgets/mol3d_viewer_backend.py). None of these need a return
      // value round-tripped back to Python, unlike Ketcher's getMolfile(),
      // so no QWebChannel request/response dance is needed here.
      window.openchemViewer = {
        // `keepCamera` is what makes conformers comparable. Stepping from
        // one conformer to the next re-fitted the camera every time, so
        // the molecule appeared to jump and the only thing a reader could
        // compare was two unrelated views. Reported as: "I arranged the
        // first conformer in 1 row, then in the second conformer I moved
        // it a certain way, then moved back to the first conformer, and it
        // was once again in a different way."
        //
        // The caller decides, because only Python knows whether this is
        // the same molecule and the same conformer batch -- see
        // `Mol3DViewerBackend.load_conformer`. Captured BEFORE clear(),
        // which resets the view.
        loadMolblock: function (molblock, keepCamera) {
          var savedView = keepCamera ? viewer.getView() : null;
          crystalShown = false;
          viewer.clear();
          // A new molecule's atom indices have nothing to do with
          // whatever the previous molecule's visualization layer meant --
          // stale coloring/labels must not carry over.
          currentVisualization = null;
          currentLabels = null;
          // Shape coordinates belong to the OLD conformer's frame -- an
          // arrow kept across a load would sit plausibly on the wrong
          // molecule, which is worse than no arrow.
          currentShapes = null;
          viewer.removeAllShapes();
          // The test mirror follows the real state, or it reports shapes
          // that are no longer on screen.
          drawnShapes = [];
          // Leaving ensemble mode. Without this the single molecule about
          // to load would be styled with the ensemble's per-model colour
          // list, and every model index past 0 would silently match
          // nothing.
          currentEnsemble = null;
          var model = viewer.addModel(molblock, 'mol');
          currentModel = model;
          applyStyle();
          applyLabels();
          // viewer.clear() above destroyed any active surface, and the
          // per-atom colours belonged to the OLD molecule's atom indices
          // anyway -- same staleness reason currentVisualization is
          // dropped. Re-add the surface shape (representation/opacity) if
          // one was active, but without carrying stale colours over. The
          // scalar field goes for a stronger reason than the colours do:
          // it is a grid pinned to the OLD molecule's coordinates, so
          // keeping it would drape one molecule's potential over
          // another's shape.
          if (currentSurface) {
            currentSurface = {
              representation: currentSurface.representation,
              opacity: currentSurface.opacity,
              atomColors: null,
              scalarField: null,
            };
            applySurface();
          }
          model.setClickable({}, true, function (atom) {
            if (bridge) {
              bridge.atomClicked(atom.index);
            }
          });
          // Only the camera and the draw wait for a size; the model is
          // built synchronously above so a setStyle arriving in between
          // cannot act on a half-loaded viewer.
          drawWhenSized(function () {
            if (savedView) {
              viewer.setView(savedView);
            } else {
              viewer.zoomTo();
            }
            viewer.render();
          });
        },
        // 3D alignment: several structures superimposed in ONE coordinate
        // frame, each its own model so it keeps its own colour. Distinct
        // from loadMolblock's single model, and from the macromolecule
        // path, which is a different viewer backend entirely.
        loadEnsemble: function (entries) {
          crystalShown = false;
          viewer.clear();
          currentVisualization = null;
          currentLabels = null;
          currentSurface = null;
          currentEnsemble = entries.map(function (entry) {
            return entry.color;
          });
          entries.forEach(function (entry) {
            viewer.addModel(entry.molblock, 'mol');
          });
          // currentModel drives label placement by atom index, which is
          // meaningless across several models -- an index means a
          // different atom in each. Left null so applyLabels no-ops
          // rather than labelling the wrong atoms.
          currentModel = null;
          applyStyle();
          drawWhenSized(function () {
            viewer.zoomTo();
            viewer.render();
          });
        },
        setStyle: function (styleName) {
          currentStyle = styleName;
          applyStyle();
        },
        applyShapes: function (shapes) {
          currentShapes = shapes && shapes.length ? shapes : null;
          drawShapes();
        },
        clearShapes: function () {
          currentShapes = null;
          drawShapes();
        },
        applyVisualization: function (atomColors, atomLabels) {
          currentVisualization = atomColors;
          currentLabels = atomLabels || null;
          applyStyle();
          applyLabels();
          // A surface showing per-atom colours must follow the layer it is
          // showing -- otherwise changing the property would recolour the
          // sticks and leave the surface painted with the previous one.
          if (currentSurface && currentSurface.atomColors) {
            currentSurface.atomColors = atomColors;
            applySurface();
          }
        },
        clearVisualization: function () {
          currentVisualization = null;
          currentLabels = null;
          applyStyle();
          viewer.removeAllLabels();
          if (currentSurface && currentSurface.atomColors) {
            currentSurface.atomColors = null;
            applySurface();
          }
          viewer.render();
        },
        // Phase 25b. `representation` is 'vdw'|'sas'|'ms'|'ses';
        // `atomColors` may be null for a plain uncoloured surface.
        // `scalarField` (Phase 25b follow-on) is {dx, low, high} -- OpenDX
        // text plus the colour range, and takes precedence over
        // `atomColors` when both are given.
        applySurface: function (representation, opacity, atomColors, scalarField) {
          currentSurface = {
            representation: representation,
            opacity: opacity,
            atomColors: atomColors || null,
            scalarField: scalarField || null,
          };
          applySurface();
        },
        clearSurface: function () {
          currentSurface = null;
          applySurface();
        },
        // A periodic solid: one unit cell, already expanded and wrapped
        // by the Python side.
        //
        // It does NOT go through addModel(cif, 'cif'). 3Dmol can parse a
        // CIF and apply its symmetry, but it leaves the results wherever
        // the operators put them -- measured on halite, 3 of the 4
        // chlorides landed at or outside the cell. The right set of
        // atoms, the wrong representatives, and a picture that is not the
        // conventional cell. So the atoms arrive here already correct and
        // this draws exactly what it is given.
        //
        // XYZ, not a molblock, because a unit cell has no bonds and a
        // molblock would have to invent a bond table.
        loadCrystal: function (scene) {
          // The whole build is deferred, not merely the camera: a unit
          // cell's shapes are laid out against the viewer's dimensions.
          // See `_import_crystal` for the deferral that pairs with this.
          drawWhenSized(function () {
            drawCrystal(scene);
          });
        },
        clear: function () {
          crystalShown = false;
          currentVisualization = null;
          currentLabels = null;
          currentModel = null;
          currentSurface = null;
          viewer.clear();
          viewer.removeAllShapes();
          viewer.removeAllLabels();
          viewer.render();
        },

        // --- the conformer gallery -------------------------------------
        //
        // "all separate images possible... you could check several ones to
        // be visible at a time if wanted, and on the screen at the same
        // time, yet independently rotatable."
        //
        // ONE WebGL CONTEXT FOR THE WHOLE GRID, which is the property that
        // makes this affordable: measured, `document.querySelectorAll
        // ('canvas').length` stays at 2 (the single viewer plus the grid)
        // whether the grid is 2x2 or 10x10. A QWebEngineView per conformer
        // would instead be a Chromium helper set per conformer, and
        // CLAUDE.md records those accumulating into a 40-minute hang.
        //
        // Build cost is linear and small -- 4 cells 91 ms, 12 cells 175 ms,
        // 100 cells 1481 ms -- and REDRAW is free, 1 ms at 12 cells and
        // 5 ms at 100. So the ceiling is legibility, not performance:
        // 100 cells in a 1000x700 pane is 100x70 px each, which nobody can
        // compare shapes in.
        // **BUILT ONLY ONCE THE CONTAINER HAS A SIZE**, which is not the
        // same moment as being made visible. Setting `display: block` does
        // not reflow within the same synchronous script, so
        // `createViewerGrid` called straight afterwards builds into a
        // 0x0 box and returns cells that never draw: measured under
        // pytest as `clientWidth 0`, then zero overlays and an empty
        // `gridViews()`, while the identical sequence in a standalone
        // script happened to work. Same trap `drawWhenSized` exists for.
        loadGrid: function (entries, rows, cols, linked, selected) {
          gridEntries = entries;
          gridSelectedCell = 0;
          document.getElementById('viewer-container').style.display = 'none';
          gridContainer.style.display = 'block';
          whenGridSized(function () {
            // **A GALLERY NEEDS A SECOND WebGL CONTEXT, and not every
            // environment grants one.** Measured: under Qt's `offscreen`
            // platform the page's first context works and a second one
            // comes back null, so `createViewerGrid` throws
            // "Cannot read properties of null (reading 'clearDepth')" --
            // and releasing the first context does not help. Software
            // rendering and remote sessions can behave the same way.
            // Unhandled that is an empty pane, which reads as the feature
            // being broken rather than unavailable; reported instead, so
            // the widget can go back to the single view and say why.
            try {
              buildGrid(rows, cols, linked);
            } catch (e) {
              gridCells = [];
              gridContainer.style.display = 'none';
              document.getElementById('viewer-container').style.display = 'block';
              viewer.resize();
              viewer.render();
              if (bridge) bridge.gridFailed(String(e && e.message ? e.message : e));
              return;
            }
            entries.forEach(function (entry, index) {
              var cell = gridCells[index];
              if (!cell) return;
              cell.addModel(entry.molblock, 'mol');
              cell.setStyle({}, styleSpecFor(currentStyle));
              cell.zoomTo();
              cell.render();
            });
            gridShape = [rows, cols];
            gridSelectedIndices = selected || [];
            drawOverlays(rows, cols, gridSelectedIndices);
          });
        },

        // Copy one cell's camera to every other. NOT the same as locking:
        // this is "everybody look at it from here, now let me turn them
        // separately again", which is the move a comparison actually
        // needs. Locking keeps them tied together afterwards.
        matchGridViews: function (index) {
          if (!gridCells.length) return;
          var source = gridCells[index] || gridCells[0];
          var view = source.getView();
          gridCells.forEach(function (cell) {
            if (cell === source) return;
            cell.setView(view);
            cell.render();
          });
        },

        selectGridCell: function (index) {
          gridSelectedCell = index;
          markSelectedCell();
        },

        // **THE CAMERA THE USER IS ACTUALLY LOOKING THROUGH.**
        //
        // Not simply `viewer.getView()`: in gallery mode the single
        // viewer is hidden and unrotated, while the cell the user turned
        // has its own camera. Reading the wrong one bakes NO rotation
        // into the adopted drawing, which is exactly how this was
        // reported -- "it is again not actually 3d, it is just again the
        // absolute, 2d structure". Measured at the time: the cell pointed
        // (0, 0.537, 0, 0.843) and the single viewer returned the
        // identity.
        currentView: function () {
          var source = gridCells.length ? gridCells[gridSelectedCell] : viewer;
          if (!source) return '';
          return JSON.stringify(source.getView());
        },

        // Every cell's camera, as JSON. The only way to ask whether the
        // cells are pointing the same way -- which is what "Lock views"
        // has to mean, and what a test asserting merely that they all
        // MOVED would not establish.
        gridViews: function () {
          return JSON.stringify(gridCells.map(function (cell) {
            return cell.getView().map(function (n) { return Math.round(n * 1e4) / 1e4; });
          }));
        },

        // Test and diagnostic seam: turn one cell, the way a drag would.
        // Production rotates by dragging, which no script can do.
        rotateGridCell: function (index, degrees, axis) {
          var cell = gridCells[index];
          if (!cell) return;
          cell.rotate(degrees, axis);
          cell.render();
        },

        leaveGrid: function () {
          gridContainer.style.display = 'none';
          document.getElementById('viewer-container').style.display = 'block';
          gridCells = [];
          gridEntries = [];
          gridShape = null;
          gridSelectedIndices = [];
          clearOverlays();
          viewer.resize();
          viewer.render();
        },
      };

      var gridContainer = document.getElementById('grid-container');
      var gridCells = [];
      var gridEntries = [];
      var gridSelectedCell = 0;
      var gridOverlays = [];
      // The layout the gallery was built with, so a resize can redraw
      // the overlays over the same cells.
      var gridShape = null;
      var gridSelectedIndices = [];

      // `drawWhenSized` for the gallery's container. Separate rather than
      // parameterised because the two wait on different elements and the
      // single viewer's version also calls `viewer.resize()`, which would
      // be wrong here -- the grid owns its own canvas.
      function whenGridSized(fn) {
        // **WAITS FOR THE SIZE TO SETTLE, not merely to be non-zero.**
        // `createViewerGrid` fixes each cell's canvas at build time and
        // does not re-fit, so building while the pane is still growing
        // leaves the gallery drawn into the top half of it -- seen in the
        // running app, six cells crammed into 360 px of a 680 px pane.
        // A size repeated across two frames is laid out; one that is
        // merely big enough may still be on its way.
        var attempts = 0;
        var last = -1;
        function attempt() {
          var height = gridContainer.clientHeight;
          var big = gridContainer.clientWidth >= 200 && height >= 150;
          var settled = big && height === last;
          last = height;
          if (!settled && attempts < 60) {
            attempts += 1;
            window.setTimeout(attempt, 25);
            return;
          }
          fn();
        }
        attempt();
      }

      // Keep the gallery in step with the window, for the same reason:
      // the cells' canvases are fixed at build time, so without this a
      // resized window leaves them the old size with the overlays --
      // which ARE recomputed -- no longer over them.
      function resizeGrid() {
        if (!gridCells.length) return;
        gridCells.forEach(function (cell) {
          cell.resize();
          cell.render();
        });
        if (gridShape) drawOverlays(gridShape[0], gridShape[1], gridSelectedIndices);
      }

      function buildGrid(rows, cols, linked) {
        gridContainer.innerHTML = '';
        gridCells = [];
        // **`control_all` IS NOT THE LOCK, and looked like it.** It ties
        // mouse INPUT together and does nothing for a view changed any
        // other way -- measured: with `control_all: true`, turning one
        // cell programmatically left the others at the identity, so the
        // cells pointed two different ways.
        //
        // `linkViewer` propagates a view change however it was made.
        // Linked in BOTH directions for every pair, so any cell can be
        // the one you drag; measured on four cells, no loop and no
        // measurable cost. There is no unlink, which is why the lock is a
        // rebuild rather than a toggle -- 175 ms at 12 cells.
        var grid = $3Dmol.createViewerGrid(
          gridContainer,
          { rows: rows, cols: cols, control_all: false },
          { backgroundColor: 'white' }
        );
        for (var r = 0; r < grid.length; r++) {
          for (var c = 0; c < grid[r].length; c++) {
            gridCells.push(grid[r][c]);
          }
        }
        if (linked) {
          gridCells.forEach(function (cell) {
            gridCells.forEach(function (other) {
              if (cell !== other) cell.linkViewer(other);
            });
          });
        }
      }

      function clearOverlays() {
        gridOverlays.forEach(function (node) { node.remove(); });
        gridOverlays = [];
      }

      function drawOverlays(rows, cols, selected) {
        clearOverlays();
        var width = gridContainer.clientWidth / cols;
        var height = gridContainer.clientHeight / rows;
        gridEntries.forEach(function (entry, index) {
          var row = Math.floor(index / cols);
          var col = index % cols;
          if (row >= rows) return;

          var frame = document.createElement('div');
          frame.className = 'cell-frame';
          frame.dataset.index = index;
          position(frame, col * width, row * height, width, height);
          gridContainer.appendChild(frame);
          gridOverlays.push(frame);

          var box = document.createElement('div');
          box.className = 'cell-overlay';
          position(box, col * width, row * height, width, 26);
          var label = document.createElement('label');
          var tick = document.createElement('input');
          tick.type = 'checkbox';
          tick.checked = selected.indexOf(index) >= 0;
          tick.addEventListener('change', function () {
            if (bridge) bridge.gridCellToggled(index, tick.checked);
          });
          label.appendChild(tick);
          label.appendChild(document.createTextNode(entry.label || ''));
          // Clicking the label selects the cell as well as ticking it --
          // the two gestures are different and both are wanted, so the
          // tick reports separately above.
          label.addEventListener('click', function () {
            gridSelectedCell = index;
            markSelectedCell();
            if (bridge) bridge.gridCellClicked(index);
          });
          box.appendChild(label);
          gridContainer.appendChild(box);
          gridOverlays.push(box);
        });
        markSelectedCell();
      }

      function position(node, left, top, width, height) {
        node.style.left = left + 'px';
        node.style.top = top + 'px';
        node.style.width = width + 'px';
        node.style.height = height + 'px';
      }

      function markSelectedCell() {
        gridOverlays.forEach(function (node) {
          if (node.className.indexOf('cell-frame') !== 0) return;
          var mine = Number(node.dataset.index) === gridSelectedCell;
          node.className = mine ? 'cell-frame selected' : 'cell-frame';
        });
      }

      // The crystal draw itself, split out so loadCrystal can retry it on
      // the next frame while the container is still being laid out.
      function drawCrystal(scene) {
          crystalShown = true;
          viewer.clear();
          viewer.removeAllShapes();
          viewer.removeAllLabels();
          currentVisualization = null;
          currentLabels = null;
          currentShapes = null;
          currentEnsemble = null;
          currentSurface = null;

          var model = viewer.addModel(scene.xyz, 'xyz');
          currentModel = model;
          // Spheres only. Sticks would draw 3Dmol's guessed bonds, and
          // guessing bonds across a lattice is the one thing this whole
          // path exists to avoid -- an Na-Cl contact is not a bond.
          viewer.setStyle({}, { sphere: { scale: 0.35 } });

          scene.edges.forEach(function (edge) {
            viewer.addLine({
              start: { x: edge[0][0], y: edge[0][1], z: edge[0][2] },
              end: { x: edge[1][0], y: edge[1][1], z: edge[1][2] },
              color: 'grey',
              dashed: false,
            });
          });
          scene.axes.forEach(function (axis) {
            viewer.addLabel(axis.label, {
              position: { x: axis.vector[0], y: axis.vector[1], z: axis.vector[2] },
              fontSize: 12,
              backgroundOpacity: 0.0,
              fontColor: 'black',
            });
          });

          model.setClickable({}, true, function (atom) {
            if (bridge) {
              bridge.atomClicked(atom.index);
            }
          });
          // **zoomTo() fits with a wide margin; 1.25 fills the panel.**
          //
          // Measured, not guessed. Five cold launches per factor, scoring
          // the drawn pixels in the viewer region:
          //
          //     plain zoomTo()   1411 ink   5/5   nothing clipped
          //     zoom(1.25)       2124 ink   5/5   nothing clipped
          //     zoom(1.6)        3069 ink   5/5   CLIPS the cell box
          //
          // Every factor was reproducible to the pixel once the scheduling
          // bug above was fixed. Before that fix the same measurements
          // came back blank about 40% of the time, which is why an earlier
          // pass concluded -- wrongly -- that a zoom multiplier "blanks the
          // view". It never did; the sampling was noise.
          viewer.zoomTo();
          viewer.zoom(1.25);
          viewer.render();
      }

      // **The page is laid out before Qt has finished sizing the view.**
      //
      // This viewer lives in a tab. When the tab becomes current Qt
      // resizes the QWebEngineView, and that reaches the page
      // asynchronously -- so a structure drawn immediately after a tab
      // switch is fitted to whatever size the page happened to have,
      // which was measured live at about 40px. 3Dmol caches its canvas
      // dimensions, so it never recovers on its own.
      //
      // Correcting on the page's own resize event fixes it whenever the
      // real size arrives, however late, and fixes the ordinary case of
      // the user resizing the window too. Cheap: 3Dmol's resize() is a
      // no-op when the dimensions have not changed.
      // The camera has to be re-fitted as well, but ONLY when the canvas
      // was never properly sized -- a structure fitted to a 40px view is
      // off-screen at 1200px, which is how this looked after the resize
      // alone was added. Re-fitting on every resize would fight a user who
      // had zoomed in and then dragged the window edge, so the threshold
      // distinguishes "we were never laid out" from "the user resized".
      // Keep the canvas in step with the page. Deliberately does NOT
      // re-fit the camera: three attempts to re-zoom here (unconditional,
      // out-of-degenerate-size, and on-growth) each blanked the view in
      // the app, while the same sequence in an isolated QWebEngineView
      // was fine every time. The draw is timed correctly instead -- see
      // `_import_crystal` -- and this only keeps a window resize honest.
      window.addEventListener('resize', function () {
        viewer.resize();
        viewer.render();
        resizeGrid();
      });

      if (window.qt && window.qt.webChannelTransport) {
        // eslint-disable-next-line no-undef
        new QWebChannel(window.qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge;
        });
      }
    </script>
  </body>
</html>
