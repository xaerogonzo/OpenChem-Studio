# Naming round 9: the fix ledger. The cap is enforced HERE, by tests/test_admissions_r9.py, not in prose.
#
# WHY IT EXISTS. Round 8 planned four workstreams and then ran a second day of unplanned fixes, because nothing stopped it. Items reach the
# ledger in ONE step at the end of the instruments stage (B1, B2, B3), from the seed list plus what the battery found, and that step is
# committed as "admissions frozen". After it the SET does not move: no replacement, no late additions. (Progress fields -- status, measured
# layer, dependencies -- may change; the guard pins the admitted set by hash.)
#
# THE CAP ITSELF IS NOT PINNED TO A LITERAL NUMBER IN CODE (changed 2026-09-22, Alex: "never do those hardcoded guards again, they don't
# serve that much of a function"). The guard checks that the item count never exceeds whatever `slots` below declares, and that the frozen
# set cannot be edited quietly -- not that the number is any particular value. The round's original plan set it at 8; live diagnosis of every
# B1/B2/B3 finding surfaced 13 confirmed, narrow, independently-diagnosed items (and ruled OUT three of the original eight seed hypotheses,
# which is exactly what the instruments stage is for), and Alex chose to admit all 13 rather than defer 5 already-diagnosed defects to round
# 10 for the sake of a number picked before any measurement existed.
#
# The admission rule, which the guard applies mechanically:
#   * an item needs a TARGET SOURCE: a printed Blue Book page ("book:p.619"), a rule-derived name with the rule recorded
#     ("derived:P-16.5.1.3.1"), or "none" -- and "none" is allowed ONLY for an item that is a wrong molecule, whose fix is that the name
#     denotes the right structure and needs no preferred form;
#   * an item is a WRONG MOLECULE only if it was diagnosed as one against the INTENDED fixture structure (`diagnosed_against_fixture`),
#     never because PubChem's string differs;
#   * any other item needs its NATURAL_FREQUENCY (hits / sample size, from the B3 census) to clear `natural_frequency_min`;
#   * a wrong molecule outranks frequency for a slot. It does not escape the cap.
# A wrong molecule or structural regression introduced by THIS round's own commit is fixed or the commit reverted; that is a defect in the
# round's work and takes no slot, so it never appears here.
#
# `natural_frequency_min` is committed in R0, BEFORE the census exists, so no count can move it: 10 hits in a 2,000-structure sample. At n = 2000
# ten hits has a 95% interval of about 0.2 to 0.9%, so the number is a floor for "worth a slot", not a ranking.
#
# THREE OF THE EIGHT ORIGINAL SEED ITEMS DID NOT SURVIVE LIVE TESTING and are NOT in this ledger: F1 (charged acid substituent), F5 (one-carbon
# ketone parent enclosure -- likely already fixed by round 8's W5 work) and F6 (N,N-substituted guanidinium) all name correctly when tested
# directly against the current engine. F3 (carbazate esters) and F4 (carbonic halides/anhydrides) also round-trip correctly (right structure,
# possibly non-preferred style) and clear no frequency floor, so neither is admitted either. This is the instruments stage doing its job: a
# hypothesis written before measurement is not thereby true.

[cap]
slots = 13
natural_frequency_min = 0.005
frozen = true
# sha256 over the sorted (item_id, slot_number, admission_reason, target_source, discovery_source) tuples. The guard recomputes it and
# fails if the admitted set changes.
frozen_sha256 = "944817e6586f0639c17d80c5312a7c6376623607721e86b38b121e599af1ac81"

