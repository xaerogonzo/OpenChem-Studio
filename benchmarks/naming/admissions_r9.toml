admission_reason = "N,N'-dicyclohexylcarbodiimide (DCC), one of the most common coupling reagents in organic chemistry, is named as a saturated methylenebis(amine) -- the carbodiimide functional group (N=C=N) is not recognised at all."
wrong_molecule = true
diagnosed_against_fixture = true
target_source = "none"
seed_layer = "candidate_generation"
measured_primary_layer = "candidate_generation"
dependencies = []
