# Naming round 9 (B3): the versioned SMARTS registry for the frequency census, committed before any count
# is viewed. A count changes ONLY if a query's `version` changes -- see tools/naming_census_build.py and
# admissions_r9.toml's `natural_frequency_min` (already committed in R0, before this file existed).
#
# Each query gives NATURAL_FREQUENCY for one open shape: hits / sample size in the B3 census (an
# unenriched PubChem stride draw), never REGRESSION_COVERAGE (which comes from the tuning populations and
# says whether a class matters to the existing workload -- the two are never combined, per the plan).
#
# `smarts` is the primary rule. A query whose shape cannot be expressed in SMARTS alone (ring-system size,
# fused-ring counting) instead names its `python_predicate` -- a function in naming_census_build.py, whose
# own docstring is that query's definition instead of a SMARTS string. Every query still gets `source`
# (which seed item, or which B1/B2 finding, motivated it) and `version`.

[query.peptide_amide_bond]
version = 1
smarts = "[NX3][CX4][CX3](=O)[NX3][CX4][CX3](=O)"
definition = "An interior peptide-bond backbone fragment: R-NH-CHR'-C(=O)-NH-CHR''-C(=O)-R''' (an alpha-amino-acid residue acylating another). Verified against a Gly-Ala dipeptide backbone (match) and against plain amides including acetaminophen (no match)."
source = "seed item F2 (peptide acyl prefixes), confirmed live 2026-09-22: all 20/20 of B2's rule-built dipeptides name with fully systematic substitutive nomenclature instead of the Blue Book's retained -yl acyl convention (P-103.2.5, P-103.3.2) -- added to the registry and run against the ALREADY-DRAWN, unenriched census_sample.json after this finding, never re-drawn or cherry-picked; the query is committed here before its count is viewed, the same discipline every other query in this file already followed."

[query.charged_acid_substituent]
version = 1
smarts = "[CX3](=O)[O-,OH1]"
definition = "A carboxylate or carboxylic acid group anywhere in the structure (not distinguishing principal-group vs substituent position, which is a naming-layer fact SMARTS cannot see -- an upper bound on F1's shape, not an exact count)."
source = "seed item F1 (a charged acid group inside a substituent)"

[query.carbazate_ester]
version = 1
smarts = "[NX3][NX3]C(=O)[OX2]"
definition = "A hydrazinecarboxylate linkage (N-N-C(=O)-O), the carbazate ester functional group."
source = "seed item F3 (carbazate esters, D-088b)"

[query.chloroformate_or_carbonate_anhydride]
version = 1
smarts = ["[Cl][CX3](=O)[OX2]", "[OX2][CX3](=O)[OX2][CX3](=O)[OX2]"]
definition = "A chloroformate (Cl-C(=O)-O-) or a dicarbonate/carbonic anhydride (-O-C(=O)-O-C(=O)-O-). A structure matches if EITHER pattern matches -- a comma inside one SMARTS string is an atom-level OR, not an OR between two full patterns, so alternatives are separate list entries, not one comma-joined string."
source = "seed item F4 (carbonic acid halides and anhydrides)"

[query.diaryl_or_dialkyl_enclosed_ketone]
version = 1
smarts = "[c,C;R][CX3](=O)[c,C;R]"
definition = "A ketone whose carbonyl carbon bears a ring substituent on BOTH sides -- the shape that needs the W5 second-prefix enclosure family (P-16.5.1.3.1)."
source = "seed item F5 (one-carbon ketone parent with two prefixes)"

[query.guanidinium_cation]
version = 1
smarts = "[NX3][CX3](=[NX3+])[NX3]"
definition = "A protonated guanidine (a cationic C bonded to three nitrogens, one via a formal double bond)."
source = "seed item F6 (N,N-substituted guanidinium); B1 bucket A (bb-153b7bd9e351 and related charge-loss rows)"

[query.substituted_carbamimidoyl]
version = 1
smarts = "[CX3](=[NX2])[NX3]"
definition = "A carbamimidoyl group (-C(=N-)-N<) with a substituent on the imino nitrogen -- the shape D-091v and B1's bb-a53d359b46f8 and bb-ee1e7cac0062 both sit in."
source = "seed item F7 (substituted carbamimidoyl); B1 bucket C/F"

[query.any_formal_charge]
version = 1
smarts = "[+,-]"
definition = "Any atom carrying a formal charge -- the broadest possible baseline for B1's dominant finding (11 of 23 wrong-structure rows lost their charge state entirely). A high natural frequency here would say charged species are common enough that the charge-loss defect, wherever its root cause turns out to be, has wide reach."
source = "B1 bucket A (charge lost entirely, 11/23 rows)"

[query.isocyanide_or_nitrilium_carbanion]
version = 1
smarts = "[C-]#[N+]"
definition = "An isocyanide-type carbanion/nitrilium pair (a negatively charged carbon triple-bonded to a positively charged nitrogen) -- the exact shape of B1's bb-153b7bd9e351."
source = "B1 bucket A (bb-153b7bd9e351)"

[query.naphthalene_2_3_disubstituted]
version = 1
smarts = "[!#1]c1cc2ccccc2cc1[!#1]"
definition = "A naphthalene ring substituted at the 2- and 3-positions (across the ring fusion) -- the exact shape of B1's bb-3e0b412fafed, where the engine dropped an entire fused ring."
source = "B1 bucket D (bb-3e0b412fafed, an entire fused ring dropped)"

[query.carbodiimide]
version = 1
smarts = "[NX2]=[CX2]=[NX2]"
definition = "A carbodiimide (N=C=N, a cumulated diene) -- the exact functional group B2's DCC row (reagents_and_protecting_groups-007) found the engine does not recognise at all."
source = "B2 (DCC / N,N'-dicyclohexylcarbodiimide, the round's clearest wrong-molecule finding)"

[query.tetrahydroborate_or_aluminate_anion]
version = 1
smarts = ["[BH4-]", "[AlH4-]"]
definition = "A tetrahydroborate or tetrahydroaluminate anion (BH4- or AlH4-) -- sodium borohydride and lithium aluminium hydride's anions, for which B2 found no naming plan exists at all. A structure matches if EITHER pattern matches."
source = "B2 (reagents_and_protecting_groups-010, -011: attempted=0, no naming plan for either anion)"

[query.large_fused_polycyclic_aromatic]
version = 1
python_predicate = "large_fused_polycyclic_aromatic"
definition = "RDKit ring perception: an aromatic ring system (all bonds in the fused set aromatic) spanning 5 or more fused SSSR rings -- coronene-class systems, the shape that both hung the engine (bb-ad1954622ac3, before the per-row timeout fix) and, separately, made the von Baeyer fallback drop all ring unsaturation (B1 bucket B). Not expressible as a fixed-size SMARTS because the ring count is the variable being measured."
source = "B1 bucket B, and the coronene ring-decomposition hang naming_stage_artifact.py's timeout fix was built for"

# --- Naming round 10 (B3 extension): census queries for the round 5-8 backlog. ---
# Reuses the FROZEN census_sample.json unchanged (no redraw) and this same versioned
# registry. Discovery-only: no fix is attempted this round for any of these; the
# counts are input to a future round's admissions ledger, exactly as this file's
# round-9 queries fed round 10's ledger. Each entry below is verified against a
# stated positive and negative SMILES before its count is trusted (naming_census_count.py
# tests only run the count; the check itself is this file's own documentation).

[query.multiparent_fusion_hub]
version = 1
python_predicate = "multiparent_fusion_hub"
definition = "A ring edge-fused to 3 or more OTHER rings (a 'hub', not a simple ortho-fused chain where every ring has fusion-graph degree <= 2) -- a structural precondition for the round-5 'multiparent fusion' open item ('benzo[1,2-b:4,5-c']difuran', p. 234: no single component senior enough to be THE parent). An upper bound on that shape, not an exact count: the true condition is about nomenclature seniority, which this predicate does not decide. Verified: triphenylene and pyrene match (True), anthracene/naphthalene/benzene do not (False)."
source = "round 5's open list, 'multiparent systems'"

[query.aba_silicon_chain]
version = 1
smarts = "[SiX4][NX3][SiX4]"
definition = "A silicon-nitrogen-silicon (Si-NH-Si) chain motif -- the a(ba)n heterounit shape from D-089u (Si-NH-Si, 'disilaazane'/'N-silylsilanamine'). Verified: 'C[SiH2]N[SiH2]C' matches; a bare silane ('C[SiH3]') or a single Si-N bond with no second Si ('CN[SiH3]') does not."
source = "round 5/6's open list, D-089u (Si-NH-Si)"

[query.ring_nitrogen_acyl_on_chain]
version = 1
smarts = "[#7;R][CX3](=O)[#6;!R]"
definition = "A ring nitrogen acylated by a chain (non-ring) carbonyl carbon -- the round-8 'ring-N-amide acyl prefix' shape (a formyl/acyl group on a ring nitrogen named on the methane parent rather than as a ring-N-carbonyl prefix, e.g. piperidine-1-carbonyl). Verified: N-acetylpiperidine matches; acetanilide (N attached to but not IN a ring) and a plain chain amide do not."
source = "round 8's open list, 'the acyl prefix of a RING-nitrogen amide on a ring or chain parent'"

[query.symmetric_12_diketone]
version = 1
smarts = "[cX3][CX3](=O)[CX3](=O)[cX3]"
definition = "A 1,2-diketone flanked by aromatic rings on both carbonyls (the benzil shape, round 8's open item: the book omits the locants of a symmetrical ethane-1,2-dione and the rule is not built). Verified: benzil itself matches; an aliphatic 1,2-diketone (biacetyl) and a mono-aryl ketone do not."
source = "round 8's open list, 'benzil'"

[query.diacyl_peroxide]
version = 1
smarts = "[CX3](=O)[OX2][OX2][CX3](=O)"
definition = "A diacyl peroxide (R-C(=O)-O-O-C(=O)-R), round 8's open item ('diacetyl peroxide', found by probing, not investigated). Verified: diacetyl peroxide matches; a plain ester and a dialkyl peroxide (no carbonyl) do not."
source = "round 8's open list, 'diacyl peroxides, xanthate esters'"

[query.xanthate_ester]
version = 1
smarts = "[SX2][CX3](=[SX1])[OX2]"
definition = "A xanthate ester (R-O-C(=S)-S-R'), round 8's open item ('O-ethyl S-methyl carbonodithioate', found by probing, not investigated). Verified: O-ethyl S-methyl xanthate matches; a plain carbonate ester and a dialkyl sulfide do not."
source = "round 8's open list, 'diacyl peroxides, xanthate esters'"

# --- Naming round 11 (B3 extension, round 2): 6 more still-unmeasured shapes from the round 3-8 backlog.
# Same discipline as round 10: reuses the FROZEN census_sample.json unchanged, discovery-only, each entry
# verified against a stated positive and negative SMILES before its count is trusted. Deliberately skips
# shapes round 9/10 already measured (charged_acid_substituent, diaryl_or_dialkyl_enclosed_ketone,
# substituted_carbamimidoyl, ring_nitrogen_acyl_on_chain, multiparent_fusion_hub, and the four 0-hit rows)
# even though several of those are still open -- this round's Part B fixes off the EXISTING numbers for
# those, no re-measurement needed.

[query.nalkoxy_amide_family]
version = 1
smarts = ["[NX3]([OX2][#6])[CX3]=O", "[NX3;!$(N[CX3]=[OX1])][OX2][#6]"]
definition = "An N-alkoxy amide/thioamide (N-OR on an amide nitrogen) OR a bare N-O-C ether not itself part of an amide (an O-alkylhydroxylamine). Verified: N-methoxy-N-methylacetamide and O-methylhydroxylamine both match; plain N,N-dimethylacetamide and methanol do not."
source = "round 8's open list, 'an N-alkoxy THIOAMIDE, an N,N-dialkoxy amide, O-alkylhydroxylamines'"

[query.polynitrate_ester]
version = 1
python_predicate = "polynitrate_ester"
definition = "Two or more distinct nitrate-ester groups (R-O-[N+](=O)[O-]) on one skeleton -- D-123 only names a single nitrate; a polyol's polynitrate (propane-1,2,3-triyl trinitrate, i.e. nitroglycerin) needs a multivalent organyl. Counts distinct nitrogen atoms across all matches, so it isn't fooled by overlapping substructure matches on the same group. Verified: nitroglycerin's charge-separated SMILES matches; a mono-nitrate ester and ethanol do not."
source = "round 8's open list, 'several nitrate groups'"

[query.condensed_guanidine_urea_n5]
version = 1
smarts = "[NX3]C(=[NX2,OX1])[NX3]C(=[NX2,OX1])[NX3]C(=[NX2,OX1])[NX3]C(=[NX2,OX1])[NX3]"
definition = "A condensed guanidine/urea chain of 4 linked central carbons (5 nitrogens) -- the round-8 'n >= 5' shape (2,4-diimidotricarbonic diamide and beyond; the substituted variant specifically, since the bare n=5 chain itself was fixed under D-091t). Does not itself test for a substituent on an interior nitrogen -- an upper bound on the shape, same convention as this file's other SMARTS-only queries whose SMARTS can't see a naming-layer fact. Verified: a linear chain of 4 urea units matches; biuret (n=3) and plain urea do not."
source = "round 8's open list, 'condensed guanidines and ureas with n >= 5 AND substituents'"

[query.betaine_cationic_prefix]
version = 1
smarts = "[N+;H0]([#6])([#6])([#6])[CX4][CX3](=O)[O-]"
definition = "A quaternary (no-H) ammonium bonded through one carbon to a carboxylate -- the betaine shape (round 7's open item, source unresolved between the trimethylazaniumyl and N,N-dimethylmethanaminiumyl prefix forms). Requires H0 on the nitrogen specifically to exclude a plain protonated amino-acid zwitterion, whose ammonium nitrogen carries H. Verified: trimethylglycine (betaine) matches; the glycine zwitterion (NH3+, not quaternary) and choline (no anion) do not."
source = "round 7's open list, 'a betaine's cationic prefix'"

[query.second_class_zwitterion]
version = 1
smarts = "[NX4+][CX4]([CH2][O-])[CX3](=O)[O-]"
definition = "An ammonium alpha-carbon bearing BOTH a carboxylate and a second anionic group (an alkoxide, via a CH2) -- the serinate shape (round 7's open item: acid_anion_route returns None for two anion classes at once, so the carboxylate is never carved). Verified: serinate (the alkoxide form of serine's zwitterion) matches; the alanine zwitterion (only one anion) and neutral serine (no alkoxide) do not."
source = "round 7's open list, 'a zwitterion with an anion of ANOTHER class'"

[query.fused_aromatic_ring_cation]
version = 1
python_predicate = "fused_aromatic_ring_cation"
definition = "An aromatic atom carrying a formal positive charge that sits in a ring edge-fused to at least one other ring -- a coarse structural proxy for round 8's 'a fused ring cation with no curated entry' (the imidazo[4,5-d]imidazole cation and similar). Does not check whether the specific ring actually has a curated/retained name; a hit needs manual triage against the ring table before it says anything about THIS defect, more so than this file's other predicates. Verified: an N-methylisoquinolinium cation matches; a single-ring pyridinium and neutral naphthalene do not."
source = "round 8's open list, 'the imidazo[4,5-d]imidazole cation and other cations of a fused ring with no curated entry'"
