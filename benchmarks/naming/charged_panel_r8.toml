# The charged-species ADDENDUM panel (naming round 8).
#
# WHY IT EXISTS. Round 7's 108-row panel was built by class and still had the classes its author
# thought of. A driven check of the app's salt panel, run AFTER round 7's final evaluation, found
# what it could not: the trianion of a tricarboxylic acid was named with one carboxylate as a
# neutral 'carboxy' prefix, and a biguanidium cation as a dication. No row of the round-7 panel had
# three acid groups. The lesson is process: a panel of a DIFFERENT SHAPE runs before the final
# evaluation, and this is the first one built to be that.
#
# THE ROUND-7 PANEL (charged_panel.toml) IS IMMUTABLE and is not touched. This file is a separate
# panel with its own hash pin, baseline and adjudication.
#
# INDEPENDENCE. Built from the round's class space (polyacids, condensed guanidines and ureas,
# protonated azoles and other cations) and round 7's known failures ONLY. It was frozen BEFORE the
# one wrong row of heldout_v4 was read, so it cannot have been shaped by that failure. No engine
# output chose a row and NO TARGET came from the engine: the Blue Book (BlueBookV2.pdf) is the only source.
#
# THE MATRIX IS THE ACCEPTANCE OBJECT. Each row is a deliberately chosen valid cell, not a cell of
# a Cartesian product. Columns beyond round 7's:
#   site_vector         which sites are charged, one letter per site (A:- is deprotonated, A:COOH is not)
#   structural_context  acyclic | aromatic | heterocyclic | fused | salt | zwitterion
#   coverage_reason     which seam or boundary the row tests, so the panel reads as a coverage design
#
# TARGET BASIS (never collapsed): PRINTED = the book prints this exact name for this structure, page
# cited; DERIVED = the book prints the RULE and a printed example of the same shape, and the name is the
# rule applied (marked derived, never scored as if IUPAC printed it); NONE_VERIFIED = searched and not
# found, so the row constrains STRUCTURE and OWNERSHIP but never the string.
#
# PRIMES: the book prints the primed locant with U+2032 (N′1); every target here uses the ASCII apostrophe
# (N'1), which is what the engine emits and what the existing adjudication targets use, so an exact
# comparison is not defeated by a character. OPSIN reads the ASCII form.
#
# PAGES are pdf pages counted from 1, the convention rounds 5-7 used in prose. NOTE: D-091t was
# recorded as 'p. 662'; the passage is on pdf p. 663 (index 662), and the earlier figure was the
# zero-based index.

