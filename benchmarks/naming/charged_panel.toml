# The charged-species panel (naming round 7).
#
# WHY IT EXISTS. Round 7 began with a defect that was in NO corpus: a carboxylate
# that also carries a neutral OH was named as if the OH were the principal group.
# Two guards each assumed the other owned the mixed case, so nothing did. A corpus
# built from PubChem draws cannot find that: it finds what PubChem contains. This
# panel is built BY CLASS instead, so a hole between two routes shows up as a row
# in an empty cell.
#
# HOW IT WAS BUILT. Class (the charged group) x secondary group (the neutral group
# beside it) x context (isolated ion, salt with an inorganic cation, salt with an
# organic cation, hydrate). Rows were chosen because the cell exists, never because
# the engine does something odd on them, and NO target below came from the engine.
# The Blue Book is the only source: BlueBookV2.pdf, sha256 in adjudication.toml.
#
# TARGET BASIS (machine-readable, and never collapsed):
#   PRINTED        the book prints this exact name for this structure, page cited
#   DERIVED        the book prints the RULE; the name is the rule applied to the neutral
#                  parent's PIN. Marked derived and never scored as if IUPAC printed it
#   NONE_VERIFIED  searched, and the book prints neither the name nor a rule that fixes
#                  it. The row still constrains STRUCTURE and, for an anion, OWNERSHIP;
#                  it does not constrain the string. This is NOT the same as an
#                  UNDECIDED adjudication verdict (sources that do not resolve a case).
#
# ERRATA (each made BEFORE any fix existed, so none can be a retarget to fit one):
#   1. F0-carnitine-like: the derived target denoted a four-carbon acid for a three-carbon
#      structure. Found by parsing every target with OPSIN and requiring it to denote its own
#      row (tests/test_charged_panel.py keeps that check). Now NONE_VERIFIED.
# Retained amino-acid names (alaninate, prolinate, tyrosinate, cysteinate, glutamate) denote the
# L-isomer while the rows are drawn without stereochemistry; the comparison is on the string, and
# the target audit allows a stereo-only difference for exactly these.
#
# FROZEN AFTER THE BASELINE. Once the baseline is committed no row is added, removed or
# retargeted to fit a fix. A failure found later is logged R7-UNPLANNED in the round's
# notes and either mapped to a row here or admitted through the round's open-list rule;
# otherwise this becomes one more tuning set. tests/test_charged_panel.py enforces the
# row count and a hash of the rows.
#
# `expected_owner` is the SEMANTIC owner (what the class is), not the function that
# implements it: ACID_ANION, OLATE_ANION, N_ANION, ZWITTERION, CATION, or per_component
# for a salt. `permute = true` runs the salt with its components in the other order and
# with a water between them; the answer must not depend on order.

