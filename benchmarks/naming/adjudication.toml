# Adjudicated naming disagreements
#
# WHY THIS FILE EXISTS. The benchmark's primary gate is the OPSIN round trip,
# which answers "does this name denote this molecule" and is blind to whether
# the name is the PREFERRED one. Agreement with PubChem's string is the only
# other signal, and PubChem's displayed "IUPAC Name" is GENERATED by a second
# engine rather than curated -- so a disagreement means two programs differ,
# not that ours is wrong.
#
# So each disagreement gets a verdict with evidence, and the evidence is the
# Blue Book rather than either engine. Without this the fixes have no target:
# a pinned expectation that was never checked is how D-022z came to hold the
# wrong name for a month.
#
# THE ENGINE MAY NOT CERTIFY ITS OWN OUTPUT. `preferred_name_source` is never
# this engine. OPSIN establishes structural equivalence and is never the
# authority on whether a name is preferred.
#
# Source of record for every row below:
#   source_id      BLUEBOOK_2013_CORRECTED_2022
#   source_file    BlueBookV2.pdf
#   source_sha256  6b607a40430b95b4370c474d7b7afc5c9906b68c683192fb0c07f9aed3fb563f
#   published      IUPAC, openly at https://iupac.qmul.ac.uk/BlueBook/
#
# VERDICTS
#   ENGINE_WRONG                a cited paragraph and the violation
#   PUBCHEM_NOT_PREFERRED       a source-backed PIN, not "PubChem looks informal"
#   BOTH_VALID                  structurally equivalent, both permitted
#   BOTH_NOT_PREFERRED          neither string is the PIN
#   VALID_NO_UNIQUE_PREFERENCE  validity established, uniqueness not
#   UNDECIDED                   the sources do not resolve it; a legal outcome
#
# fix_status says what happened in the CODE, as a field rather than as prose:
#   FIXED           the engine now emits the adjudicated target
#   PARTLY_FIXED    it moved toward the target and a named defect remains
#   OPEN            adjudicated, not yet implemented
#   NOT_APPLICABLE  nothing to change; recorded so it is not "tidied" later
#
# COVERAGE. This is not yet the whole disagreement list. Completed here: the
# retained-name-versus-PIN class, which was the largest single group. The rest
# are named at the bottom so the gap is visible rather than implied.

[meta]
schema_version = 1
source_id = "BLUEBOOK_2013_CORRECTED_2022"
source_sha256 = "6b607a40430b95b4370c474d7b7afc5c9906b68c683192fb0c07f9aed3fb563f"
adjudicated = "2026-09-17"
classes_complete = ["retained_name_vs_pin"]

# ---------------------------------------------------------------------------
# The retained-name class
#
# `toluene` and `1,4-xylene` are the reason this class needed evidence rather
# than intuition: I had both filed the wrong way round before reading P-22.1.3.
# ---------------------------------------------------------------------------

[[row]]
corpus_row_id = "toluene"
smiles = "Cc1ccccc1"
engine_name = "toluene"
pubchem_name = "toluene"
verdict = "BOTH_VALID"
fix_status = "NOT_APPLICABLE"
preferred_name = "toluene"
preferred_name_source = "BLUEBOOK_2013_CORRECTED_2022"
rule = "P-22.1.3"
evidence_basis = "explicit"
evidence_quote = """
Toluene and xylene are preferred IUPAC names, but are not freely
substitutable; toluene is substitutable under certain conditions, but only for
general nomenclature. ... toluene (PIN) (no substitution; for general
nomenclature substitution is permitted only by groups listed in P-15.1.8.2.2)
"""
note = """
A retained name that IS the preferred name. What P-22.1.3 restricts is
SUBSTITUTION, not the bare name -- so an audit that demoted every retained
name would have broken this one. Marked pin_status = PIN in the registry.
"""

