`1,3,7-trimethylpurine-2,6-dione`, was PubChem's string, and it cites no
hydrogen at all -- purine needs one indicated hydrogen. P-58.2.3.1.3 (quoted
as a rule) puts it at N1, the lowest position; the saturated N3 and N7 are
hydro positions. The engine now emits that.
"""

