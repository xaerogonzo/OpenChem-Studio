# The ordinary-compound battery (naming round 9, B2): its category inventory, sources and inclusion rules,
# written and committed BEFORE any compound is chosen. `tools/naming_battery_build.py` records this file's
# sha256 in `battery_r9.toml`'s own header; a test fails if either moves without the other.
#
# WHAT B2 IS FOR. B1 measures against the Blue Book's printed PINs -- a preference oracle. B2 is not: it
# measures DISCOVERY (does the engine even produce a structurally correct name for common chemistry?) and
# REGRESSION (does a later fix move any of these). No row here ever becomes a preferred-name target; a target
# needs a printed Blue Book name or a rule-derived name with the rule recorded, exactly as the plan requires.
#
# DEVIATION FROM THE APPROVED PLAN, RECORDED HERE RATHER THAN LEFT IMPLICIT. The plan's B2.1 named citable
# lists (an essential-medicines list for drugs, a book's own carbohydrate examples for sugars, etc.) as the
# default sourcing route. Assembling those by hand from outside this session risks exactly the failure this
# project's "fields nobody can check" lesson describes: a citation I cannot verify here is a citation that
# can be silently wrong, and B2's whole point is a battery whose STRUCTURE identity is trustworthy. Four
# categories below are sourced by RULE or by an already-vetted in-repo asset instead of a hand-curated list;
# three plan categories (sugars, vitamins, dyes) are DROPPED this round rather than sourced on a citation I
# could not check, matching this project's standing practice of not shipping what cannot be validated
# (Miller polarizability, HLB, TSEI). This is a real deviation from the approved plan's wording, flagged to
# Alex in the round-9 status report rather than buried in a commit message.

[protocol]
version = 1
frozen_before = "any compound is selected for any category"

# --- structure resolvers: two STRUCTURE services, not nomenclature authorities (plan B2.2) -------------------
# Agreement between them gives fixture-structure confidence and nothing more; it never creates a naming
# target. Used only for the categories marked resolver_checked = true below.
[resolvers]
primary = "pubchem_by_name"     # through openchem.net
secondary = "opsin_by_name"     # through naming_providers.opsin_structures_for_names
on_ambiguous = "RESOLVER_AMBIGUOUS"   # dropped and logged, never an engine failure
on_disagree = "RESOLVER_DISAGREE"     # dropped and logged, never an engine failure

# --- outcome classes (plan B2.3) -------------------------------------------------------------------------------
[outcomes]
classes = [
  "RESOLVER_AMBIGUOUS",
  "RESOLVER_DISAGREE",
  "ENGINE_PLAN_FAILURE",                       # no plan of the wanted shape existed (candidate failure)
  "ENGINE_WRONG_STRUCTURE",                    # engine's own name fails to round-trip to the INTENDED structure
  "STRUCTURALLY_EQUIVALENT_NAME_DIFFERENCE",   # correct structure, a different valid name
  "MATCH",
]

# =================================================================================================================
# Categories. Each table: count (target size), inclusion_rule (exactly reproducible), source, resolver_checked.
# =================================================================================================================

[category.functional_group_pairs]
count = 66                              # C(12,2): every unordered pair from `groups` below, one representative each
inclusion_rule = """
Fixed list of 12 functional groups (below). For every unordered pair of two DIFFERENT groups, build one
representative structure: both groups attached to a propane-1,3-diyl scaffold (position 1 and position 3),
built directly as SMILES by `tools/naming_battery_build.py`'s own generator -- never looked up by name. A pair
whose two groups cannot both be represented on the same scaffold without a third reactive site (e.g. two
groups that would react with each other on adjacent carbons) is generated on a longer, explicitly logged
scaffold instead (hexane-1,6-diyl); the substitution is recorded per row, not silent.
"""
groups = [
  "hydroxyl", "primary_amine", "carboxylic_acid", "ester", "primary_amide", "nitrile",
  "chloro", "ether", "ketone", "aldehyde", "nitro", "thiol",
]
source = "generated by rule; no external list"
resolver_checked = false                # structure identity comes from the generator, not a name lookup
structure_agreement_rule = "N/A -- SMILES is the ground truth by construction"

[category.approved_drugs_chembl]
count = 50
inclusion_rule = """
ChEMBL compounds with max_phase = 4 (approved), structures taken from ChEMBL directly. A deterministic
seeded sample of 50 (seed 20260922, sorted by ChEMBL ID before sampling so the draw does not depend on
API response order) out of the full max_phase=4 pool at draw time. The ChEMBL release version and the
exact ID list are recorded in `battery_r9.toml`'s meta, so the sample is reproducible against that release
even if ChEMBL's max_phase=4 set later grows.
"""
source = "ChEMBL (max_phase=4), a versioned external database -- not a hand-curated list"
resolver_checked = true                 # ChEMBL structure cross-checked against PubChem by name
structure_agreement_rule = "PubChem structure for the ChEMBL preferred name must match the ChEMBL structure; a mismatch is RESOLVER_DISAGREE, dropped and logged"

[category.amino_acids_and_peptides]
count = 40                              # 20 proteinogenic amino acids + 20 seeded dipeptides
inclusion_rule = """
The 20 proteinogenic L-amino acids (a closed, uncontroversial list -- not a citation risk in the sense this
file is otherwise avoiding). Plus 20 dipeptides built by rule: a deterministic seeded sample (seed 20260922)
of 20 unordered pairs from the same 20 amino acids, each built into a dipeptide SMILES directly by
`tools/naming_battery_build.py` (peptide bond constructed programmatically, not looked up).
"""
source = "standard proteinogenic amino acid list; dipeptides generated by rule"
resolver_checked = true                 # the 20 amino acids only, against PubChem by name; dipeptides are generated, not looked up
structure_agreement_rule = "PubChem structure for each amino acid's common name must match the standard structure; dipeptides are N/A (generated)"

[category.salts]
count = 24
inclusion_rule = """
A fixed list of 6 common cations x 6 common anions (below), every charge-balanced combination built
directly as a multi-component SMILES by rule (never looked up by name), capped at 24 by dropping
combinations whose charge cannot balance with a 1:1 or 1:2 or 2:1 stoichiometry (recorded, not silent).
"""
cations = ["Na+", "K+", "NH4+", "Ca2+", "Mg2+", "Fe3+"]
anions = ["Cl-", "Br-", "NO3-", "SO4_2-", "CO3_2-", "PO4_3-"]
source = "generated by rule; no external list"
resolver_checked = false
structure_agreement_rule = "N/A -- SMILES is the ground truth by construction"

[category.solvents]
count = 91
inclusion_rule = """
Reuses `benchmarks/solubility/nonaqueous.py`'s existing 91-solvent lookup table VERBATIM (already vetted
and committed in this repository for the solubility predictor). No new sourcing risk: this is an in-repo
asset, not a fresh citation.
"""
source = "benchmarks/solubility/nonaqueous.py (already committed, already vetted)"
resolver_checked = true                 # names cross-checked against PubChem, since the existing table is keyed by common name
structure_agreement_rule = "PubChem structure for the table's common name must match the table's own recorded structure; a mismatch is RESOLVER_DISAGREE, dropped and logged"

[category.reagents_and_protecting_groups]
count = 14
inclusion_rule = """
A fixed, hand-listed set of 14 protecting-group and coupling reagents that are standard organic-chemistry
vocabulary (Boc2O, Cbz-Cl, Fmoc-Cl, TBSCl, TBDPSCl, TrCl, PMB-Cl, DCC, DIC, DMAP, NaBH4, LiAlH4, TFA, TMSCl)
-- judged low citation-risk in the way an "essential medicines list" is not: these names and structures are
textbook-level, not sourced from a list that could itself be wrong or contested. Listed by name here so the
choice is auditable, not asserted without a trace.
"""
reagents = ["Boc2O", "Cbz-Cl", "Fmoc-Cl", "TBSCl", "TBDPSCl", "TrCl", "PMB-Cl", "DCC", "DIC", "DMAP", "NaBH4", "LiAlH4", "TFA", "TMSCl"]
source = "hand-listed, standard organic-chemistry reagents; not an external citation"
resolver_checked = true
structure_agreement_rule = "PubChem structure for the common name must match OPSIN's structure for the same name; a mismatch is RESOLVER_DISAGREE, dropped and logged"

# --- dropped this round, recorded rather than silently absent -------------------------------------------------
[dropped]
categories = ["sugars", "vitamins", "dyes"]
reason = """
No reproducible rule-based generator and no already-vetted in-repo asset was available for these three
plan categories within this session, and a hand-curated list risks the citation-fidelity failure this
protocol is designed to avoid. Recorded for a future round rather than sourced on an unverifiable citation.
"""
