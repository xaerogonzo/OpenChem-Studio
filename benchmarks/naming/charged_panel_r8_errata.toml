# Errata overlay for charged_panel_r8.toml (naming round 8).
#
# THE PANEL FILE IS IMMUTABLE (its hash is pinned), so a correction to what it says goes here, keyed by row id, and the
# panel is never edited. Found while checking the panel's citations, after it was frozen and before any fix was measured:
# every row's PDF PAGE and PRINTED NAME were verified (each printed name was found on its page), but the PARAGRAPH
# NUMBER in a row's `source` was, for most rows, inferred from neighbouring text and never checked. A paragraph
# number is the one field nothing else verifies, which is why it is where citation errors hide.
#
#   [[verified_paragraph]]   the paragraph number was checked against the book text or the rendered page
#   [[unverified_paragraph]] the paragraph number in the panel's `source` is NOT evidence; cite the page and the printed
#                            name only. `cited` is exactly what the panel says, so this overlay stays tied to it

