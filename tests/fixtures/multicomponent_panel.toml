# The multicomponent / ionic robustness panel (round 5, branch S0).
#
# FIXED BEFORE ANY CALCULATOR WAS RUN OVER IT, and chosen for SHAPE, not
# for what any calculator does with it. Branch B4 found by accident that one
# descriptor raising on sodium took every result of a sodium salt with it;
# this panel is how the other calculators get asked the same question on
# purpose. Each row says what shape it is and why it is here.
#
# `control` names the row this one should be compared with, where a neutral
# or single-component counterpart exists. Every SMILES here was checked to
# parse, and its component count is what RDKit reports.

# --- an inorganic counter-ion -------------------------------------------------

[[row]]
id = "sodium_acetate"
smiles = "CC(=O)[O-].[Na+]"
shape = "inorganic_counterion"
control = "acetic_acid"
why = "the salt B4 was found on; one monovalent metal cation"

