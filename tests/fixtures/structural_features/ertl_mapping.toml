why = "diazomethane drawn [CH2-][N+]#N: ifg.py marks carbons by bond order and this resonance form draws C-N single, so the carbon is unmarked. It IS the diazo carbon (p. 409)."

[outside."fg:imide"]
examples = ["Cn1c(=O)c2c(ncn2C)n(C)c1=O"]
why = "as fg:carboxamide: caffeine's aromatic ring C=O."

[outside."fg:ketone"]
examples = ["CC1CN(CC(C)N1)c2c(F)c(N)c3c(=O)c(cn(C4CC4)c3c2F)C(=O)O", "NC1CCCCN(C1)c2c(Cl)cc3c(=O)c(cn(C4CC4)c3c2Cl)C(=O)O"]
why = "as fg:carboxamide: a 4-quinolone's aromatic ring C=O."

[outside."fg:lactam"]
examples = ["CCOc1c(N(CCO)CC(=O)O)cnn(C)c1=O", "Cn1c(=O)c2c(ncn2C)n(C)c1=O"]
why = "as fg:carboxamide: an aromatic ring C=O ifg.py does not mark."

[outside."fg:lactone"]
examples = ["CC(=O)CC(c1ccccc1)c1c(O)c2ccccc2oc1=O", "Nc1c(Nc2ccccc2)c2ccccc2oc1=O"]
why = "as fg:carboxamide: a coumarin's aromatic ring C=O."

[outside."fg:urea"]
examples = ["Cn1c(=O)c2c(ncn2C)n(C)c1=O"]
why = "as fg:carboxamide: caffeine's aromatic ring C=O."

[outside."sf:carbanion"]
examples = ["C=C[CH2-]", "C[CH-]C", "[CH2-]C"]
why = "as sf:carbocation."

[outside."sf:carbocation"]
examples = ["C=C[CH2+]", "C[C+](C)C", "C[CH+]C"]
why = "Ertl marks heteroatoms and four kinds of carbon (p. 2); a charged carbon is none of them."
