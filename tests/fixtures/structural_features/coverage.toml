# The coverage matrix for vocabulary v2 (src/openchem/chem/feature_vocabulary.py).
#
# WRITTEN BEFORE THE PATTERNS, so the patterns are tested against it rather
# than it being fitted to them. One [[feature]] table per feature id, in the
# vocabulary's declared order:
#
#   positive  SMILES with the expected atoms marked: an atom of role i
#             (1-based, the feature's `roles`) of instance k (0-based) carries
#             atom-map number 10*k + i. Unmarked atoms belong to no instance of
#             THIS feature. Every instance of the feature in the molecule is
#             marked, so an extra detection fails as surely as a missing one.
#   negative  the nearest confusables, which must produce NO instance of it,
#             each with the reason (the clause of the operationalisation note
#             it tests).
#   charged   for every charge state other than neutral: the same group drawn
#             in that state, marked as for `positive`, plus the state.
#
# A LIMIT OF THE FORMAT: one atom carries one map number, so two instances
# that SHARE an atom (a trialkoxysilane's three Si-O-C on one Si) cannot be
# marked; such cases use a molecule with one instance instead.
#
# Disconnected-component obligations are generated by the test from the
# first positive (a counter-ion appended, the molecule duplicated), so every
# feature carries them without restating them here.
#
# Normative fixtures (here), overlap fixtures ([[overlap]] below) and the Ertl
# mapping fixtures (B1) are DIFFERENT molecules; a test enforces that.
#
# FG-nnn names a defect of the v1 vocabulary this row demonstrates; the
# defect register is tests/test_feature_known_defects.py (added with the
# detector in B1, since a defect row needs something to run against).

# --- acids and their derivatives ----------------------------------------------

[[feature]]
id = "fg:carboxylic_acid"
positive = ["C[C:1](=[O:2])[OH:3]", "[O:2]=[C:1]([OH:3])c1ccccc1[C:11](=[O:12])[OH:13]", "[CH:1](=[O:2])[OH:3]"]
negative = [
  { smiles = "CC(=O)OC", why = "an ester: the second oxygen bears carbon" },
  { smiles = "NC(=O)O", why = "carbamic acid: the carbonyl carbon bears N" },
  { smiles = "OC(=O)O", why = "carbonic acid: the carbonyl carbon bears O" },
  { smiles = "CC(=O)OO", why = "a peroxy acid is a hydroperoxide" },
]
charged = [{ smiles = "C[C:1](=[O:2])[O-:3]", state = "anionic", defect = "FG-003" }]

[[feature]]
id = "fg:thiocarboxylic_acid"
positive = ["C[C:1](=[O:2])[SH:3]", "C[C:1](=[S:2])[OH:3]", "C[C:1](=[S:2])[SH:3]", "c1ccccc1[C:1](=[O:2])[SH:3]", "[CH:1](=[O:2])[SH:3]"]
negative = [
  { smiles = "CC(=O)SC", why = "a thioester: the single-bonded S bears carbon" },
  { smiles = "CC(=O)O", why = "the oxygen carboxylic acid" },
  { smiles = "CCS", why = "a thiol: no acyl carbon" },
  { smiles = "NC(=O)S", why = "carbamothioic S-acid: the carbonyl carbon bears N" },
  { smiles = "CC(=S)N", why = "a thioamide" },
]
charged = [
  { smiles = "C[C:1](=[O:2])[S-:3]", state = "anionic" },
  { smiles = "C[C:1](=[S:2])[O-:3]", state = "anionic" },
]

[[feature]]
id = "fg:carboxylic_ester"
