negative = [
  { smiles = "CC(=O)O", why = "an acid: the oxygen bears H" },
  { smiles = "CNC(=O)OC", why = "a carbamate: the carbonyl carbon bears N" },
  { smiles = "COC(=O)OC", why = "a carbonate: the carbonyl carbon bears two O" },
  { smiles = "CC(=O)SC", why = "a thioester: the ester atom is S" },
]

[[feature]]
