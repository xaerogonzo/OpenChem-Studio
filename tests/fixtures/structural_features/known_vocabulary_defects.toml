# Feature-vocabulary defects the sweep found and has NOT fixed. THIS LIST ONLY SHRINKS.
#
# Each row is a molecule on which one feature's pattern matched a group in a charge
# state that feature does not declare (`UndeclaredChargeState`) -- the same class of
# defect as `fg:hydrazine` matching a nitramine's N-N, which took every functional-group
# alert for the molecule down with it. The application detects tolerantly now
# (`detect_features_tolerant`), so each of these costs ONE instance and a recorded
# `Completeness`, not the whole molecule; the strict detector still raises, which is
# what `tests/test_feature_vocabulary_sweep.py` uses to find them.
#
# Found 2026-09-24 by running the strict detector over 2,187 molecules (the census panel,
# the naming corpus and the naming census sample) in under five seconds. Fixing one means
# DECIDING what the vocabulary says about that charge state -- declare a label for it (an
# anionic sulfonamide is a real, commonly drawn form) or exclude it in the pattern (an
# acylguanidinium's nitrogen is not an amide nitrogen) -- which is a vocabulary decision,
# not a patch, so they are listed rather than silently changed. Fix it, delete its row.

