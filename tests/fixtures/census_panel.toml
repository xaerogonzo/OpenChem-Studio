# The calculator census panel (`tools/calculator_census.py`).
#
# FIXED BEFORE ANY CALCULATOR WAS RUN OVER IT, and chosen for SHAPE -- what kind
# of structure it is and what that kind has been known to break -- not for what
# any calculator does with it. Each row says which live finding put it here.
# The strata are the ones a result must be reported by: an aggregate over a big
# ordinary set hides a calculator that fails on exactly one class.
#
# The first block is the structures that started this: 1,3-dinitro-1,3-diazetidine
# crashed the alert pass (a feature pattern matched its N-N bond) and made
# Solubility fail (its ring N was counted as a base). The rest are the classes a
# review of that session asked for.

