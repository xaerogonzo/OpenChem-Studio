# The naming-consumer manifest: every test file that consumes the namer, with why, scope and owner.
#
# WHY IT EXISTS. Naming round 3 left a test file red for six stages because each stage ran only the naming tests,
# and the file that consumed names was not one of them. "The whole naming-consuming test set" was a phrase in a
# routine, not a list, so it drifted. This is the list. `tests/test_naming_consumers_manifest.py` fails on a test that
# imports the namer and is not registered here, so it cannot silently go stale again, and
# `tools/naming_consumers.py --scope ...` prints the pytest arguments a stage should run.
#
#   scope   core       the engine's own contract tests (preference key, ownership, known defects, enclosure, ...)
#           benchmark  a frozen population, panel, adjudication or registry guard
#           app        the application layer reading names (providers, annotation, reports, docs guards)
#           vendor     the vendored suite, run as ONE unit (tests/vendor/iupac_namer)
#   owner   the area that must be re-run when it changes: "namer", "benchmarks" or "app"
#
# Support files (tests/conftest.py, helpers under tests/vendor/) are not consumers and are not listed.

[[consumer]]
file = "tests/vendor/iupac_namer"
